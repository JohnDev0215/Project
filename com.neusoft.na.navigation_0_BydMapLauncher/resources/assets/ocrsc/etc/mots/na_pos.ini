# This file contains GreatWallV61 specific custom overrides for na_pos.ini. This file
# should not contain target specific configurations, but generic configurations
# for MOTS across all platforms.

# Note: additional Android specific switches can be found in
#       integration\mots\android\ocservice\src\main\java\com\neusoft\na\ocservice\PosService.kt


[SensorClient]
enabled                        = true
host                           = 127.0.0.1 # 192.168.1.193
port                           = 32042

[DLT]
   Output    = 0x0000
   Context   = .* 0x0

[Positioning]
#gnss_loss_time_threshold       = 2000      # gnss status is not sent,[default:= 2000ms], The minimun value should be greater than 2000ms.

[PUBLICIF]
gnss_nmea_head                  = $GNGGA
gnss_nmea_tail                  = $GLGSV

[DR]                                      # dead reckoning general choices
calibration_section            = CS-GWV61 # use that section to init DR


[CS-GWV61]
origin_gps                     = 25       # OGN_ANDROID_HU
origin_speed                   = 24       # OGN_PUBLIC_IF
origin_angular_velocity        = 24       # OGN_ANDROID_MOBILE
origin_acceleration            = 24       # OGN_ANDROID_MOBILE
gps_cno_threshold              = 18       # set cno threshold for GPS evaluation (unsigned integer)
gps_cno_audit_threshold_offset = 8        # enable automatic gps_cno_threshold calculation with this offset from calculated average
prescale_gyro                  = -0.001
pitch_evaluation               = on       # disable pitch evaluation
acc3d_posx                     =  0
acc3d_posy                     =  0
acc3d_posz                     =  0
acc3d_angle_yaw                =  14.8482
acc3d_angle_pitch              =  0
acc3d_angle_roll               =  0
gyro3d_angle_yaw               =  14.8482
gyro3d_angle_pitch             =  0
gyro3d_angle_roll              =  0

