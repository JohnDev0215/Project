# This file contains GreatWallB01 specific custom overrides for na_sens.ini.

[DLT]
   Output    = 0x0000
   Context   = .* 0x0

[AndroidMobile]
accl_g_unit         = false       # in units  g or m/s^2
gyro_radian_unit    = true        # in units radian/second or degree/second
accl_x              = -y          # in used 'x' 'y' 'z' or 'X' 'Y' 'Z'  axis mapping
accl_y              = -z          # in used 'x' 'y' 'z' or 'X' 'Y' 'Z'  axis mapping
accl_z              = x           # in used 'x' 'y' 'z' or 'X' 'Y' 'Z'  axis mapping
gyro_pitch          = -z          # in used 'x' 'y' 'z' or 'X' 'Y' 'Z'  axis mapping
gyro_roll           = -y          # in used 'x' 'y' 'z' or 'X' 'Y' 'Z'  axis mapping
gyro_yaw            = x           # in used 'x' 'y' 'z' or 'X' 'Y' 'Z'  axis mapping

[AndroidHU]
enabledGnss         = true        # enable gnss data collection
enabledSensor       = true        # enable sensor data collection
gnss_frequence      = 1
gnss_nmea_head      = $GNGGA      # set head message of one nema package
gnss_nmea_tail      = $GLGSV      # set tail message of one nmea package

[SensorServer]
port             = 32042          # server port
buffer_size      = 1000           # buffer size for sensor data. data will be buffered until any client connected. program default is 1000 if not defined here.