#if vector_font_name is null, use bitmap_font_name
   vector_font_name                          = Roboto-Regular.ttf

   vector_font_scripts                       = Thai Latn Cyrl Grek Arab

#vector font
   vector_font_name_eng                             = Roboto-Regular.ttf
   vector_font_name_eng_GBR                         = Roboto-Regular.ttf
   vector_font_name_eng_GBR_Latn                    = Roboto-Regular.ttf

   vector_font_name_fra                             = Roboto-Regular.ttf
   vector_font_name_fra_FRA                         = Roboto-Regular.ttf
   vector_font_name_fra_FRA_Latn                    = Roboto-Regular.ttf

   vector_font_name_deu                             = Roboto-Regular.ttf
   vector_font_name_deu_DEU                         = Roboto-Regular.ttf
   vector_font_name_deu_DEU_Latn                    = Roboto-Regular.ttf

   vector_font_name_tha                             = Sarabun-Regular.ttf
   vector_font_name_tha_THA                         = Sarabun-Regular.ttf
   vector_font_name_tha_THA_Thai                    = Sarabun-Regular.ttf

   vector_font_name_ara                             = Roboto-Regular-add-Arabic.ttf
   vector_font_name_ara_SAU                         = Roboto-Regular-add-Arabic.ttf
   vector_font_name_ara_SAU_Arab                    = Roboto-Regular-add-Arabic.ttf

   vector_font_name_urd                             = Roboto-Regular-add-Arabic.ttf
   vector_font_name_urd_PAK                         = Roboto-Regular-add-Arabic.ttf
   vector_font_name_urd_PAK_Aran                    = Roboto-Regular-add-Arabic.ttf
# switch to support pixel alignment for font rendering
# Note : When rendering small text, ensuring that character outlines align with the pixel grid can help
#        reduce distortion and blurriness.
# Possible values : true, false
# Default value for bitmap font: false
# Default value for vector font: false
   vector_font_pixel_alignment = false
# It is also possible to configure language-dependent font pixel alignment (corresponding to the font), e.g.:
   # bitmap_font_pixel_alignment_jpn = true
   # vector_font_pixel_alignment_zho = false

[EGLWidgetManager]
# gl_depth_buffer_bits needed on some platforms
   gl_depth_buffer_bits=32
# bits per alpha channel, default: 8
   gl_alpha_buffer_size = 8
# bits per rgb channels setup true: RGB:565, false: RGB:888
   gl_rgb_565        = true

# trace lost frames
#WIN32:   trace_lostframes = true

# use fix framerate
# #WIN32:   fps_fix = 30

# DEPRECATED: Currently still used by "WindowManager"
# trace FPS
   trace_fps = false

# list of windows
   windows    = main
   windows    += cluster

# the default window
   default_window = main

# DEPRECATED: Currently still used by "WindowManager"
# set backgound
# use Neusoft colour
   window_bgcolor_main = 0 80 155 255

# DEPRECATED: Currently still used by "WindowManager"
# the window title
   window_title_main = OneCore Main Window

# DEPRECATED: Currently still used by "WindowManager"
# configure dimensions of the window; if not set, the widget manager will attempt to
# query the real display properties
   window_bounds_main        = 0,0,1600,900

# DEPRECATED: Currently still used by "WindowManager"
# window z-level within the selected display
   window_zlevel_main     = 0

# DEPRECATED: Currently still used by "WindowManager"
# window transparency properties (supported values: opaque (default), transparent)
   window_transparency_main = opaque

# Use compositor for the window. When enabled, widgets will be rendered into offscreen
# buffers and later composed in a separate render step.
# Default: false
   window_compositor_main  = false

# The window's DPI value.
# Default: 120.
# NOTE: this is a temporary stop gap solution until the DPI value is configurable at runtime
# See also [MapWindow] switch "dpi"
   window_dpi_main        = 120

# The window's gamma value.
# Default: 2.2.
# NOTE: this is a temporary stop gap solution until the gamma value is configurable at runtime.
#       When this is available, this switch will be removed again.
   window_gamma_main      = 2.2

# defines the list of widgets which have associated configurations
   widgets   =  MapWindow
   widgets  +=  gv_main                   # GV main window
   widgets  +=  gv_main_iz
   widgets  +=  ic_main                   # IC main window
   widgets  +=  ClusterMapWindow

# MapViewer z-level
   widget_zlevel_MapWindow               = -1
   widget_zlevel_ic_main                 = -1
   widget_zlevel_gv_main                 =  2
   widget_zlevel_gv_main_iz              =  1
   widget_zlevel_ClusterMapWindow        =  1

# flag for Widget useOnscreenRendering
   widget_onscreen_ic_main               = false

# quality
   widget_msaa_MapWindow                 = 1  # default:1; recommended:4 IF the hardware is fast enough AND window_compositor_... is on AND multisampled-render-to-texture is supported!
   widget_msaa_ClusterMapWindow          = 1
# bounds (option fullscreen or real pos and size)
   widget_bounds_MapWindow        = fullscreen
   widget_bounds_ClusterMapWindow = fullscreen

   widget_window_MapWindow        = main
   widget_window_gv_main          = main
   widget_window_gv_main_iz       = main
   widget_window_ClusterMapWindow = cluster

