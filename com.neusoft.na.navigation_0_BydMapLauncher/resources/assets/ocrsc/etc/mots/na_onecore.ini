[measprov_distance_table_acoustical_metric]
target_system        = metric
target_client        = Guidance_Acoustical
# values in quantization_table and format_table in unit meter
quantization_table     =       1;    100;    10  # 10m / 20m / ... / 100m
quantization_table    +=     100;    400;    50  # 100m / 150m / 200m / 250m / 300m / 350m
quantization_table    +=     400;   10000;   100  # 400m / ... / 900m / 1km / 1.1km ... 9.9km
quantization_table    +=   10000;    INF;     1000  # 10km / 11km / ...
format_table           =       0;    950;    m;  float:1:0;  meters
format_table          +=     950;   9950;   km;  float:1:1;  kilometers
format_table          +=    9950;    INF;   km;  float:1:0;  kilometers

[measprov_distance_table_acoustical_us]
target_system          = imperial_US
target_client          = Guidance_Acoustical
# values in quantization_table and format_table in unit feet
quantization_table     =       1;   1056;    50  # 50ft, 100ft, 150ft ... 1050ft
quantization_table    +=    1056;    INF;   528  # 0.2, 0.3 ... 1, 1.1, 1.2mi ...
format_table           =       0;   1050;   ft;  float:1:0;  feet
format_table          +=    1050;    INF;   mi;  float:1:1;  miles
unit_table_UK  = ft;    ft
unit_table_UK += yd;    yd
unit_table_UK += mi;    mi

[hybridservice]
# default:true
default_config              = true

[LocalizationManager]
#PROTON-24980
supported_locales = deu_DEU ita_ITA spa_ESP eng_GBR eng_USA fra_FRA nld_NLD por_PRT nor_NOR ara_SAU tha_THA swe_SWE dan_DNK

[alongroute_ranges]
# Defines specific search range to link type and category, and we can define multiple.
# Its format is "alongroute_searchrange = LINKTYPE,CATEGORY,RANGE"
# LINKTYPE: include general road, expressway and urban expressway.
# CATEGORY: represents one or more categories, if is "ALL", means all categories.
# RANGE: use an integer representation, it is along route search range, the unit is meter.
# Example: alongroute_searchrange = General_Road,ALL,200
# alongroute_searchrange += General_Road,Charging_Spot,800
# ......
#
alongroute_searchrange = General_Road,ALL,100
alongroute_searchrange += General_Road,Charging_Spot,400
alongroute_searchrange += Expressway,Motorway_Exit_ALL,500
alongroute_searchrange += Expressway,Motorway_Exit_Charging_Spot,1000
alongroute_searchrange += Urban_Expressway,Motorway_Exit_ALL,300
alongroute_searchrange += Urban_Expressway,Motorway_Exit_Charging_Spot,400
alongroute_searchrange += General_Road,Start_Point_ALL,100
alongroute_searchrange += General_Road,Start_Point_Charging_Spot,400
alongroute_searchrange += General_Road,End_Point_ALL,100
alongroute_searchrange += General_Road,End_Point_Charging_Spot,400

[poi]
# set max distance on the route.
# Range of value : integer from 0 to unlimited
# Default value : 20000
# Unit : meter
# Note : If out of range, out results will not be provided.
#        If this value is 0, we will not limit search distance.
alongroute_max_search_distance = 5000000
# maxListSizeLimited : the maximum quantity of poi no matter which search mode.
# Range of value : integer from 0 to 999
# Default value : 999
# Note : If out of range,it may cause performance problems.
maxListSizeLimited = 200

[here]

# dataFileName, authFileName: temporary files to store data fetched from INRIX server
# Possible values: Any writeable filesystem path (filename)
# Default value: none.
# If not set or invalid, feature is not available
# authFileName should be a path that is persisted over onoff cycle
dataFileName = ${main.path_temp}HEREData_AroundVehicle.tpeg