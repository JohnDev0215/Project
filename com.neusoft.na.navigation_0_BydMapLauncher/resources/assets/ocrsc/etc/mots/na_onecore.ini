# This file contains GreatWall specific custom overrides for na_onecore.ini. This file
# should not contain target specific configurations, but generic configurations across all platforms.

# Note: additional Android specific switches can be found in
#       integration\mots\android\ocservice\src\main\java\com\neusoft\na\ocservice\MotsService.kt

[manager]
# make sure that online services are routed via Telematics.
   enable_GoogleOnlineManager                = false
   enable_ParkingDataProvider                = false

# disable GuidanceViewer for MOTS
   enable_GuidanceViewerManager              = true

# prevent LaneManager from twaddling into maneuver announcements
   enable_LaneManager                        = false

# use TtsEngine in MOTS BL
   enable_JsonWsFacadeTtsEngine              = true
   enable_TtsManager                         = false

# disable LearningManager for GreatWall
   enable_LearningManager                    = false

# TollManager depend on TrackerManagers, so if set enable_TrackerManagers=false alone, onecore cannot startup
   enable_TollManager                        = true
   enable_TrackerManager                     = true

# disable CarwingsRouteInfoManager for GreatWall
   enable_CarwingsRouteInfoManager           = false

# disable VicsManager for GreatWall
   enable_VicsManager                        = false

# disable DSSSServiceManager for GreatWall
   enable_DSSSServiceManager                 = false

# disable MemTrackerManagerImpl for GreatWall
   enable_MemTrackerManagerImpl              = false

# disable MemoryStatMgrImpl for GreatWall
   enable_MemoryStatMgrImpl                  = false

# disable CPUTrackerManagerImpl for GreatWall
   enable_CPUTrackerManagerImpl              = false

[DLT]
   PrintConfig                = false
   Buffer    = 1024
   Output    = 0x0
   Context   = .* 0x0
   Context   += na::base::cpu::CPUMon.* 0x00
   Context   += na::base::mem::MallocInfo.* 0x10
   Context   += na::mgr::system::memstat:MemoryStatMgrImpl.* 0x10
   Context   += na::mgr::android::AndroidManagerImpl::Dump 0x0
   Context   += na::mgr::window::WindowManager::Dump 0x0
   Context   += na::mgr::otto::RouteOttoManager 0x0
   Context   += na::iface::adaptor::jsonws::JsonWsCommunicationTask::msg 0x0
   Context   += .*DataManagement 0x0
   Context   += .*BufferStatistics 0x0
   Context   += .*::KPI 0x0
   Context   += na::funit::.*::EXT 0
   Context   += na::funit::.*::XTR 0
   Context   += na::funit::mapview::.*::EXT 0
   Context   += na::funit::mapview::.*::XTR 0
   Context   += na::funit::traffic::.*::EXT 0
   Context   += na::funit::traffic::.*::XTR 0
   Context   += na::funit::vics::.*::EXT 0
   Context   += na::base::graphics::.*::EXT 0

[interface]
   cpp                                       = false                       # this switch is only present here for the PC simulation, TODO: get rid of it (set to false)!
   dbus                                      = false
   json                                      = true

   json_facade_TtsEngine_target              = MotsBl

[nds]
   max_open_sqlite_files                     = 120
   database                                  = /navi/NeusoftHere/db/ROOT.NDS
   cache_mb                                  = 40
   max_open_sqlite_files                     = 64
   cache_objects                             = 20000
   sqlite_cache_fts                          = 1000
   close_unused_files_after                  = 10
[fonts]
