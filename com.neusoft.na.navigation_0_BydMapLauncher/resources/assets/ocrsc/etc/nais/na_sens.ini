[Sensors]
deploy                         = ./etc/nais/na_sens_deploy.json # startup deploy script
deploy             = /sdcard/nena/etc/nais/na_sens_deploy.json # startup deploy script

[main]
PrintVersion     = true                        # force printout of version strings

# The default host IP v4 address that socket servers in onecore listen on
# Possible values: 0.0.0.0, 127.0.0.1, or valid IP addresses used by host
# Default value: 0.0.0.0
# Note: if you intend to make IPC just inside the target for security, please use 127.0.0.1 instead of 0.0.0.0.
socket_host = 0.0.0.0

[DLT]
# DLT logging section
PrintConfig      = true                        # force printout of configuration strings
Application      = SENS                        # set the DLT logging Application ID (default = CORE)
AppDescription   = na_sens
#WIN32:   ECU    = WIN
#WIN32:   Logger = IPC-Client 127.0.0.1:3491   # connect to an IPC-Server which will collect log data
#LINUX:   Logger = daemon                      # write DLT container to running DLT-daemon, use logger=genivi to use dlt-library communication
ECU            = AND
Logger         = Client 127.0.0.1:4711 YES  # connect to DltDroid
# log/context output: 0x01=DEBUG, 0x02=WARNING, 0x04=ERROR, 0x08=ASSERTION, 0x10=VERBOSE, 0x100=console, 0x400=dlt-daemon, 0x800=trace-devstudio
Output           = 0x04ff                      # enable default output
Context         += .*GPSWorker.*    0x40f
Context         += .*SocketServer.* 0x40f
Context         += .*debug          0
Context         += .*trace          0

# Dump a call stack into the DLT log upon an assertion. Default value: false
# DumpCallStackOnAssertion = false

[SC]
logtimer         = 250             # timeout in 1/1000s after new sensor block will be logged, set to 0 if no logging is desired

[MCP2515]                          # CAN-Transceiver
enabled         = false            # enable data collecting
#canspeed       = 500              # speed in khz, if not set an automatic detection will be used (must not set to an invalid value)
oscFrequ        = 8                # oscillator frequency in MHz
# list of ID expected determine all ID to log, other will be ignored. An empty list means log all. Value must given as hex numbers
logid         += 0x359             # VW Touran Wheel
logid         += 0x2605020         # Volvo V70 Wheel
logid         += 0x12177fc         # Volvo V70 Rear Gear
logid         += 0x3a0             # VW PQ35_46 (Passat, Wheel)
logid         += 0x390             # VW PQ35_46 (Passat, Rear Gear)
logid         += 0x4a8             # VW PQ35_46 (Passat, Gyro)
logid         += 0x116             # VW MQB (incl. Golf VII) Wheel
logid         += 0x3db             # VW MQB (incl. Golf VII) Rear Gear
selftest       = false             # perform self test at power up
canMatrix      = CAN_NONE          # expected CanMatrix: CAN_VW_TOURAN, CAN_OBD2_29BIT, CAN_OBD2_11BIT, CAN_VOLVO_V70, CAN_VW_PQ35_46, CAN_VW_MQB, CAN_NONE
                                   # If CAN_NONE or no matrix is selected, an automatic detection will try to find the right matrix

[OBD2]                             # OBD2 Service for CAN-Bus
enabled         = false            # enable data collecting
period          = 500              # period for velocity requests in milliseconds
use11BitID      = true             # Use 11-Bit ID for PID requests
use29BitID      = true             # use 29-Bit ID for PID requests

[LED]                              # status LED for vehicle speed
enabled         = false            # enable status LED

[MPU6050]                          # 3D-Gyro, 3D-Accelerometer, Temperature
enabled         = false            # enable data collecting
outFrequence    = 10               # Frequence (Hz) to put samples to Collector
oversampling    = 5                # oversampling for all MPU6050 signals
filtertypes     = 0x0              # Bits: 0 = LowPassFilter, 1 = Chebysheff Type 2 Filter, 2 = Window Hamming Large,
                                   # 3 = Butterworth, 4 = Window Hamming small, 5 = Equiripple, 6 = Maximally Flat
                                   # oversampling * outFrequence must be 50 to use filters with ID > 1

[BMP180]                           # air pressure
enabled          = false           # enable data collecting
frequence        = 2

[LSM303]                           # 3D-Accelerometer, 3D-Magnetometer
enabled          = false           # enable data collecting
frequence        = 25
oversampling     = 2

[L3GD20]                           # 3D-Gyro, Temperature
enabled          = false           # enable data collecting
frequence        = 25
oversampling     = 2

[WheelPulse]
enabled          = false           # enable data collecting
frequence        = 10

[GPS]
enabled          = false           # enable data collecting
NMEAChecksum     = false           # enable check of NMEA checksum (default:=false, don't use the checksum)
useGPGSA         = true            # use NMEA GPGSA message (default:=true)
setdatetime      = 3               # set system date time as early as possible, 0 - disabled, 1 or 3 - "date --set FORMATSTRING", 2 - "timedatectl set-time FORMATSTRING"
device           = /dev/ttyACM0 # device path
# demopause      = 500             # pause in 1/100s after each GPS (default 0 := disabled) must be used only together with a GPS data file as device
                                   # and must have the delay as GPS frequence (with 1Hz := 1000, 2Hz := 500), only realtime replay supported with files
# optional GPS data send to device on any connect
configuration    = /usr/etc/nais/gpsconfig_ublox.txt # note: 'ublox' must a part of filename to configure a ublox receiver
# configuration  = /usr/etc/nais/gpsconfig_intel.txt # note: 'intel' must a part of filename to configure a intel receiver

[GPSADR]
enabled          = false           # enable data collecting
NMEAChecksum     = false           # enable check of NMEA checksum (default:=false, don't use the checksum)
useGPGSA         = true            # use NMEA GPGSA message (default:=true)
setdatetime      = 0               # set system date time as early as possible, 0 - disabled, 1 or 3 - "date --set FORMATSTRING", 2 - "timedatectl set-time FORMATSTRING"
device           = /dev/ttyACM0 # device path
# demopause      = 500             # pause in 1/100s after each GPS (default 0 := disabled) must be used only together with a GPS data file as device
                                   # and must have the delay as GPS frequence (with 1Hz := 1000, 2Hz := 500), only realtime replay supported with files
# optional GPS data send to device on any connect
configuration    = /usr/etc/nais/gpsconfig_ublox.txt # note: 'ublox' must a part of filename to configure a ublox receiver
# configuration  = /usr/etc/nais/gpsconfig_intel.txt # note: 'intel' must a part of filename to configure a intel receiver
ubxDr                    = true    # receiver supports ubx dead reckoning
ubxDrPatchConfig         = false   # ubxDr configuration will be patched at next restart
# Vector from Vehicle Reference Point(middle of rear axle) to Antenna (ISO-8855)
ubxDrVrpToAntennaX       = 0       # x component in cm
ubxDrVrpToAntennaY       = 0       # y component in cm
ubxDrVrpToAntennaZ       = 0       # z component in cm
# Vector from Vehicle Reference Point(middle of rear axle) to IMU (ISO-8855)
ubxDrVrpToImuX           = 0       # x component in cm
ubxDrVrpToImuY           = 0       # y component in cm
ubxDrVrpToImuZ           = 0       # z component in cm
# Alignment of IMU (ISO-8855)
ubxDrImuAlignmentYaw     = 0       # yaw component in 10e-2 degree [0, 360]
ubxDrImuAlignmentPitch   = 0       # pitch component in 10e-2 degree [-90, 90]
ubxDrImuAlignmentRoll    = 0       # roll component in 10e-2 degree [-180, 180]
# Setup for wheel data
ubxDrWheelFactor         = 0       # Factor between one tick and one meter (0 = auto calibration)
ubxDrWheelCountMax       = 1       # Maximum counter value for wheel ticks (0 = absolut ticks; 1 = auto calibration for relative ticks with a maximum of 2^n-1)
ubxDrWheelCountFrequency = 0       # Frequency of wheel data (0 = auto calibration)

[SerialCAN]
enabled          = false           # enable data collecting
device           = /dev/ttyUSB0 # device path
baudrate         = 115200          # not sure that baud rate configuration work an any target, please confirm that device is well prepared
# list of ID expected determine all ID to log, other will be ignored. An empty list means log all. Value must given as hex numbers
logid           += 0x3a0           # VW-PQ35_46 (Passat, m_Bremse10) wheel message
logid           += 0x4a8           # VW-PQ35_46 (Passat, m_Bremse5) gyro message

[Tinkerforge]                      # 3D-Gyro, 3D-Accelerometer, 3D-Magnetometer, GPS, Temperature, Wheel-Pulse, barometer
enabled          = false           # enable data collecing
setdatetime      = 3               # set system date time as early as possible, 0 - disabled, 1 or 3 - "date --set FORMATSTRING", 2 - "timedatectl set-time FORMATSTRING"
host             = 127.0.0.1
port             = 4223
is_frequence     = 25              # is := inertial sensors gyro, accel, mag
gps_frequence    = 2               # gps
odo_frequence    = 10              # odometer
baro_frequence   = 2               # barometer

[IMAR-FMS]                         # High Precision 3-Axes Inertial Measuring System
enabled          = false           # enable data collecting
host             = 172.31.3.32
port             = 50052
frequence        = 25
oversampling     = 2

[External-Sensors]                 # starts external sensor processing, e.g. for delphi-ferrari
enabled          = false           # enable data collecting

[AutoDetectFirstLastGpsMessage]    # with a "distanceInMs" value not equal 0 the automatic first/last GPS message detection will be activated
distanceInMs     = 0               # distance between last and first GPS message in 1/1000 seconds (value of 500 should be ok for the most GPS receivers with 1 second position interval)

[Socket1]                          # sensor socket connection for Conti (we don't want the project name in our funit positioning, do we?)
enabled          = false           # enable data collecting
host             = 192.168.100.1   # this has to be the host address where the sensor socket client(UDP) receives sensor data from sensor socket(UDP) server
port             = 8999

[BoschIVI]                         # sensor socket connection for Bosch IVI project
enabled          = false           # enable data collecting
#gnssSocketPath    = /tmp/sock_gnss     # default path for unix socket connection (GNSS data), comment out and change only if you want another path
#sensorsSocketPath = /tmp/sock_sensors  # default path for unix socket connection (sensors), comment out and change only if you want another path

[C3Plus]
enabled          = false
frequence        = 10
gps_frequence    = 1

[FAW]
enabled             = false
faw_host_sens       = 127.0.0.1
faw_port_sens       = 2947
faw_host_gnss       = 127.0.0.1
faw_port_gnss       = 2947
gnss_frequence      = 1
gnss_oversampling   = 1
sensor_frequence    = 10
sensor_oversampling = 1

[AndroidMobile]
enabled             = false
gnss_frequence      = 1
sensor_frequence    = 10

[AndroidHU]
enabledGnss         = true         # enable gnss data collection
enabledSensor       = false        # enable sensor data collection
gnss_frequence      = 1
gnss_nmea_head      = $GPGGA       # set head message of one nema package
gnss_nmea_tail      = $GPACCURACY  # set tail message of one nmea package

[SensorServer]
port             = 32042
buffer_size      = 1000            # buffer size for sensor data. data will be buffered until any client connected. program default is 1000 if not defined here.
