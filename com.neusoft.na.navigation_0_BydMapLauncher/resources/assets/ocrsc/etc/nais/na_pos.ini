[Positioning]
deploy                         = ./etc/nais/na_pos_deploy.json # startup deploy script
deploy             = /sdcard/nena/etc/nais/na_pos_deploy.json # startup deploy script

[main]
PrintVersion                   = true                                  # force printout of version strings

# The default host IP v4 address that socket servers in onecore listen on
# Possible values: 0.0.0.0, 127.0.0.1, or valid IP addresses used by host
# Default value: 0.0.0.0
# Note: if you intend to make IPC just inside the target for security, please use 127.0.0.1 instead of 0.0.0.0.
socket_host = 0.0.0.0

# persistency location. usually will be overwritten by a project-specific, well-known location. this one is just a generic default:
PersistencyPath                = ./var/nais/persistency/na_pos
#WIN32:   PersistencyPath      = .\var\nais\persistency\na_pos

[manager]
ext_dr_mm_feedback_rate        = 0                           # update rate for MapMatchFeedback to external DR. 0 = disabled, Default = 0

# enable or disable interfaces
[interface]
# enable json interface
json = true

# JSON interface websocket port (default: 22529); set to 0 to disable websocket server functionality
json_port = 22532

# The IP v4 address and port with scheme that the JSON interface websocket server listens on
# Default: empty, so no specific IP v4 address
json_host = ws://${main.socket_host}:${interface.json_port}

#json_remotes  = ws://127.0.0.1:22529

[DLT]
PrintConfig                    = true                        # force printout of configuration strings
Application                    = POS                         # set the DLT logging Application ID (default = CORE)
AppDescription                 = na_pos
#WIN32:   ECU                  = WIN
#WIN32:   Logger               = IPC-Client 127.0.0.1:3491   # connect to an IPC-Server which will collect log data
#LINUX:   Logger               = daemon                      # write DLT container to running DLT-daemon, use logger=genivi to use dlt-library communication
ECU                = AND
Logger             = Client 127.0.0.1:4711 YES   # connect to DltDroid

# log/context output: 0x01=DEBUG, 0x02=WARNING, 0x04=ERROR, 0x08=ASSERTION, 0x10=VERBOSE, 0x100=console, 0x400=dlt-daemon, 0x800=trace-devstudio
Output                         = 0x04ff                      # enable default output
Context                       += .*NdsLib                    0x40e
Context                       += .*SocketServer.*            0x40f
Context                       += .*SocketClient.*            0x40f
Context                       += .*ositioning.*              0x40f
Context                       += .*LocalMapImpl              0x40f
Context                       += .*PositioningWorker::Result 0       # explicit disable
Context                       += .*MapMatch::Link            0
Context                       += .*MapMatch::TraceMatchMode  0
Context                       += .*debug                     0
Context                       += .*trace                     0

# Dump a call stack into the DLT log upon an assertion. Default value: false
# DumpCallStackOnAssertion = false

[SensorClient]
enabled                        = true
host                           = 127.0.0.1 # 192.168.1.193
port                           = 32042

[PositioningServer]
port                           = 32044

[Positioning]
MpdConsumerPort                = 32098     # enable IPC access as MPD consumer on this port, prefer this config before MPD.MpdConsumerPort
enabled                        = true
localmap_host                  = 127.0.0.1 # connect to a local map server in this device
localmap_port                  = 32046     # local map server port
enhancement_database           =   ./share/na_pos/worldwide.advicetiles.bin # enhancement DB will be used additionally to current NDS database
enhancement _database = /sdcard/nena/share/na_pos/worldwide.advicetiles.bin # ditto
# tunnel_database              = t.b.d.    # set a tunnel database path, let positioning work with it instead using NDS database
# localmap_database            = t.b.d.    # set a exported local map database path, let positioning work with it instead using NDS database
slope_correlation              = true      # enable slope correlation, DR must deliver pitch angle and MAP must support ADAS slopes [default:=true]
wwdd                           = false     # enable WrongWayDrivingDetection (Onecore Positioning implementation)
drstatus_use_system_timestamps = false     # if true, then public interfaces com::neusoft::onecore::pos::DeadReckoning::DeadReckoningState will
                                           # provide the timestamps based on system time instead of external raw sensor timestamps.
gnss_loss_time_threshold       = 2000      # gnss status is not sent,[default:= 2000ms], The minimun value should be greater than 2000ms.

[PUBLICIF]
gnss_nmea_head                 = $GPGGA      #set begin message type of NMEA if setNMEA of SensorData interface is called
gnss_nmea_tail                 = $GPACCURACY #set end message type of NMEA if setNMEA of SensorData interface is called

[DR]                                       # dead reckoning general choices
frequence                      = 10        # update frequency, default is 10 if parameter not given
mode                           = 0         # 0:="DeadReckoningCalibrationA", 2:="SimpleDeadReckoning"
calibration_uid                = 42        # a unique ID, change it to start with a new calibration, otherwise an old calib with that id would be prefered
time_offset                    = 0         # time offset for corrected GPS position
calibration_section            = CS-PROTON # use that section to init DR
debug_calibration              = true      # add calibration into any positioning result
setdatetime                    = 0         # set system date time as early as possible, 0 - disabled, 1 - "date --set FORMATSTRING", 2 - "timedatectl set-time FORMATSTRING"
simulation                     = false     # start Positioning/DR for dealing with simulated sensor data

[CS-VWGOLF]                                # sensor box in ADAS Golf HH TS-2660
origin_gps              = 8                # OGN_ANYDEVICE
origin_odometer         = 10               # OGN_CAN
origin_angular_velocity = 2                # OGN_MPU6050
origin_acceleration     = 2                # OGN_MPU6050
prescale_gyro           = 0.001
prescale_gyro_bias      = 0
prescale_odometer       = 0.023
gps_cno_threshold       = 33               # set cno threshold for GPS evaluation (unsigned integer)
odometer_scale_audit_deviation = 95        # 0..100 - 0:disable, threshold in percent to reset kalman filter with new estimated odometer sc$
gps_cno_audit_threshold_offset = 8         # enable automatic gps_cno_threshold calculation with this offset from calculated average
# installation position of accelerometer and gyro. Let unused values undefined.
# installation position in cm (origin is centroid of front axis)
# installation angles in degree, Euler angles according to ISO 8855, angle order is: yaw, pitch, roll
pitch_evaluation     = on                  # enable pitch evaluation (necessary sensors must exist, see calibration_section) [default:=off]
acc3d_posx           =  0
acc3d_posy           =  0
acc3d_posz           =  0
acc3d_angle_yaw      = 0
acc3d_angle_pitch    = -10
acc3d_angle_roll     = 0
gyro3d_angle_yaw     = 0
gyro3d_angle_pitch   = -10
gyro3d_angle_roll    = 0

