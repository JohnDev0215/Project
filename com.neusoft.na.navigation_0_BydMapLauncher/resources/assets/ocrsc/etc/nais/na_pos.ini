#######################################################
# JLR using external DeadReckoning run by Trimble
# receiver
#######################################################
[CS-JLR]
external_dr                    = true     # use external DR results
origin_gps                     = 0        # OGN_UNKNOWN
origin_speed                   = 0        # OGN_UNKNOWN
origin_odometer                = 0        # OGN_UNKNOWN
origin_angular_velocity        = 0        # OGN_UNKNOWN
origin_acceleration            = 0        # OGN_UNKNOWN



##########################################################
# JLR running OneCore DeadReckoning with raw sensor data
# provided by Trimble receiver
##########################################################
[CS-JLR_SENSORS]
external_dr                    = false     # ignore external DR results
origin_gps                     = 23        # OGN_PUBLIC_IF
origin_speed                   = 0         # OGN_UNKNOWN
origin_odometer                = 23        # OGN_PUBLIC_IF
