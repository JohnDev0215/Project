# Base settings shared across all OneCore applications.
#
# Externally changeable parameters:
#
#   main.path_share
#     The root path for all NAIS resource files, which are normally located in the "share/" directory.
#     The value has to terminate on a path segment separator (i.e. "/" or "\").
#     See below for OS specific default values.
#     Example:
#        $ bin/na_onecore --main.path_share=/path/to/resources/ --config=etc/nais/na_onecore.ini
#
#   main.path_temp
#     The root path for all temporary files created by NAIS applications
#     The value has to terminate on a path segment separator (i.e. "/" or "\").
#     See below for OS specific default values.
#     Example:
#        $ bin/na_onecore --main.path_temp=/tmp/ --config=etc/nais/na_onecore.ini
#
#   main.path_cache
#     The  root path for cached files created by NAIS applications. "Cached" files are less volatile than
#     "temporary" files and should survive a system restart. Usually, cache files are expected to be cleared
#     by the host system if it decides that memory is needed or explicitly on user request (for example when
#     clearing the application cache on Android)
#     The value has to terminate on a path segment separator (i.e. "/" or "\").
#     Default is the same path as main.path_temp.
#     Example:
#        $ bin/na_onecore --main.path_cache=var/nais/cache --config=etc/nais/na_onecore.ini

[main]

# Selects the project specific parts of the resource files. Per default, "nais" resources will be used.
resource_set                      ?= nais
nds.resource_set                  ?= ${main.resource_set}
guidance.resource_set             ?= ${main.resource_set}
guidanceviewer.resource_set       ?= ${main.resource_set}
mapviewer.resource_set            ?= ${main.resource_set}
route.resource_set                ?= ${main.resource_set}
streetview.resource_set           ?= ${main.resource_set}
traffic.resource_set              ?= ${main.resource_set}
warning.resource_set              ?= ${main.resource_set}

# The root path for all NAIS resource files, which are normally located in the "share/" directory.
# The value has to terminate on a path segment separator (i.e. "/" or "\").
#WIN32:   path_share              ?= ./share/
#LINUX:   path_share              ?= ./share/
path_share            ?= /sdcard/nena/share/
#OSX:     path_share                ?= ./share/
#IOS:     path_share                ?= ./share/

# The root path for all temporary files created by NAIS applications. "Temporary" files are volatile and
# expected to be cleared frequently, for example on system reboot.
# The value has to terminate on a path segment separator (i.e. "/" or "\").
#WIN32:   path_temp               ?= %TEMP%\
#LINUX:   path_temp               ?= /tmp/
path_temp             ?= %EXTERNAL_STORAGE%/tmp/neusoft/onecore/
#OSX:     path_temp                 ?= /tmp/
#IOS:     path_temp                 ?= /tmp/


# The default host IP v4 address that socket servers in onecore listen on
# Possible values: 0.0.0.0, 127.0.0.1, or valid IP addresses used by host
# Default value: 0.0.0.0
# Note: if you intend to make IPC just inside the target for security, please use 127.0.0.1 instead of 0.0.0.0.
socket_host = 0.0.0.0

# The  root path for cached files created by NAIS applications. "Cached" files are less volatile than
# "temporary" files and should survive a system restart. Usually, cache files are expected to be cleared
# by the host system if it decides that memory is needed or explicitly on user request (for example when
# clearing the application cache on Android)
# The value has to terminate on a path segment separator (i.e. "/" or "\").
path_cache                        ?= ${main.path_temp}

[localization]
# Fallback default localization settings for the cases when HMI
# - doesn't configure a language and localization explicitly via API call
# - or sets an unsupported one

# Default language code. Matching Default_isoCountryCode and Default_isoScriptCode are required.
# Possible values: ISO 639-2 Alpha-3 language code
# Default value: eng
Default_isoLanguageCode = eng

# Default country code. Matching Default_isoLanguageCode and Default_isoScriptCode are required.
# Possible values: ISO 3166-1 Alpha-3 country code
# Default value: USA
Default_isoCountryCode  = USA

# Default script code. Matching Default_isoLanguageCode and Default_isoCountryCode are required.
# Possible values: ISO 15924 four-letter script code
# Default value: Latn
Default_isoScriptCode   = Latn

# Default TTS language code. Matching Default_tts_isoCountryCode and Default_tts_isoScriptCode are required.
# Possible values: ISO 639-2 Alpha-3 language code
# Default value: ${localization.Default_isoLanguageCode}
Default_tts_isoLanguageCode = ${localization.Default_isoLanguageCode}

# Default TTS country code. Matching Default_tts_isoLanguageCode and Default_tts_isoScriptCode are required.
# Possible values: ISO 3166-1 Alpha-3 country code
# Default value: ${localization.Default_CountryCode}
Default_tts_isoCountryCode  = ${localization.Default_isoCountryCode}

# Default TTS script code. Matching Default_tts_isoLanguageCode and Default_tts_isoCountryCode are required.
# Possible values: ISO 15924 four-letter script code
# Default value: ${localization.Default_ScriptCode}
Default_tts_isoScriptCode   = ${localization.Default_isoScriptCode}

# Possible values: H12, H24
# Default value: H24
Default_TimeFormat      = H24

# Possible values: METER, MILE, KM, YARD, FOOT
# Default value: KM
Default_DistanceUnit    = KM


[nds]
# Full path and filename of shared library (libNdsLib.so or NdsLib.dll)
# OneCore application will not start when this file is missing or inaccessible.
#WIN32:   ndslib   = .\bin\NdsLib.dll
#LINUX:   ndslib   = ./lib/libNdsLib.so
#OSX:     ndslib     = ./lib/libNdsLib.dylib
ndslib = libNdsLib.so

# Full path and filename of root file of the NDS database (typical name: ROOT.NDS)
# OneCore application will not start when this file is missing or inaccessible.
database   = /sdcard/nais/database/world/1809_R0_HE_MOTS_RDF_WO_combine_master_11_ndsFull-stripped/ROOT.NDS

# Set to true when database is basical.
# Basical database, in which part or all of Update Regions is missing, is for onecore start-up procedure or a fallback choice when online connection is lost.
# Default: false
database_is_basical = false

# For Hybrid database, full path and filename of root file of the NDS database (typical name: ROOT.NDS)
# Do not use this setting if support_two_databases is false.
# database_hybrid   = ${main.path_temp}onlinedb/ROOT.NDS

# For Hybrid database, the path used to download the compressed package of stripped database.
strippeddb_download = ${main.path_temp}download

# Stripped database format version, used when the stripped database format changes, you can download the corresponding version of stripped database from the cloud.
# Default : Not configured by default, it is the basic version.
# 1 : OC-34389(Support for sharing tables), OC-37539(TMC table size reduction)
#stripped_db_format_version = 1

# For Hybrid database, the number of retries for failed attempts of retrieving remote database information.
# Default: 3
hybrid_get_db_info_retry = 30

# For Hybrid database, interval in seconds of failed retrieving remote database information.
# Default value: 10 sec
hybrid_get_db_info_interval = 10

# For Hybrid database, the number of retries for failed attempts of updating stripped database.
# Default: 3
hybrid_get_update_data_retry = 3

# For Hybrid database, interval in seconds of failed updating stripped database.
# Default value: 10 sec
hybrid_get_update_data_interval = 10

# File name and path of the group key (NGK) file (for NDS database encryption)
# Default value: same as "ndslib", but file name extension changed to ".NGK" (i.e. normally bin\NdsLib.NGK or lib/libNdsLib.NGK)
# Should be changed only if it is not possible or wanted to deploy the NGK file to the same location as ndslib.
ngkfile = ${main.path_share}na_onecore/resources/nds/${nds.resource_set}/NdsLib.NGK

# Name for a file that is used by NdsLib to cache essential meta data of the last used database.
# The file must be located in a readable + writable path. Expected size is about some 10 KBytes.
# The file does not need to exist before. It is created when a DB is opened for the first time.
# After that, this cache can speed up the startup significantly, since much less Shared.NDS files must be accessed.
# Use only when the file is really stored persistently (e.g. no temp folder that is cleared periodically).
# Otherwise, the option will even slow down the startup a bit.
# Default value: empty (no caching)
metadata_persistency_file = ${main.path_cache}ndslib.cache

#
# Maximum NdsLib cache size, in MBytes.
# This cache is used for loaded blobs from database and their derived (unpacked, indexed...) products.
# Objects that are currently locked by the application (and therefore could not be released anyway) are not included in
# this size, i.e. this setting refers to previousy used cached data only.
# Default value: 50
# Possible values: 1 to 500
cache_mb = 40

# Maximum number of items in NdsLib cache
# Some kinds of NDS objects are quite small, so the cache memory size specified above could be sufficient to hold
# millions of small objects. It is reasonable to limit this amout to reduce memory fragmentation, and also for
# performance reasons (size of cache index).
# Default value: 20000
# Possible values: 100 or larger
cache_objects = 20000

# Time (in seconds) after which unused Sqlite files of the NDS DB are automatically closed.
# A database may consist of hundreds of separate Sqlite files. Each open file administrative structures and
# especially a dedicated cache  in memory, so it is recommendable to open the currently used files, and close
# them after use. On the other hand, re-opening and re-initialization of Sqlite files will cost performance.
# Default value: 30
# Possible values: 1 or larger (as interval in seconds). With value 0, all used files will be kept open forever.
close_unused_files_after = 30

# Maximum Sqlite cache size per open sqlite database file, in KBytes.
# This is Sqlite's internal cache. It can be reduced below standard values because NdsLib additionally uses its own
# global cache for loaded objects (see cache_mb).
# Note that Sqlite will allocate the specified amount of memory only when data of that size are actually loaded, and
# the memory will be released again when the file gets closed (see close_unused_files_after).
# This setting can be overwritten by building-block-specific settings below (for SLI and FTS)
# Default value: 2000
# Possible values: 0 or larger
sqlite_cache_default = 2000

# Maximum Sqlite cache size (in KBytes) per files containing the SLI building block (address input)
# This building block mainly relies on large and complex Sqlite queries, thus a larger cache really improves the
# performance here.
# Default value: same as sqlite_cache_default
# Recommended value: 10000
# Possible values: 0 or larger
sqlite_cache_sli = 10000

# Maximum Sqlite cache size (in KBytes) per files containing the FTS building block (full-text search)
# This building block mainly relies on large and complex Sqlite queries, thus a larger cache really improves the
# performance here.
# Default value: same as sqlite_cache_default
# Recommended value: 10000
# Possible values: 0 or larger
sqlite_cache_fts = 10000

# Maximum number of Sqlite files that shall be opened in parallel. NdsLib will try to close unused files when
# this limit gets exceeded.
# Default value: 100
# Recommended value: should not be smaller that the number of update regions in the main navigation product DB
max_open_sqlite_files = 60

# NDS "POI category collection" to be used as default for POI functionality.
# A NDS database may contain multiple POI category collections, for example, for different brands of a car manufacturer.
# The used collection is normally configured by each NdsLib client individually, but as a customer project typically
# will use only one specific POI category collection, it makes sense to define a global default.
# This "default_poi_category_collection_id" will be set directly after opening of the NDS DB, i.e. before any client can
# access POI (or other NDS) functionalities.
# Note that as long as a client does not specify the collection explicitly, this collection Id default will be used for
# all building blocks instances of all POI products, so when using this setting, it must be ensured that the value makes
# sense for any POI BB. Otherwise e.g. querying the POI category list would fail.
# Default: 0 (= DEFAULT_POI_CAT_COLLECTION_ID, which must always exist)
default_poi_category_collection_id = 0

#
# Settings for Hybrid Online Database (HOD)
#

# Enable use of hybrid DB service, enabling this switch will override or disable some of the other HOD settings
# When use_hybrid_db_service is not set (or set to false=default), but a remote_database is configured
# then the HOD (old) implementation remains active.
# If database_hybrid is not set, this setting works for the database setting,  otherwise for database_hybrid setting.
# Default: false
#IOS:      use_hybrid_db_service = true
use_hybrid_db_service ?= false

# URL of root file of the remote (complete) NDS database.
# The local DB ("database" setting above) is assumed to be a stripped-down, core DB.
# Do not use this setting if only a complete local DB is used (classical onboard use case).
# Will be ignored when use_hybrid_db_service is set to true.
# Default value: empty string (no remote database)
# remote_database       = http://naisftp.nts.neusoft.local/Database/nais/database/japan/NTS_1610_R0_ZE_BoA-IVI_JPN_master_26_nds/ROOT.NDS

# Local path for "Cloud Cache". Will be used to store downloaded contents from "remote_database" (Hybrid DB)
# Considered only when either "use_hybrid_db_service" is "true", or "remote_database" name is specified.
# Configuring a "remote_cache" is strongly recommended when a Hybrid DB setup is used.
# The file is not required to exist before, but the directory path must exist, and must allow write access.
# Default value: empty string (no cloud cache)
remote_cache            = ${main.path_temp}onlinedb/Cache.sql

# configure the remote cache permissions of the current instance of NDS library since there may be more
# than one NDS library instances in different apps (e.g. EHP and OneCore) of HU.
# The NDS library instance in Navigation shall have read-write permission, However, an read-only purpose app
# such as EHP shall grant read-only permission on NDSLib to avoid deleting the cache file.
#  (remote_cache_permission = rw).
# Possible values: 'rw' or 'r'
#      rw: read-write
#      r : read only
# Default: rw
# remote_cache_permission    = rw

# Number of accepted startups without proper shutdown until the CloudCache is validated and/or cleared.
# Has no effect when no "remote_database" or no "remote_cache" is specified.
# Default: 3
remote_cache_retry     = 3

# Defines what happens when the amount of faulty shutdown has exceeded "remote_cache_retry"
# false: Check the CloudCache database integrity
# true: Delete the cache, and create a new one
# Recommended value: true for customer deliveries. May be false only during instable phase.
# Default: false
remote_cache_strict    = false

# Size of CloudCache (file) in MBytes
# Has no effect when no "remote_database" or no "remote_cache" is specified.
# Default: 500 MB
remote_cache_size      = 500

# Size of sqlite cache memory (RAM) for CloudCache in MBytes
# Has no effect when no "remote_database" or no "remote_cache" is specified.
# Default: 50 MB
remote_cache_sqlite_cache_size = 50

# Length in km along the start of the guided route for which additionally
# caching of all direct neighboring tiles is done (i.e. widen corridor on the initial route part).
# Only used if CloudCache is active.
# Default: 50
wide_corridor_length = 50

# Initial setting for off-line state at startup.
# Set to false to assume a startup in offline state.
# Will be ignored when use_hybrid_db_service is set to true, which will always start in off-line mode.
# Default: true
online_at_startup = true

# Polling interval in seconds for checking for a lost online connection.
# Default value: 11 sec
# Minimum value: 2 sec
check_remote_access_after = 5

# whether all links in the database have PHYSICAL_LANE_DIVIDER.
# Possible value: true or false.
# Default value: false.
#physical_divider_in_all_links = false

[LocalizationManager]
# delay <delay_SetLocale> ms before sendresult when process SetLocale,500 in default
delay_SetLocale = 500

# The value of this configuration is a list of country code, which is sorted according to the priority level.
# The top priority of the queue is the highest, the priority gradually decreases from the front to the back.
# Possible values: ISO 3166-1 Alpha-3 country code.
# Default value: Configuration according to the actual application scenario.
# The following configuration is an example only.
#country_code_priorities = BGR,AND,CHE,GBR,CAN

# The value of this configuration is a list of language code, which is sorted according to the priority level.
# The top priority of the queue is the highest, the priority gradually decreases from the front to the back.
# Possible values:  ISO 639-2 Alpha-3 language code.
# Default value: Configuration according to the actual application scenario.
# The following configuration is an example only.
#language_code_priorities = eng,fra,jpn,ltz,nor

# This is the switch to configure whether to enable smart_locale_mode.
# Possible values:
# 0 --- disable smart locale, which indicates onecore selects the locale completely according to the input argument of SetLocale method in Configuration.fidl.
# 1 --- enable smart locale by database default official language, which indicates onecore will try to select locale by
#       database default official language when onecore fails to select locale by the input argument of SetLocale method.
# 2 --- enable smart locale by considering the priority of country code or language code based on smart locale mode 1,
#       which indicates onecore will try to select locale by priorities of country code or language code.
#       According to the country code or language code, which of them matches the system support locale.
# 3 --- reserved smart locale which reserved options for subsequent requirements.
# 4 --- enable smart locale by fallback setting in section "localization" of this file when BL sets an unsupported locale.
#       unsupported locale is the locale not listed in lua files of guidance.
#       note: see fallback_tts_locale for TTS unsupported locale
# Default value: 1 (dev/Porton), 0 (master)
smart_locale_mode = 1

# specific a fallback tts locale for a specific language/country/script code
# Note: If the TTS locales are not listed here, indicates that onecore use the same iso locale as tts languange locale
# Possible values:
#
#     fallback_tts_locale_<USER_ISO_LANGUAGE_CODE>_<USER_ISO_COUNTRY_CODE> = <ISO_LANGUAGE_CODE>_<ISO_COUNTRY_CODE>
#                                                                          or <ISO_LANGUAGE_CODE>_<ISO_COUNTRY_CODE>_<ISO_SCRIPT_CODE>
#
#     fallback_tts_locale_<USER_ISO_LANGUAGE_CODE>_<USER_ISO_COUNTRY_CODE>_<USER_ISO_SCRIPT_CODE> = <ISO_LANGUAGE_CODE>_<ISO_COUNTRY_CODE>
#                                                                          or <ISO_LANGUAGE_CODE>_<ISO_COUNTRY_CODE>_<ISO_SCRIPT_CODE>
#
#     Example:
#        fallback_tts_locale_spa_ESP      =  eng_GBR
#        fallback_tts_locale_ita_ITA      =  eng_GBR_Latn
#        fallback_tts_locale_ita_ITA_Latn =  deu_DEU
#        fallback_tts_locale_ita_ITA_Latn =  deu_DEU_Latn
# Default value: null
# fallback_tts_locale_spa_ESP = eng_GBR
