# from scale 10000 and higher, 3D objects are turned off

scales             += 10000
scales             += 48.0

scales             += 25000
scales             += 47.0

scales             += 50000
scales             += 46.0

scales             += 100000
scales             += 45.0

scales             += 250000
scales             += 40.0

scales             += 500000
scales             += 30.0

scales             += 1000000
scales             += 20.0

scales             += 2500000
scales             += 15.0

scales             += 5000000
scales             += 10.0

scales             += 10000000
scales             += 10.0

# from here on: globe view

scales             += 25000000
scales             += 0.0
scales             += 50000000
scales             += 0.0
scales             += 100000000
scales             += 0.0

# deactivated - these globe views zoom too far out:

# scales           += 250000000
# scales           += 0.0
# scales           += 500000000
# scales           += 0.0

# Set to true if this window should be automatically visible after creation.
# Normally, this only happens upon request from outside (e.g. HMI or project-specific controller).
# However, for debugging purposes, it can be useful to see the window immediately.
# Note that that displaying usually will result in loading a fallback default style (because otherwise nothing would be visible),
# even before the outside HMI has explicitly set one. We set it to true here for platform development purposes.
# Real projects should not set it so it falls back to its default of false.
# See http://jira.nts.neusoft.local/browse/NENA-9824
# Possible values: true / false
# Default: false
initially_visible = true

# Set initial perspective.
# Note: The HMI might persists its perspective settings and apply them when the
#       mapviewer window becomes visible.
# Possible values: 2D / 3D
# Default: 2D
initial_perspective = 2D

# Set the initial scale.
# Note: Currently the HMI expects that the mapviewer window is set to 10km scale
#       (index 9). As long as the OneCore does not notify the HMI about scale changes
#       setting another initial value might confuse the user. The HMI will still
#       display 10km initially unless the scale is changed.
# Possible values: [0..length(scales)-1]
# Default: 9
initial_scale = 8

# Name:       enable_onoff
# Default:    "false"
# Description: This switch offers a mechanism for enhancing the start up performance for the affected widget.
# Options
#  "true"   : If a frame of this widget consists of incomplete tiles, the mapviewer will be enforced to focus on BMD/DTM data for that frame.
#  "false"  : The current frame content will not influence the mapviewer.
enable_onoff = true

# Name:       number_of_maneuver_show
# Default:    "3"
# Possible values: greater than 0
# Description: This is the number of maneuvers which are shown in map.
number_of_maneuver_show = 3

# Name:       reduce-gpu-content-if-invisible
# Default:    "false"
# Possible values: true, false
# Description: If set to "true", this widget will immediately release GPU ressources blocked by non essential layers.
reduce-gpu-content-if-invisible = true

# Name:       max_screenshots
# Default:    "10"
# Possible values: -1 or greater than 0
# Description: This value indicates the maximum number of screenshots. Set to -1 for unlimited screenshots.
max_screenshots = 10

# Name:       traffic_flow_drawn_under_bmd_road
# Default:    true
# Possible values: true or false
# Description: this item decides the priority between traffic flow lines and BMD road lines
#              value true means traffic flow lines will be drawn under BMD road lines
#              value false means traffic flow lines will be drawn above BMD road lines
# traffic_flow_drawn_under_bmd_road         = true

# Default:    true
# Possible values: true, false
# Description: If set to "true", this widget will load routes data to draw the route.Set to false will not load routes data.
# load_routes_data = true

# Default:    false
# Possible values: true, false
# Description: If set to "true", guided route add circular signs at the starting and ending points of the path.Set to false will not add.
# show_guided_route_start_and_end_signs = false

# Name:       autozoom_highway_max_distance
# Default:    400000
# Unit:       cm
# Description: The timing of autozoom.
#              When distance from vehicle to guided object is less than autozoom_highway_max_distance in high way,start scale calculate.
#              And guided object include Maneuver and Lane_Merge.
autozoom_highway_max_distance                   = 400000
# Name:       autozoom_normalway_max_distance
# Default:    200000
# Unit:       cm
# Description: The timing of autozoom.
#              When distance from vehicle to guided object is less than autozoom_normalway_max_distance in normal way,start scale calculate.
autozoom_normalway_max_distance                 = 200000
# Name:       autozoom_carheading_highway_default_scale
# Default:    50000
# Unit:       cm
# Description: Default scale value when guided object on highway under CarHeading mode.
#              The application timing is when guided object on highway under CarHeading mode,
#              and when  distance between vehicle and guiding object is greater than autozoom_highway_max_distance.
autozoom_carheading_highway_default_scale       = 50000
# Name:       autozoom_carheading_normalway_default_scale
# Default:    10000
# Unit:       cm
# Description: Default scale value when guided object on normalway under CarHeading mode.
#              The application timing is when guided object on normalway under CarHeading mode,
#              and when distance between vehicle and guiding object is greater than autozoom_normalway_max_distance.
autozoom_carheading_normalway_default_scale     = 10000
# Name:       autozoom_carheading_highway_min_scale
# Default:    5000
# Unit:       cm
# Description: Minimum scale value when guided object on highway under CarHeading mode.
#              The value is used when guided object on highway under CarHeading mode and when calculated scale is less than autozoom_carheading_highway_min_scale.
autozoom_carheading_highway_min_scale           = 5000
# Name:       autozoom_carheading_normalway_min_scale
# Default:    2500
# Unit:       cm
# Description: Minimum scale value when guided object on normalway under CarHeading mode.
#              The value is used when guided object on normalway under CarHeading mode and when calculated scale is less than autozoom_carheading_normalway_min_scale.
autozoom_carheading_normalway_min_scale         = 2500
# Name:       autozoom_northheading_highway_default_scale
# Default:    100000
# Unit:       cm
# Description: Default scale value when guided object on highway under NorthHeading mode.
#              The application timing is when guided object on highway under NorthHeading mode,
#              and when distance between vehicle and guiding object is greater than autozoom_highway_max_distance.
autozoom_northheading_highway_default_scale     = 100000
# Name:       autozoom_northheading_normalway_default_scale
# Default:    20000
# Unit:       cm
# Description: Default scale value when guided object on normalway under NorthHeading mode.
#              The application timing iswhen guided object on normalway under NorthHeading mode,
#              and when distance between vehicle and guiding object is greater than autozoom_normalway_max_distance.
autozoom_northheading_normalway_default_scale   = 20000
# Name:       autozoom_northheading_highway_min_scale
# Default:    10000
# Unit:       cm
# Description: Minimum scale value when guided object on highway under NorthHeading mode.
#              The value is used when guided object on highway under NorthHeading mode and when calculated scale is less than autozoom_northheading_highway_min_scale.
autozoom_northheading_highway_min_scale         = 10000
# Name:       autozoom_northheading_normalway_min_scale
# Default:    5000
# Unit:       cm
# Description: Minimum scale value when guided object on normalway under NorthHeading mode.
#              The value is used when guided object on normalway under NorthHeading mode and when calculated scale is less than autozoom_northheading_normalway_min_scale.
autozoom_northheading_normalway_min_scale       = 5000
# Name:       autozoom_factor_of_alongroute_and_linear
# Default:    1.5
# Possible values: 1 ,1.5 or other
# Description: Curvature,alongroute distance to guided object divided by linear distance to guided object.
#              When vehicle and guided object are at a bend, it is more desirable to calculate a suitable scale to see the bend,
#              rather than limited to seeing the guided object. This parameter represents a curvature, and when greater than this parameter,
#              it indicates that there is a bend that needs attention.
autozoom_factor_of_alongroute_and_linear        = 1.5
# Name:       autozoom_min_interval_of_scale_change
# Default:    100
# Unit:       cm
# Possible values: 100 ,200 or 100*i
# Description: Minimum interval of scale change.
#              When min_interval_cm_of_scale_change parameter is 100, the minimum interval for calculating the scale is 100cm,
#              and calculating the scale may be 2500,2600. If set to 200, the result of calculating the scale may be 2400,2600.
autozoom_min_interval_of_scale_change           = 100
# Name:       autozoom_factor_of_scale_change
# Default:    2.0
# Possible values: 1.0 ,2.0 or other
# Description: The factor of scale change, current scale divided by previous scale.
#              When the scale changes greatly, it need a longer time to execute autozoom animation, and then determined by factor_of_scale_change,
#              if the scale change is greater than this parameter, it indicates that it takes a longer time to execute autozoom animation.
autozoom_factor_of_scale_change                 = 1.5
# Name:       autozoom_duration_when_scale_change_small
# Default:    0.6s
# Unit:       second
# Possible values: 0.6 or other
# Description: Animation duration when small change in autozoom scale.
#              if the scale change is less than or equal factor_of_scale_change parameter, use duration_when_scale_change_small parameter to execute autozoom animation.
autozoom_duration_when_scale_change_small       = 0.6
# Name:       autozoom_duration_when_scale_change_large
# Default:    2.0s
# Unit:       second
# Possible values: 2.0 or other
# Description: Animation duration when large change in autozoom scale.
#              if the scale change is greater than factor_of_scale_change parameter, use duration_when_scale_change_large parameter to execute autozoom animation.
autozoom_duration_when_scale_change_large       = 2.0

# Name:       autozoom_guided_point_to_top_ratio
# Default:    0.125
# Possible values: 0.125(1/8),0.25(1/4)
# Description: Minimum distance between next guided point in map to the top of the screen. Value is a ratio of the whole display height.
#              And guided point include Maneuver and Lane_Merge.
autozoom_guided_point_to_top_ratio              = 0.25

# Name:       autozoom_viewlength_of_calculate_scale
# Default:    437.0
# Possible values: 437.0
# Description: View Length from car position to guided point under CarHeading mode.Screen distance between car position and guided point is different,and the calculation scale is also different.
#              In order to adapt to different situations such as the size of navigation machine, car screen position, and guidede point screen position, etc.
autozoom_viewlength_of_calculate_scale          = 437.0

# Name:       autozoom_linear_factor
# Default:    1.1
# Possible values: 1.0,1.1
# Description: Linear relationship coefficient between scale change and car position change.At low scales, the changes in scale are synchronized with the car position,
#              ensuring a linear relationship.The change in scale is equal to the change in car position multiplied by autozoom_linear_factor.
autozoom_linear_factor                          = 1.1

# Name:       flag_texture_scale_factor
# Default:    1.0
# Range:      0.75 - 1.25
# Description: Enlarge or shrink the flag icon based on flag_texture_scale_factor.
flag_texture_scale_factor                       = 1.0


