# Reference configuration file for na_onecore
#
# Externally changeable parameters:
#
#   main.path_share
#     The root path for all NAIS resource files, which are normally located in the "share/" directory.
#     Default value is the "$INSTALLATION_PATH/share/".
#     Example:
#        $ bin/na_onecore --main.path_share=/path/to/resources/ --config=etc/nais/na_onecore.ini

onecore.deploy             = ./etc/nais/na_onecore_deploy.json # startup deploy script

[main]
AbortRetryIgnoreDialog     = false
PrintVersion               = true

# check for the existance of the NDS database root file during onecore startup phase
# Possible values : false,true
# Default         : false
# NOTE            : false if the existance of the database root file is ignored in onecore startup phase
#                   true  if the existance of the database root file is a prerequisite for onecore's managers startup.
#                   OneCore application will not start if this root file is missing or inaccessible.
#                   If there is no configuration of database in [nds] section, will be treated as no database
check_database_existance   = true

# persistency location. usually will be overwritten by a project-specific, well-known location. this one is just a generic default:
PersistencyPath            = ./var/nais/persistency/na_onecore
#WIN32:   PersistencyPath  = .\var\nais\persistency/na_onecore

# import database and localization configuration
include                    = na_common.ini

# startup delay in ms for some agents
# default is 1000
# first simple step to optimize the startup (target is "first map rendering ready" in shortest time)
# delay for all in list
startup_delay = 1000
# delay for a specific agent (prio first specific then global)
# startup_delay_FreeTextSearchManager     = 3000
# startup_delay_LocationInputManager      = 3000
# startup_delay_GoogleOnlineManager       = 3000
# startup_delay_AdasManager               = 3000
# startup_delay_AdasisMultiplexerManager  = 3000
# startup_delay_VicsManager               = 3000
# startup_delay_CarwingsRouteInfoManager  = 3000
# startup_delay_TollManager               = 3000
# startup_delay_StreetViewManager         = 3000
# startup_delay_DSSSServiceManager        = 3000
# startup_delay_DestStorageManagerImpl    = 3000
# startup_delay_ParkingManager            = 2000
# startup_delay_PoiManager                = 2000
# startup_delay_GuidanceManager           = 2000
# startup_delay_GuidanceViewerManager     = 2000
# startup_delay_RoadbookManager           = 2000
# startup_delay_RouteOttoManager          = 2000
# startup_delay_RoutingManager            = 2000
# startup_delay_LocationManager           = 2000
# startup_delay_WarningManager            = 2000
# startup_delay_LaneManager               = 2000
# startup_delay_BlockingManager           = 2000
# startup_delay_WeatherManager            = 2000
# startup_delay_LearningManager           = 2000
# startup_delay_TrackerManager            = 2000


# enable or disable interfaces
[interface]
# enable interfaces

# enable D-Bus interface
dbus = true

# D-Bus (application) name: the name under which the application is visible on the bus. If set to empty string, no
# alias name is assigned to the application.
# Default: empty
dbus_name = com.neusoft.na_onecore

# D-Bus object path for the onecore interfaces. (Default: "/")
dbus_object_path = /

# pick the remote application to provide the server for the onlineservices facades via D-Bus
dbus_facade_LocationSearch_target            = com.neusoft.na_telematics
dbus_facade_MapImageProvider_target          = com.neusoft.na_telematics
dbus_facade_StreetViewImageProvider_target   = com.neusoft.na_telematics

# enable cpp interface
cpp = true

# enable json interface
json = true

# JSON interface websocket port (default: 22529); set to 0 to disable websocket server functionality
json_port = 22529

# The IP v4 address and port with scheme that the JSON interface websocket server listens on
# Default: empty, so no specific IP v4 address
json_host = ws://${main.socket_host}:${interface.json_port}

# List of external servers to connect to. Each list entry must contain a valid URL including scheme, host address, and port.
# Default: empty, so no connection to external server is established.
#
json_remotes  = ws://127.0.0.1:22530      # connect to na_telematics

# pick the remote component to provide the server for the onlineservices facades via JsonWs
json_facade_LocationSearch_target              = Telematics
json_facade_MapImageProvider_target            = Telematics
json_facade_StreetViewImageProvider_target     = Telematics
json_facade_ParkingDataProvider_target         = Telematics
json_facade_HybridDbProvider_target            = Telematics
json_facade_OnlineUser_target                  = Telematics
json_facade_Utility_target                     = Telematics
json_facade_Route_target                       = Telematics
json_facade_WeatherDataProvider_target         = Telematics
json_facade_TrafficInfoProvider_target         = Telematics
json_facade_TrafficIncidentInfoProvider_target = Telematics
json_facade_TrafficTileCostInfoProvider_target = Telematics
json_facade_Guidance_target                    = Telematics
json_facade_MapViewProvider_target             = Telematics
json_facade_DbUpdate_target                    = Telematics
json_facade_ConfigProvider_target              = Telematics
json_facade_Waypoint_target                    = Telematics

# enable jni interface
jni  = false

[manager]
# per default, external render window should be used, so it must be accessible via FCallCpp:
enable_FCallCppFacadeRenderWindow        = ${interface.cpp}

#enable_FCallCppFacadeTtsEngine           = ${interface.cpp}
#enable_FCallCppFacadePersistenceStandard = ${interface.cpp}
#enable_FCallCppFacadePersistenceUser     = ${interface.cpp}

enable_JsonWsFacadeHybridDbProvider             = true
enable_JsonWsFacadeOnlineUser                   = true
enable_JsonWsFacadeUtility                      = true
enable_JsonWsFacadeLocationSearch               = true
enable_JsonWsFacadeMapImageProvider             = true
enable_JsonWsFacadeParkingDataProvider          = true
enable_JsonWsFacadeWeatherDataProvider          = true
enable_JsonWsFacadeRoute                        = true
enable_JsonWsFacadeStreetViewImageProvider      = true
enable_JsonWsFacadeTrafficInfoProvider          = true
enable_JsonWsFacadeTrafficIncidentInfoProvider  = true
enable_JsonWsFacadeTrafficTileCostInfoProvider  = true
enable_JsonWsFacadeGuidance                     = true
enable_JsonWsFacadeMapViewProvider              = true   # default: false
enable_JsonWsFacadeDbUpdate                     = true
enable_JsonWsFacadeConfigProvider               = true
enable_JsonWsFacadeWaypoint                     = true

[DLT]
PrintConfig                = true

# PrintConfigDelay : Delay for print configuration
# Possible values : Greater than or equal to Zero (in milliseconds)
# Default value : 0
# Note : This parameter configures a delay in milliseconds before the print configuration is applied, and is only active when PrintConfig is enabled.
#        Setting this value above 0 defers the print configuration to a secondary thread, thereby preventing the operation from blocking the main thread.
#        This mechanism is specifically designed to reduce application startup time, especially when printing a large number of configurations.
PrintConfigDelay           = 0

Application                = NAVI
AppDescription             = na_onecore

#WIN32:   ECU              = WIN
#WIN32:   Logger           = IPC-Client 127.0.0.1:3491  # connect to an IPC-Server which will collect log data

ECU            = AND
Logger         = Client 127.0.0.1:4711 YES  # connect to DltDroid

#APPLE:   ECU              = MAC
#APPLE:   Logger           = Server 127.0.0.1:3490 NO             # open a log server on localhost:4711, no storage header (added by TempoGiusto)

#LINUX:   Logger           = daemon                     # write DLT container to running DLT-daemon, use logger=genivi to use dlt-library communication

# log/context output:  0x01=DEBUG, 0x02=WARNING, 0x04=ERROR, 0x08=ASSERTION, 0x10=VERBOSE
#                     0x100=console, 0x400=dlt-daemon, 0x800=devstudio console
#WIN32:   Output           = 0x04ff
Output         = 0x04ff
#APPLE:   Output           = 0x04ff
#LINUX:   Output           = 0x04ff

# example: log all Contexts containing 'abcde' in name, output them to dlt-daemon
# Context                 += .*abcde.* 0x040f
# example: enable verbose logging for hugo message passing
# Context += na::iface::adaptor::hugo::CommunicationTask.* 0x041F
Context       += .*debug    0
Context       += .*trace    0

# enable verbose logging for JSON message passing
Context += na::iface::adaptor::jsonws::JsonWsCommunicationTask::msg 0x051F

# Dump a call stack into the DLT log upon an assertion. Default value: false
# DumpCallStackOnAssertion = false

# log queue buffer size, count of messages to be stored until logger is connected (used mainly at startup)
# Default value : 10000
Buffer = 20000

[MPD]
MpdConsumerPort = 32099 # enable IPC access as MPD consumer on this port
MpdProxyPort   += 32098 # list of all MPD proxy ports

[memory]
# set to true to cyclically dump memory allocation info
monitor = true
# cycle time in milliseconds
period  = 10000
# Output data to console also?
console = false


[fonts]
# path where font files are stored (a file system path with read rights)
# Default value: ${main.path_share}na_onecore/resources/mapviewer/${mapviewer.resource_set}/fonts
font_path = ${main.path_share}na_onecore/resources/mapviewer/${mapviewer.resource_set}/fonts

# default font names for the cases when a client sets a language code via API calls SetLocale but
# - doesn't configure a font name for a language code explicitly
# - or sets an unsupported language code
# Matching font_name and the file names of font style files in <font_path> are required
# i.e. font files <font_name>.font.* do exist in <font_path>.
# Both raster (bitmap) and vector (FreeType) fonts can be specified. OC components that already support vector fonts will
# prefer that font type.
# A bitmap fonts is provided as a set of files. The configured name is just the common name prefix without "." and extension.
# The used FreeType library supports a lot of different vector font formats besides ".ttf", so a complete name with extension is expected here.
# Default value when both bitmap_font_name and vector_font_name are empty: bitmap_font_name = Carlito36
bitmap_font_name = Carlito36
vector_font_name = Carlito-Regular.ttf

bitmap_font_scripts = Latn Cyrl Grek   # list of scripts that are covered by bitmap font (or acceptable otherwise), frequently used other scripts: Hans Hant Jpan Arab Hebr Thai Deva Geor
vector_font_scripts = Latn Cyrl Grek   # same for vector fonts

# specific special font for a specific language/country/script code, analogous to font_path
# Default value: ${bitmap_font_name} resp. ${vector_font_name}
# bitmap_font_name_eng          = Carlito36
# bitmap_font_name_jpn          = AxisStd-Regular-32
# bitmap_font_name_zho_CHN      = ...
# bitmap_font_name_zho_CHN_Hans = ...
# vector_font_name_eng          = Carlito-Regular.ttf
# vector_font_name...
#
# It is also possible to configure language-dependent allowed scrips (corresponding to the font), e.g.:
# vector_font_scripts_jpn = Latn Jpan Hans Hant
# vector_font_scripts_zho = Latn Hans Hant

# switch to support pixel alignment for font rendering
# Note : When rendering small text, ensuring that character outlines align with the pixel grid can help
#        reduce distortion and blurriness.
# Possible values : true, false
# Default value for bitmap font: false
# Default value for vector font: false
bitmap_font_pixel_alignment = false
vector_font_pixel_alignment = false

# It is also possible to configure language-dependent font pixel alignment (corresponding to the font), e.g.:
# bitmap_font_pixel_alignment_jpn = true
# vector_font_pixel_alignment_zho = false


[LocalizationManager]
# List of locales supported by the LocalizationManager (and subsequently OneCore as a whole).
# Locales are defined by either
# <ISO 639-3 language code (3 letter lower case)>-<ISO 3166-1 alpha 3 country code (3 letter upper case)>
# or
# <ISO 639-3 language code (3 letter lower case)>-<ISO 3166-1 alpha 3 country code (3 letter upper case)>-<ISO 15924 alpha 4 script code (first letter upper case, other 3 lower case)>
# Examples:
# zho-CHN for unspecific Chinese, zho-CHN-Hans for Chinese with simplified script
# deu-DEU for standard German, deu-AUT for Austrian German
# Multiple values can be supplied on the same line separated by space, or on separate lines
# using the "+=" syntax.
# Default value: <empty>
# Note: list of locales from lua file names will be ignored when this setting is available.
# supported_locales  = ara-ARE deu-DEU eng-GBR eng-USA fra-FRA
# supported_locales += ita-ITA jpn-JPN rus-RUS spa-ESP zho-CHN
# supported_locales += deu-DEU-Latn zho-CHN_Hant zho-CHN_Hans


[DestinationStorage]
# recentDestinationSize : Recent Destination Count
# Possible values : Greater than or equal to Zero
# Default value : 100
# Note : the Recent Destination Max value. Added Recent Destination numbers can't exceed in the value.
recentDestinationSize = 300

# favoriteDestinationSize : Favorite Destination Count
# Possible values : Greater than or equal to Zero
# Default value : 100
# Note : the Favorite Destination Max value. Added Favorite Destination numbers can't exceed in the value.
favoriteDestinationSize = 300

# routesDestinationSize : Routes Destination Count
# Possible values : Greater than or equal to Zero
# Default value : 100
# Note : the Routes Destination Max value. Added Routes Destination numbers can't exceed in the value.
routesDestinationSize = 300

# personalEPoisDestinationSize : Personal EPOIs Destination Count
# Possible values : Greater than or equal to Zero
# Default value : 5
# Note : the EPOIs Max value. Added EPOIs Destination numbers can't exceed in the value.
personalEPoisDestinationSize = 5


[DestinationInput]
# use_HackForZenrinSample201409 : switch to support zenrin 4th sample database
# Possible values : true if the database is zenrin 4th sample db
#                   false if the database is not zenrin 4th sample db
# Default value : false
# Note : To support zenrin 4th sample database with hack solution
# use_HackForZenrinSample201409 = false

# the usage type to provide official name and rotated names in SLI address input
# ds <= 2.1.1.10.9, (0,4,8,12)
#                   DB like TOMTOM ECE2013, TOMTOM NAM2013, Mapscape India
# 2.1.1.10.9 < ds <= 2.4.1, (0,1,3,11,13)
#                   DB like TOMTOM ECE2014, TOMTOM NAM2014, TOMTOM SGP
# ds >= 2.4.2, (0,1,2,3,11,13)
#                   DB like TOMTOM ECE2015
# Default value: (0,1,2,3,11,13,30)
# Note : Special country rules of use
#        chinese/japanese : do not use usage type, because their requirement is to
#                           only based on the current system language, without the need for usage type
sliUsageTypeFilter = (0,1,2,3,10,11,13,30)

# use_flat_citylist : switch to support flat city lists.
# Possible values : true, false
# Default value : true
# Note: switch to support flat city lists. That is, necessary
#       refinements are concatenated to the city name. The refinement
#       string is separated by flat_city_separator from the city name
#       in both name and display string. The name gets flat_cityappendix
#       appended to identify a refined city entry
use_flat_citylist = true

# flat_city_separator : string that is used as separator for flat citylists
# Default value : ""
# Note : if use_flat_citylist is true, refinements are appended to city name
#        and display string using flat_city_separator. If a city entry doesn't have
#        a refinement, nothing gets appended
flat_city_separator = \

# flat_city_appendix : string that is appended to refinements of flat city list entries
# Default value : ""
# Note : if use_flat_citylist is true, this string is appended to the refinement
#        string of a city entry. This is used to detect refined city entries in later process
flat_city_appendix = ---

# the limited maximun result list
# Default value: 101
# Note : if list_maximum_size is larger than 101, it may cause performance issue as SLI.NDS cannot support fetching all matched list in a short time
#        and this switch only make sense if the destination input database is SLI structure
# do not out of UINT16_MAX, use the suggested default value at present
# list_maximum_size = 101

# Use named object ids for SLI (country, city, street ...) queries whenever possible
# instead of the location input string. This is not possible if the named object ids
# don't have an index.
# possible values: true, false
# default: true
# use_namedobjid_in_sli_query = true

#
# Flexible selection criteria transform mapping value between Core type and Genivi type
#
# SC_COUNTRY = GENIVI_COUNTRY
destination_api_mappping = 0,166
# SC_PLACE = GENIVI_CITY
destination_api_mappping += 1,168
# SC_ROAD = GENIVI_STREET
destination_api_mappping += 2,170
# SC_CROSSROAD = GENIVI_CROSSING
destination_api_mappping += 3,172
# SC_HOUSE_NUMBER = GENIVI_HOUSENUMBER
destination_api_mappping += 4,171
# SC_POSTAL_CODE = GENIVI_ZIPCODE
destination_api_mappping += 5,169
# SC_CITY_DISTRICT = GENIVI_DISTRICT
destination_api_mappping += 6,173
# SC_PLACE_REFINEMENT = GENIVI_PLACE_REFINEMENT
destination_api_mappping += 7,182
# SC_ROAD_REFINEMENT = GENIVI_EXT_STREET_REFINEMENT
destination_api_mappping += 8,1004
# SC_SUB_COUNTRY = GENIVI_STATE
destination_api_mappping += 9,167

# SC_TOWN = GENIVI_TOWN
destination_api_mappping += 51,178
# SC_LOT_NUMBER = GENIVI_LOT_NUMBER
destination_api_mappping += 52,179
# SC_ROOM_NUMBER = GENIVI_ROOM_NUMBER
destination_api_mappping += 53,180

# SC_CITY_SUB_DESTRICT_MAP_SCAPE_JPN = GENIVI_EXT_CITY_SUB_DISTRICT
destination_api_mappping += 123,1000
# SC_CITY_BLOCK_MAP_SCAPE_JPN = GENIVI_EXT_CITY_BLOCK
destination_api_mappping += 124,1001
# SC_AZA_NEUSOFT_JPN = GENIVI_EXT_AZA
destination_api_mappping += 200,1010
# SC_GAIKU_NEUSOFT_JPN = GENIVI_EXT_GAIKU
destination_api_mappping += 201,1011
# SC_TIBAN_NEUSOFT_JPN = GENIVI_EXT_TIBAN
destination_api_mappping += 202,1012
# SC_EDBAN_NEUSOFT_JPN = GENIVI_EXT_EDBAN
destination_api_mappping += 203,1013

# SC_POI_CATEGORY = GENIVI_CATEGORY_NAME
destination_api_mappping += 15,2000

# Set type of address resolving.
# Set to "links" to use the normal way. This uses the relation between link IDs and named object ID to resolve an Address.
# Set to "bmd" to use the japan way. This uses a relation between BMD areas and named object ID to resolve an Address.
# "links" is the default and is used by nearly all maps.
# "bmd" is special for japan and only used by Neusoft maps based on Zenrin data
# possible values: links, bmd
# default: links
address_resolution_type = links

# This option defines the search radius for searching the nearest link around a geo pos.
# Find the nearest link by searching and then use the relation between link IDs and named object ID to resolve an Address.
# If necessary it can be modified for project needs.
# Possible values: uint32 value > 0
# Default value: 1000
# Unit: meters
nearest_link_search_radius = 1000

# Skip checking BMD area feature class when determining whether a geo pos is inside a BMD polygon.
# This configuration item is used to be compatible with the failure of reverseGeocode due to lack of Area-order_8/1/0/2/4 in some DBs.
# possible values: true, false
# default: false
skip_checking_bmd_area_feature_class = false

# use this to find specific feature class
# Possible values : it can be bmd area fearture class, AREA_ORDER_0(159),AREA_ORDER_1(160)...
# Default value : AREA_ORDER_8(167),AREA_ORDER_1(160),AREA_ORDER_0(159)
# Note : this feature class determines which area in tile has the polygon, for example: Japan use AREA_ADMIN;Proton use AREA_ORDER_1 and CHANGAN use AREA_ORDER_0
# now Proton and CHANGAN want to use AREA_ORDER_8.
# Greate wall WEY want to use AREA_ORDER_2(161) and AREA_ORDER_4(163)
bmd_area_feature_class = 167,160,159,161,163

# It is possible to sort SLI entries by its reading
# possible values: DisplayString, LocationInputString
# default: DisplayString
sli_sort_by = DisplayString

# Defines the sorting of sli entries - this is as long there is no automatical detection
# Possible values are:
# alphabetically (Default option, European db sorting order)
# gbk  (Chinese db sorting order)
# katakana (Japanese db sorting order)
sli_sorting_order = alphabetically

#
# Defines specific selection criteria to sort by and sorting order, and we can define multiple
# Its format is "sli_level_sorting = CRITERION,BY_COLUMN,ORDER"
# CRITERION: use an integer representation, the GENIVI type is described in the comment
# BY_COLUMN: for details, refer to "sli_sort_by"
# ORDER: for details, refer to "sli_sorting_order"
# Example: sli_level_sorting = 1010,DisplayString,alphabetically
#          sli_level_sorting += 1011,LocationInputString,katakana
#          ......
#
# GENIVI_EXT_AZA = 1010
sli_level_sorting = 1010,DisplayString,alphabetically

# If next selection criteria was not found, it should be skipped and continue to check the lower selection criteria
# Possible values: true, false
# Default: false
# Note: the selection criteria 'PLACE_REFINEMENT' should be always skipped, it doesn't depend on this configuration
sli_skip_selection_criteria = false

# Serializes all access to the SLI DB. This must be enabled if the destination input uses
# a collation to sort the results. This is the case if the sli_sorting_order is set to katakana
# or gbk. For alphabetically sorting this switch can be set to false.
# Possible values are:
# true  - all access is serialized
# false - all sli access is concurrent
# default: false
serialize_SLI_access = true

# Configures which characters can be spelled with (NVC)
# Kanji (Japanese) and Hanzi (Chinese) are character sets  that can not be typed directly with a keyboard.
# Thus it should be avoided to deliver them by requesting the next valid characters.
# Possible values:
# true : don't provide characters that can not be spelled directly with a keyboard (default)
# false : provide all existing characters
# Default: true
sli_spell_only_keyboard_characters = true

# first search *all* road links in this offroad distance
# Default: 20 m
first_offroad_distance_for_all_roads = 20

# collect more links only below this initial offroad distance
# Default: 50 m
max_offroad_distance_for_more_links = 50.0

# maximum distance of alternative entry points on assumed shadow links
# Default: 1.0 m
max_alternative_radius_for_shadow_link = 1.0

# maximum distance of alternative entry points on assumed overlap links
# Default: 10.0 m
max_alternative_radius_for_overlap_link = 10.0

# the flag whether priority use preferred alternate road name.
# if it is true, we use preferred alternate road name in highest priority,
# if it is false, we provide the road name according to the default priority algorithm,
#                 the default priority is any string < any name < any official name <  any official name in preferred script code < any name in preferred language < official name in preferred language
# Default: false
priority_preferred_alternate_road_name = false

# the flag whether priority use language to find best name.
# if it is true, we use the name for the same system language in highest priority,
# if it is false, we provide the road name according to the default priority algorithm,
#                 the default priority is any string < any name < any official name <  any official name in preferred script code < any name in preferred language < official name in preferred language
# Default: false
priority_use_language_find_best_name = false

[location]
# update interval for WhereAmI feature
# Possible values : it must be greater than 0
# Default value : 3
# Note : the unit is seconds
where_am_i_interval_sec = 3

[poi]
# max_search_in_parallel : max poi search operations done in parallel
# Possible values : 1, 2
# Default value : 2
max_search_in_parallel = 2

# use_supercategory : use supercategory or not
# Possible values : true, false
# Default value : false
# Note : Switch for poi super category. False if super category is not expeceted.
use_supercategory = false

# supercategory_db_path : the path of supercategory database
# Possible values : Zenrin Japan (4th)    : ${main.path_share}na_onecore/resources/poi/supercategory/SuperCategoryConfig_Zenrin_4th_JPN.db
#                   GoldenTom shanghai    : ${main.path_share}na_onecore/resources/poi/supercategory/SuperCategoryConfig_GT_SH.db
#                   TomTom Singapore      : ${main.path_share}na_onecore/resources/poi/supercategory/SuperCategoryConfig_TT_SGP.db
#                   TomTom201408 EUR      : ${main.path_share}na_onecore/resources/poi/supercategory/SuperCategoryConfig_TT_EUR_201406_2_4_1.db
#                   TomTom201408 NAM      : ${main.path_share}na_onecore/resources/poi/supercategory/SuperCategoryConfig_TT_NAM_201406_2_4_1.db
#                   GoldenTom SH_BJ_LN    : ${main.path_share}na_onecore/resources/poi/supercategory/SuperCategoryConfig_GT_SH_BJ_LN.db
#                   GoldenTom Five_Cities : ${main.path_share}na_onecore/resources/poi/supercategory/SuperCategoryConfig_GT_Five_Cities.db
#                   mapscape India        : ${main.path_share}na_onecore/resources/poi/supercategory/SuperCategoryConfig_mapscape_INDIA.db
# Default value : NULL
# Note : Config db can be found under install path "${main.path_share}na_onecore/resources/poi/supercategory/".
#        If not found, you can also get from the path "integration/nena/res/poi/supercategory/".
#        Please make sure this database path is useable.
supercategory_db_path =

# onlinecategory_db_path : the path of online category database
# Possible values : ${main.path_share}na_onecore/resources/poi/supercategory/SupercategoryConfig_Online.db
# Default value : ${main.path_share}na_onecore/resources/poi/supercategory/SupercategoryConfig_Online.db
# Note : Config db can be found under install path "${main.path_share}na_onecore/resources/poi/supercategory/SupercategoryConfig_Online.db".
#        If not found, you can also get from the path "integration/nena/res/poi/supercategory/SupercategoryConfig_Online.db".
#        Please make sure this database path is useable.
onlinecategory_db_path = ${main.path_share}na_onecore/resources/poi/supercategory/SupercategoryConfig_Online.db

# maxSearchRadiusLimited : the maximum search radius when start around position search.
# Range of value : integer from 0 to 2000000
# Default value : 10000
# Unit : meter
# Note : If out of range,it may cause performance problems.
maxSearchRadiusLimited = 2000000

# maxListSizeLimited : the maximum quantity of poi no matter which search mode.
# Range of value : integer from 0 to 999
# Default value : 999
# Note : If out of range,it may cause performance problems.
maxListSizeLimited = 50

# minOnlinePoiListSize : the minimum quantity of online poi
# Range of value : integer from 0 to 999
# Default value : 199
# Note : This value can adjust the ratio of online pois and onboard pois.
minOnlinePoiListSize = 0

# halfCorridorLength : half of search along route corridor
# Range of value : integer from 0 to 65535
# Default value : 1000
# Unit : meter
# Note : If out of range,it may cause performance problems.
halfCorridorLength = 1000

