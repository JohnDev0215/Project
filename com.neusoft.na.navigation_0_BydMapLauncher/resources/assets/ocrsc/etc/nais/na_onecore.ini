# simulate_deviation: switch of simulate deviation, which will used to simulate deviation and trigger learning.
# Possible value: on or off.
# Default value: off.
# Note: Currently we use 0 as default value for deviation identification, it may be changed with Positioning's features.
simulate_deviation = off

# For multiple deviations, if the distance between them is greater than min_deviation_distance, deviate will be considered.
# Default value: 2000
# Unit is centimeter.
min_deviation_distance                                     = 2000

# For multiple deviations, if the time span between them is greater than min_deviation_time, deviate will be considered.
# Otherwise not trigger rerouting, the condition and 'min_deviation_distance' all must be matched.
# Default value: 1s
# Unit is second.
min_deviation_time                                         = 1

#RoadBook specific settings
[roadbook]

# In roadbook, we need to search toll gate at alternative direction of a route.
# If in this configurable distance, no toll gate is found, then stop searching.
# Default value: 1000
# Unit is meter.
max_search_distance_for_toll_gate_at_exit                 = 1000

# In the RoadBook - SeasonalRestriction function, we need to detect the seasonal restriction state
# every once in a while. This configuration switch sets that interval in seconds.
# Default value: 60
seasonal_restriction_update_interval                      = 60

[tracker]
# In tracker, we need to store the positioning points and links.
# The datas of points and links is stored in persistence files.
# These files num is limited.
max_persistence_file_num                                  = 30

# The trackerstorage need a point cache and a link cache.
# The cache size is limited.
max_persistence_pointlist_num                             = 20000
max_persistence_linklist_num                              = 5000

# If the links which are from positioning are not connected,
# then need to search connected links from DB.
# The num of searched links in DB is limited.
max_search_from_db_link_count                             = 10

# the links from positioning have match quality.
quality_tracker_link_match                                = 97.01

[vehicle]
# This section contains the default values at startup time for vehicle properties.
# They can be changed at runtime via API calls SetVehicleParameter()
# Therefore, OneCore code internally must not use these values directly,
# but instead get the current values from mgr/configuration.

# Vehicle height + some tolerance (think of antennas on the roof, ski holders, luggage containers...)
# to safely drive through (parking garage entry, underbridge).
# The current value of 221cm is chosen to avoid tiny tunnels in Japan.
# Default value: 0 meaning ignore/unknown
vehicle_height_cm          = 221

# Vehicle width + some tolerance to safely drive through (parking garage entry, underbridge).
# The current value of 200cm is taken from the default NDS value.
# Default value: 0 meaning ignore/unknown
vehicle_width_cm           = 200

# The mass of a car including all its loading, not only the empty car's mass.
# Possible value: depends on the car.
# Default value: test value 1300 until we have the real parameters + 200 kg loading.
vehicle_mass_kg            = 1500

# Number of persons in car (HOV).
# Default value 0 means "unknown".
# vehicle_occupancy          = 1

# the following equipment flags match one to one the Equipment of NDS spec.

# Vehicle drawn by another vehicle
# true - has a trailer
# false - has no trailer
# Default value: false
# has_trailer                = false

# Trailer home
# true - has a caravan
# false - has no caravan
# Default value: false
# has_caravan                = false

# Detachable freight trailer which is supported in the front by the tractor.
# true - has a semitrailer
# false - has no semitrailer
# Default value: false
# has_semitrailer            = false

# Vehicle has snow chains to support traction on snowy or icy roads.
# true - has snow chains
# false - has no snow chains
# Default value: false
# has_snowchains             = false

# Vehicle has 4-wheel drive
# true - has a 4-wheel drive
# false - has no 4-wheel drive
# Default value: false
# has_four_wheeldrive        = false

# Vehicle powered by gaseous fuel
# true - has gaseous fuel
# false - has no gaseous fuel
# Default value: false
# has_gaseousfuel            = false

# Vehicle powered by electric power
# true - is electric
# false - is not electric
# Default value: false
# is_electric                = false

# Vehicle is hybrid vehicle (meaning it has a motor combination of fossile and electric fuel)
# true - is hybrid
# false - is not hybrid
# Default value: false
# is_hybrid                  = false

# Vehicle is autonomously driven, new in NDS 2.5.2
# Default value: false
# is_autonomously_driven     = false


[hybridservice]
# Defines the service strategy that can be used by onecore to provide services after database synchronization between local and cloud
# Service strategy is which service level
#   - for DB providers         : INdsDb for local NDS Database or Hybrid Online Database(HOD) or IHybridNdsDb for fresh Hybrid Online Database
#   - for interface providers  : local interfaces or remote interfaces( aka. onlineservices )
# OneCore managers can utilize to provide their functionality
# Possible Values:
#   local_hybrid :
#       - for DB providers         : indicate managers in OneCore use interfaces with data from local NDS Database or Hybrid Online Database(HOD) via INdsDb.
#                                    for details, refer to "[nds]->use_hybrid_db_service"
#       - for interface providers  : indicate managers in OneCore use local interfaces or remote interfaces
#   fresh_hybrid  :
#       - for DB providers         : indicate managers in OneCore use IHybridNdsDb and INdsDb to fetch nds data respectively.
#                                    Prefer to use IHybridNdsDb for latest database data when remote database is newer than local.
#       - for interface providers  : indicate managers in OneCore use local interfaces or remote interfaces according to decision_table
#   online       : (TBD)
#       - for DB providers         : indicate managers in OneCore only use online database.
#       - for interface providers  : indicate managers in OneCore only use online interfaces.
# Default Value: local_hybrid
service_mode = fresh_hybrid

# Name of configuration file containing a decision table for choosing service level according to conditions.
# The decision table is used to indicate which servicelevel component features are supposed to use in a specific functionality on specific conditions
# There are two kinds of service level
#    - DBServiceLevel       : details reference ServiceLevelType in ServiceLevelTypes.fidl
#        Possible Values: local_hybrid,fresh_hybrid,autonomous
#    - ProviderServiceLevel : details reference ServiceLevelType in ServiceLevelTypes.fidl
#        Possible Values: remote,local,autonomous
# Possible values: path to readable configuration file with servicelevel decision table
# default value: ${main.path_share}na_onecore/resources/nds/${nds.resource_set}/decisiontable/ServiceLevel_config.xml
decision_table = ${main.path_share}na_onecore/resources/nds/${nds.resource_set}/decisiontable/ServiceLevel_config.xml

# enable or disable the <default> config in decision table
# Default Value: true
default_config = true

# cycle time in milliseconds to trigger decision engine to make servicelevel decision,
# Default Value: 100
decision_period = 100

# duration time in milliseconds to judge online connection status as consistent and steady
# when OnlineConnection status toggle and keep a continuous time Tc, we say online connection status is steady
# Only steady status is valid for updating servicelevel according to 'decision_table'.
#           |--------------------------|          |--------------------------|
# __________|            Tc            |____Tu____|           Tc             |__________
#
# Default Value: 3000
online_connection_duration = 3000

# duration time in milliseconds to judge remote data validity as consistent and steady
# Default Value: 3000
remotedata_validity_duration = 3000

# testmode: true-turn test mode on,false-turn test mode off
# when running in testmode:
#  1. StrippedDBSyncStatus will set to FRESH_REMOTE after SimStrippedDBSyncStatus milliseconds
#  2. RemoteDataStatus will set to REMOTEDATA_OK after SimRemoteDataStatus milliseconds
#  3. OnlineConnectionStatus will set to true after SimOnlineConnection milliseconds
#  4. ActiveRouteStatus will set to ROUTE_CALCULATOR_CLOUD when active route exist
# NOTE: the real status of StrippedDBSyncStatus,RemoteDataStatus and ActiveRouteStatus is discarded.
# Default Value: false
test_mode=false

# delay time of simulating StrippedDBSyncStatus in milliseconds
# Default Value: 5000
sim_strippeddb_sync=5000

# delay time of simulating RemoteDataStatus in milliseconds
# Default Value: 5000
sim_remote_data=5000

# delay time of simulating OnlineConnection in milliseconds
# Default Value: 5000
sim_online_connection=5000

# true-use simulate status,false-use real status
sim_active_route=false




