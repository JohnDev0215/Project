# minimum_traffic_update_interval_s: The minimal time between two route evaluations triggered by traffic changes
# Possible values: uint32 value >= 0 (unit: seconds)
# Default value: 60 seconds
# When traffic info updates are more frequent, then this setting limits the interval of route reevaluations.
minimum_traffic_update_interval_s = 60

# traffic_update_trigger_reevaluate_routes: The setting for trigger Route to reevaluate routes when traffic information update
# Possible values: true or false
# Default value: true
# When the settting is true, every time traffic information update will trigger reevaluate routes.
traffic_update_trigger_reevaluate_routes = true

# traffic_update_trigger_recalculate_routes: The setting for trigger Route to recalculate routes when traffic information update
# Possible values: true or false
# Default value: true
# When the settting is true, every time traffic information update will trigger recalculate routes.
# This setting can be set to true only when traffic_update_trigger_reevaluate_routes is set to true.
