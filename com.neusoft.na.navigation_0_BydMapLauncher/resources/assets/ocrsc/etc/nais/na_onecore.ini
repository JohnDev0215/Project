crosshair_scale             = 2.0
#APPLE:   crosshair_scale               = 1.3
crosshair_blend_with_city     = false        # enable crosshair blending with 3DC
crosshair_blend_with_dtm      = true         # enable crosshair blending with DTM
crosshair_blend_alpha         = 0.25         # alpha factor for hidden crosshair
crosshair_visibility_size     = 174          # crosshair size in pixel for display visibility calculation when setting map section.
sky                        = true            # range: see mapview.ortho_min_scale && adapted at load time by the DB limits
sat                        = true
google_sat_images          = false           # Activate google sat images for this display
citymodel                  = true
landmarks                  = true
extruded_footprints        = false
route                      = true
flags                      = true
traffic                    = true
trafficicon                = true
range                      = true            # energy range visualization

weather                    = true
weather_range              = 50000 9999999

# Brief: Show or hide TI area polygons and icon messages. This feature is commonly used for japan projects (EU and US not yet implemented).
# Default value: false
trafficarea                    = false

traffic_block                  = true            # enable to display of blocked traffic line
traffic_flow_arrow             = false           # enable the display of traffic flow arrows
traffic_flow_arrow_range       = 1 25000         # set the range where the traffic flow arrows are visible
parkingicon                    = true
globe                          = true
globe_range                    = 17500000 4000000000
fog                            = true
fog_range                      = 10000000 25000000
maneuver                       = true
maneuverarrow                  = false
roadbook                       = true
routemagnet                    = true
roadbook_ferry_entry_icon      = true
roadbook_ferry_exit_icon       = true
roadbook_ferry_range           = 1 500000000
roadbook_trafficLights_range   = 1 1000000
roadbook_trafficLights_radius  = 40000           # Only traffic lights in a radius of 400m should be displayed.
roadbook_naturalGuidance_range = 1 100000
