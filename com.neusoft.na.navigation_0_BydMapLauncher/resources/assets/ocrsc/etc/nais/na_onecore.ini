tracker                        = true
tracker_range                  = 1 20000         # Scale range for tracker points.
kml                            = false
direction_line                 = false
enable_highway_enter_maneuver  = false           # show highway enter maneuver
enable_highway_exit_maneuver   = false           # show highway exit maneuver
enable_lane_merge_maneuver     = false           # show lane merge maneuver (every freeway entrance ramp on the route)
zoom_duration                  = 2.0             # Duration used for zoom level change. Default 5.0 seconds.
