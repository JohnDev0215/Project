#                   GoldenTom SH_BJ_LN CHN    : ${main.path_share}na_onecore/resources/poi/phonenumber/Phonenumber_configfile_GT_SH_BJ_LN_HANS.txt
#                   GoldenTom SH_BJ_LN PY     : ${main.path_share}na_onecore/resources/poi/phonenumber/Phonenumber_configfile_GT_SH_BJ_LN_PY.txt
