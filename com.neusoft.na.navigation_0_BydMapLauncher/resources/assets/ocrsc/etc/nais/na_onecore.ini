# alongroute_max_search_distance : set max distance on the route.
# Range of value : integer from 0 to unlimited
# Default value : 20000
# Unit : meter
# Note : If out of range, out results will not be provided.
#        If this value is 0, we will not limit search distance.
alongroute_max_search_distance = 50000

# alongroute_max_search_area_distance : set max distance to get route search area.
# Range of value : integer from 0 to unlimited
# Default value : 99999990
# Unit : meter
# Note : If out of range, out search area will not be provided.
#        If this value is 0, we will not limit the distance of route search area.
alongroute_max_search_area_distance = 99999990

# poi_along_route_feature : define used along route feature
# Its format is "poi_along_route_feature = FEATURE".
# FEATURE: the feature name of along route function.
# Note : feature description
#        1.SW_default:
#           This is the situation of the "poi_along_route_feature" nothing given or empty given.
#           The basic function of along route search, search along the entire route and the search corridor width is "haldCorridorLength".
#                (All areas except Japan area only use normal)
#        2.alongroute_ranges:
#           This feature include all SW_default function,
#           and it has special search conditions:(Currently, only the Japanese area uses this feature.)
#             2.1 The range of the route side is as follows.
#               2.1.1 Exit of express way.(Excluding the last exit):
#                     Within a Specified radius from branch of the main road of metropolitan highway IC passed by.
#               2.1.2 Exit of urban express way.(Excluding the last exit):
#                     Within a Specified radius from branch of the main road of metropolitan highway IC passed by,
#                     Because exit of urban express way is very close, if you search for charging spots, it uses a Specified radius.
#               2.1.3 POI of SA/PA that is in driving lane side.
#               2.1.4 Within a Specified radius from both sides of the route in an general road case,
#                     If you search for charging spots, it uses a Specified radius.
#               2.1.5 The search range is that distance on the route is "alongroute_max_search_distance".
#            The above mentioned specified radius please refer to [alongroute_ranges]->alongroute_searchrange
poi_along_route_feature = alongroute_ranges

# Search radius when search pois around service area in along route search
# Range of value : integer from 500 to 1500
# Default value : 1000
# Unit : meter
# Note : If the value is too small, can not search all corresponding pois in the SA. If too large, can search pois on other motorway
sa_search_radius = 1000

# Limit the number of successive links used to check route side of poi for along route search
# The value should be adapt to number of main road links across the service area
# Default value : 5
# Unit : number
# Note : used to filter out pois in SA on the other side of the route
poi_routeside_check_links  = 5

# Database path using for personal poi
# Database in this path would be read and written, and would be stay alive over cycles,
# Do please make sure that it has r/w access right.
# The amount of data depends on the data from BL.
personal_pois_path = ${main.path_share}na_onecore/resources/poi/ppoi/

# charging_station_config_file : the path of charging station config file
# Possible values : Nissan Japan    : ${main.path_share}na_onecore/resources/poi/chargingstation/charging_station.ini
# Default value : NULL
charging_station_config_file =

# time interval used to judge if the cached poi is newly add
# if poi update time has been over for this interval, it should be recognized as new
# the unit of this value is millisecond (default value is 86400000 for one day)
cachedpoi_isnew_time_interval = 86400000

# Cached poi will be used in map or other modules, DI will provide tile ids related to poi
# Here defines level of these tile ids, so that other modules can use
provide_tile_level_of_cachedpoi = 9
provide_tile_level_of_cachedpoi += 11
provide_tile_level_of_cachedpoi += 13

# This option will extend relationship between poi category and attributes
# For example: EV(1222) and ATTR_ID_OPEN_AT_GIVEN_TIME(10110) means ATTR_ID_OPEN_AT_GIVEN_TIME is available with category EV.
# That attribute can be fetched by GetCategoriesDetailsEx interface.
# Its format is "extend_category_attributes_relation = CATEGORY_ID, ATTRIBUTE_ID"
# To give multiple relations, can add a new line like "GetCategoriesDetailsEx += CATEGORY_ID, ATTRIBUTE_ID"
extend_category_attributes_relation = 1222, 10110   # EV, ATTR_ID_OPEN_AT_GIVEN_TIME

# This option defines the highest level of tile which can be searched in. All the levels higher than this will be missed.
# Tips:
# Mapviewer request charging station in such a tile level, and if the level is too high, that will cause performance problem.
# Because DI can only search pois by tile level 13, if the tile level is higher than 11, for example 9/7/5, that will cause millions of search.
# So this configuration should be set to match poi show level in Mapviewer.
search_by_tile_highest_level = 13

# enable or disable collect vics charging station data: true is enable, false is disable
enable_vics_data_collector = false

# child_poi_categories limit child poi by specific categories 1097(parking lot), 1433(airport terminal), 1434(entrance)
child_poi_categories = 1097, 1433, 1434

# poi_pvid_prefix defines a specific prefix for pvid. pvid is specific id for online search.
# Its format is "poi_pvid_prefix = CATEGORY,PREFIX"
# CATEGORY: represents one category
# PREFIX: this is the prefix of pvid
# Example: poi_pvid_prefix = 1097,here:offstreetparking
#          poi_pvid_prefix += 1099,here:fuelstation:
#          ......
#
poi_pvid_prefix = 1097,here:offstreetparking:
poi_pvid_prefix += 1099,here:fuelstation:
poi_pvid_prefix += 1344,here:evstation:
poi_pvid_prefix += 1431,here:evstation:
poi_pvid_prefix += 1432,here:evstation:

# enable or disable poi around search algorithm based on scope of mortoncode.
# poi_search_radius is used for this feature
enable_search_by_mortoncode = true

# Defines poi search scope by setting the different circle radius from short to long distance.(radius unit: meter)
# This option must be set by distance ASC..
# Firstly, use the shortest radius to make a circle scope to find excepted category pois,
# then use the second short radius to find pois,and so on, until we get enough of pois or the radius arrives at the largest scope(the longest radius).
# Default value: 1500 2500 4000 7500 10000 15000 20000 30000 40000 50000
# Note : If this option is conflicted with the user interface of SetCategories' poiCategories' radius, this option will be ignored.
poi_search_radius = 1500 2500 4000 7500 10000 15000 20000 30000 40000 50000 100000 150000 200000 250000 300000 350000 400000 500000 750000 1000000 2000000 3000000

# defines along route search results select strategy.
# format is 
##max route length,
##max selected result num by one search,
##result distribution space length,
##tolerant length for comparing summation of link length and distribution space length
# Default value: 
#alongroute_result_strategy = 50000.00,1,1000.00,200.00
#alongroute_result_strategy += 300000.00,1,5000.00,1000.00
#alongroute_result_strategy += 9999000.00,1,10000.00,2000.00

alongroute_result_strategy =  50000.00,1,1000.00,200.00
alongroute_result_strategy += 250000.00,1,5000.00,1000.00
alongroute_result_strategy += 500000.00,1,10000.00,1000.00
alongroute_result_strategy += 750000.00,1,15000.00,1000.00
alongroute_result_strategy += 1000000.00,1,20000.00,1000.00
alongroute_result_strategy += 9999000.00,1,50000.00,2000.00

[alongroute_ranges]
# Defines specific search range to link type and category, and we can define multiple.
# Its format is "alongroute_searchrange = LINKTYPE,CATEGORY,RANGE"
# LINKTYPE: include general road, expressway and urban expressway.
# CATEGORY: represents one or more categories, if is "ALL", means all categories.
# RANGE: use an integer representation, it is along route search range, the unit is meter.
# Example: alongroute_searchrange = General_Road,ALL,200
#          alongroute_searchrange += General_Road,Charging_Spot,800
#          ......
#
alongroute_searchrange  = General_Road,ALL,200
alongroute_searchrange += General_Road,Charging_Spot,200
alongroute_searchrange += Expressway,Motorway_Exit_ALL,500
alongroute_searchrange += Expressway,Motorway_Exit_Charging_Spot,500
alongroute_searchrange += Urban_Expressway,Motorway_Exit_ALL,200
alongroute_searchrange += Urban_Expressway,Motorway_Exit_Charging_Spot,800
alongroute_searchrange += General_Road,Start_Point_ALL,200
alongroute_searchrange += General_Road,Start_Point_Charging_Spot,800
alongroute_searchrange += General_Road,End_Point_ALL,200
alongroute_searchrange += General_Road,End_Point_Charging_Spot,800

# Config parameters for mecab 3rd party library, a japanese morphologic analyser used by FTS.
# This section is japan-specific. We may add a Korean one in future.
[mecab-jpn]
# path to the dictionary mecab shall use
dicdir   = ${main.path_share}na_onecore/resources/fts/mecab/ipadic
userdic  = ${main.path_share}na_onecore/resources/fts/mecab/ipadic/userdic
userdic += ${main.path_share}na_onecore/resources/fts/mecab/ipadic/extdic
fuzzydic = ${main.path_share}na_onecore/resources/fts/mecab/ipadic/fuzzydic
nbest = 10
fuzzy-nbest = 10
fuzzy-nbest-limit = 3
cost-factor = 700
lattice-level = 2
theta = 0.005
prob-limit = 0.005
bos-feature = BOS/EOS,*,*,*,*,*,*,*,*
bos-format =
config-charset = UTF-8
eon-format =
eos-format = EOS\n
eos-format-chasen = EOS\n
eos-format-chasen2 = EOS\n
eos-format-simple = EOS\n
eos-format-yomi = \n
eval-size = 8
max-grouping-size = 24
node-format = %m\t%H\n
node-format-chasen = %m\t%f[7]\t%f[6]\t%F-[0,1,2,3]\t%f[4]\t%f[5]\n
node-format-chasen2 = %M\t%f[7]\t%f[6]\t%F-[0,1,2,3]\t%f[4]\t%f[5]\n
node-format-simple = %m\t%F-[0,1,2,3]\n
node-format-yomi = %pS%f[7]
unk-eval-size = 4
unk-format = %m\t%H\n
unk-format-chasen = %m\t%m\t%m\t%F-[0,1,2,3]\t\t\n
unk-format-chasen2 = %M\t%m\t%m\t%F-[0,1,2,3]\t\t\n
unk-format-yomi = %M

# Config parameters for Jieba 3rd party library, a chinese morphologic analyser used by FTS.
# This section is chinese-specific.
[jieba-chn]
# path to the dictionary jieba shall use
jiebadic = ${main.path_share}na_onecore/resources/fts/nais/jieba/dict/jieba.dict.utf8
hmmdic   = ${main.path_share}na_onecore/resources/fts/nais/jieba/dict/hmm_model.utf8
userdic  = ${main.path_share}na_onecore/resources/fts/nais/jieba/dict/user.dict.utf8
idfdic   = ${main.path_share}na_onecore/resources/fts/nais/jieba/dict/idf.utf8
stopdic  = ${main.path_share}na_onecore/resources/fts/nais/jieba/dict/stop_words.utf8

[fts]
# ftsMaxListSizeLimited: the maximum amount of results for an fts search
# Range of value : integer from 0 to 1000
# Default value : 1000
# Note : If out of range,it may cause performance problems
ftsMaxListSizeLimited = 50

# ftsQueryLimit: the maximum amount of matches for an fts query
#
# This should be equal or higher then "ftsMaxListSizeLimited". The first query results are used as
# input for postprocessing to get more relevant results. The postprocessing will limit the
# amount of entries to "ftsMaxListSizeLimited"
#
# Range of value : integer
# Default value : 1000
# Note : -1 means no limit
ftsQueryLimit = 4000

# ftsPoiActiveSearchColumns: names the columns which are used for the fts poi search. Columns which are not listed here will be ignored.
# It is possible to mark columns as optional (pattern: \*<column-name>). Columns marked this way will be used only for the ranking
# if there was a hit in one of the unmarked columns.
# Address columns shall not be given by their actual name, but by their NDS selection criteria name,
# such as SC_PLACE, SC_ROAD. See "NumSelectionCriteria" in NDS Specification or "enum SelectionCriteria"
# in NDS lib
#
# This parameter is important for the ranking algorithm to calculate the proper document length.
# Default value Europe / North America:  (poiName, poiCategory, \*SC_PLACE)
# Default value Japan:                   (poiName, poiCategory, \*SC_PLACE, \*SC_CITY_DISTRICT)
# Note : Spaces in the word will be ignored
ftsPoiActiveSearchColumns = poiName, poiCategory, \*SC_PLACE, \*SC_CITY_DISTRICT

# ftsAddressActiveSearchColumns: named the columns which are used for the fts address search. Columns which are not listed here will be ignored.
# This parameter is importent for the ranking algorithm to calculate the right document length.
# Address columns shall not be given by their actual name, but by their NDS selection criteria name,
# such as SC_PLACE, SC_ROAD. See "NumSelectionCriteria" in NDS Specification or "enum SelectionCriteria"
# in NDS lib
#
# Default value:  criterionA, criterionB, criterionC, criterionD, criterionE
# Default value Europe / North America:  (SC_PLACE, SC_ROAD)
# Default value North America:           (SC_SUB_COUNTRY, SC_PLACE, SC_ROAD)
# Default value Japan:                   (SC_SUB_COUNTRY, SC_PLACE, SC_CITY_DISTRICT, SC_AZA_NEUSOFT_JPN)
# Note : Spaces in the words will be ignored
ftsAddressActiveSearchColumns = SC_SUB_COUNTRY, SC_PLACE, SC_CITY_DISTRICT, SC_ROAD

# ftsHighLevelAddressSearchColumns: named the columns which are used for the fts high level address search. Columns which are not listed here will be ignored.
# This parameter is important for the ranking algorithm to calculate the correct document length.
# Address columns shall not be given by their actual name, but by their NDS selection criteria name,
# such as SC_PLACE, SC_ROAD. See "NumSelectionCriteria" in NDS Specification or "enum SelectionCriteria"
# in NDS lib
#
# Default value:  criterionA, criterionB, criterionC
# Default value Europe / North America:  (SC_SUB_COUNTRY, SC_PLACE)
# Default value North America:           (SC_SUB_COUNTRY, SC_PLACE)
# Default value Japan:                   (SC_SUB_COUNTRY, SC_PLACE)
# Note : Spaces in the words will be ignored
ftsHighLevelAddressSearchColumns = SC_SUB_COUNTRY, SC_PLACE

# ftsReplaceSynonymsInInputString: Prefiltering of the input string for the fts search.
# Each pair in the list defines a replace expression. The first element of a pair
# defines the string to be replaced. This string will be replaced with the second element
# of the pair. It is possible to define multiple pairs.
#
# For example:
# ftsReplaceSynonymsInInputString        = ('.','#')
# input string for the search is         = "Tokio intl. Airport Terminal-1"
# after prefiltering, the inputString is = "Tokio intl# Airport Terminal-1"
#
# Default value : (('-',' '),('.',' '))
ftsReplaceSynonymsInInputString = (('INTERNATIONAL','intl'),('.',' '),('(',' '),(')',' '),('*',''))

# ftsConnectorSymbol: connector which can be recognized as space or empty.
# For example:
# ftsConnectorSymbol        = -
# input string is "star-bucks", search string will be "star bucks" or "starbucks"
# Default value : -, _, &
ftsConnectorSymbol = -, _, &

# countrylist_file_path: the file for loading country list for a specified database
# Possible values : Mapscape India            : ${main.path_share}na_onecore/resources/fts/countrylist/countrylist_config_Mapscape_IND.txt
#                   GoldenTom shanghai PY     : ${main.path_share}na_onecore/resources/fts/countrylist/countrylist_config_GT_SH_PY.txt
#                   GoldenTom shanghai CHN    : ${main.path_share}na_onecore/resources/fts/countrylist/countrylist_config_GT_SH_Hans.txt
#                   GoldenTom BJ_SH_LN PY     : ${main.path_share}na_onecore/resources/fts/countrylist/countrylist_config_GT_SH_LN_BJ_PY.txt
#                   GoldenTom BJ_SH_LN CHN    : ${main.path_share}na_onecore/resources/fts/countrylist/countrylist_config_GT_SH_LN_BJ_Hans.txt
#                   GoldenTom Five_Cities PY  : ${main.path_share}na_onecore/resources/fts/countrylist/countrylist_config_GT_Five_Cities_PY.txt
#                   GoldenTom Five_Cities CHN : ${main.path_share}na_onecore/resources/fts/countrylist/countrylist_config_GT_Five_Cities_Hans.txt
#                   Nokia NAM                 : not support, db limitaiton
#                   TomTom ECE(201406)        : ${main.path_share}na_onecore/resources/fts/countrylist/countrylist_config_TT_201406_ECE_2_4_1.txt
#                   TomTom NAM(201406)        : ${main.path_share}na_onecore/resources/fts/countrylist/countrylist_config_TT_201406_NAM_2_4_1.txt
#                   TomTom SGP(201406)        : ${main.path_share}na_onecore/resources/fts/countrylist/countrylist_config_TT_201406_SGP_2_4_1.txt
#                   Zenrin Japan 4th          : ${main.path_share}na_onecore/resources/fts/countrylist/countrylist_config_Zenrin_JP_4th.txt
#                   ChangAn MiddleEast 7      : ${main.path_share}na_onecore/resources/fts/countrylist/countrylist_config_ME_7.txt
# Default value : NULL
# Note : country list config file can be found under install path "${main.path_share}na_onecore/resources/fts/countrylist/".
#        If not found, you can also get from the path "integration/nena/res/fts/countrylist/".
#        Please make sure this config file path is useable.
#        If this switch is not set, then the search will be a global search on all countries.
# countrylist_file_path =

# weight: the weight is used to calculate match distance
# possible value : 50/75/100/125
# Default Value: 50
# Note : this default value is half of levenshtein distance, step is a quarter of levenshtein distance
# weight = 50

# useChineseFuzzySearch: the useChineseFuzzySearch is a flag to control use chinese fuzzy search or not
# possible value : true, false
# Default Value: false
# Note : If search in Chinese use true, otherwise false.
# useChineseFuzzySearch = false

# dictionaryDir: the dictionaryDir is dictionary directory
# default value : ${main.path_share}na_onecore/resources/fts/fuzzy/chn/
# Note: If not found under ${main.path_share}na_onecore/resources/fts/fuzzy/chn/,
#       you can also get from the path "integration/nena/res/fts/fuzzy/"
dictionaryDir = ${main.path_share}na_onecore/resources/fts/fuzzy/chn/

# maxSearchRadius : the maximum search radius when start search in an area(country/state/province) where CCP locates
# Range of value : integer from 0 to 10000000
# Default value : 10000000
# Unit : meter
# Note : You can treat it as the largest radius of a Territory from the CCP, e.g. country/state/province
maxSearchRadius = 0

# radiusStep : the step each radius increases, used during search in ur where CCP locates
# Range of value : integer from 10000 to 50000
# Default value : 20000
# Unit : meter
# Note : You can adjust the radius step based on the real case, e.g. how large the country/state/province is
radiusStep = 50000

# fts_exact_match_enable: the fts_exact_match_enable is a flag to determine whether search exact match items before normal search
# possible value : true, false
# Default Value: false
# Note : if fts_exact_match_enable is false, then we only search the nearest items, do not search exact match poi items in all urs.
fts_exact_match_enable = true

# fts_n_gram_count: size of a word, size 1 is referred to as a "unigram", size 2 is a "bigram", size 3 is a "trigram", and so on.
# Default value : 2
# Note : To choose a value for n in an n-gram model, it is necessary to find the right trade off between the stability of the estimate against its appropriateness.
#        This means that trigram is a common choice with large training corpora (millions of words), whereas a bigram is often used with smaller ones.
# fts_n_gram_count = 2

# fts_ignore_suffix: Suffix, that the fts search will ignore.
# Default value : 都, ト, 道, ド, 府, フ, 県, ケン, 市,　シ, 区,　ク, 町,　ショウ, マチ, 村, ムラ
fts_ignore_suffix = 都, ト, 道, ド, 府, フ, 県, ケン, 市, シ, 区, ク, 町, ショウ, マチ, 村, ムラ

# fts_ignore_high_frequency_token: High Frequency Word, that the fts search will ignore.
# Default value : 店, テン
fts_ignore_high_frequency_token = 店, テン, チョウ, シ

# fts_extension_function_name: the name of exported function defined within extension library
# Default Value: okapi_bm25f
fts_extension_function_name = okapi_bm25f_poi

# fts_extension_lib_path: local path of extension library
# Default Value: (empty)
#LINUX:   fts_extension_lib_path = ./lib/libokapi_bm25_sqlite_extension.so
#WIN32:   fts_extension_lib_path = ./bin/okapi_bm25_sqlite_extension.dll
fts_extension_lib_path = libokapi_bm25_sqlite_extension.so

# remove_lower_case_katakana_inputs: enables or disables removing of lower case katakana
# letters from user input. Removing is only done, if n-gram splitting is enabled
#
# default: false
# remove_lower_case_katakana_inputs = false

# tile_id_prefix: each token in the poiFtsTable is duplicated and prefixed with a tile id
# default: false
# fts_tile_id_token_prefix = false

# fts_tile_id_encoding: Describes how a fts tile id is encoded
# Possible Values: dec, hex
# Default Value hex
fts_tile_id_encoding = hex

# fts_local_search_by_limit_check: enable if using local search when result size surpass limit size
# possible value : true, false
# default: false
fts_local_search_by_limit_check = true

# fts_use_match_suffix: enable if using match suffix asterisk(*), if set true, it may degrade search performance
# possible value : true, false
# default: false
# fts_use_match_suffix = false

# fts_suffix_threshold: if occurence of segment string doesn't exceed this threshold, enable using match suffix asterisk(*)
# Only if fts_use_match_suffix is set to false, this config will be considered.
# If fts_use_match_suffix is set to true, this config will be ignored, suffix will be added to all the segment strings.
# Default value : 4000
fts_suffix_threshold = 100000

# fts_combine_search_threshold: if combine prefix count of search string  doesn't exceed this threshold, enable using match suffix asterisk(*)
# Only if fts_use_match_suffix is set to false, this config will be considered.
# If fts_use_match_suffix is set to true, this config will be ignored, suffix will be added to all the segment strings.
# Default value : 100
fts_combine_search_threshold = 100

# fts_ur_count_threshold: if ur count of doesn't exceed this threshold, enable using match suffix asterisk(*)
# Only if fts_use_match_suffix is set to false, this config will be considered.
# If fts_use_match_suffix is set to true, this config will be ignored, suffix will be added to all the segment strings.
# Default value : 6
fts_ur_count_threshold = 0

# fts_high_level_address_threshold: add threshold for high level address searching.
# Possible value : 1,2,3
# If fts search areas in coutry, province, city, in this case, fts_high_level_address_threshold shall be 3 when search string size is 3.
fts_high_level_address_threshold = 3

# fts_enable_fuzzy_for_mecab: enable if using fuzzy search for mecab
# possible value : true, false
# default: true
fts_enable_fuzzy_for_mecab = true

# fts_poi_category_name_prefix: prefix to identify a poi category name, currently 0xE000 is used
fts_poi_category_name_prefix = 0xE000

# search poi and address in one job
fts_unique_branch = true

# The radius which search start with, available when fts_unique_branch is true
# Default value : 100000
# Unit : meter
initial_radius = 100000

# fts_sort_nearby: sort with user specification but in the result of nearby pois
fts_sort_nearby = true

# fts_phone_number_partial_match: if need to search phone number using partial match
fts_phone_number_partial_match = true

# fts_use_morph_separation: the fts_use_morph_separation is a flag to switch morphologic algorithm on or off
# possible value : true, false
# Default Value: false
# Note : The mecab configuration parameter must be set (see [mecab-*] section). If there is no mecab section or the mecab configuration parameter are not set,
#  then the system performance is the same as fts_use_morph_separation = false. If Japanese is set as system language use true, otherwise false.
fts_use_morph_separation = false

# fts_use_n_gram_separation: the fts_use_n_gram_separation is a flag to switch N-Gram algorithm on or off
# possible value : true, false
# Default Value: false
# Note : If Japanese, Chinese or Korean language is set as system language use true, otherwise false.
# fts_use_n_gram_separation = false

# fts_use_jieba_separation: the fts_use_jieba_separation is a flag to switch using jieba segmentation on or off
# possible value : true, false
# Default Value: false
# Note : The mecab configuration parameter must be set (see [jieba-*] section). If there is no jieba section or the jieba configuration parameter are not set,
# the system present is the same as fts_use_jieba_separation = false. If Chinese is set as system language use true, otherwise false.
fts_use_jieba_separation = false

# fts_use_icu_separation: the fts_use_icu_separation is a flag to switch using icu segmentation on or off
# possible value : true, false
# Default Value: false
# Note : If system language is not Japanese or Chinese use true, otherwise false.
fts_use_icu_separation = true

# ftsSuggestionLimit: the maximum amount of results of each suggestion query in each update region
# Range of value : integer from 1 to 1000 for limit, -1 for no limit, no data when zero
# Default value : 500
# Note : If out of range,it may cause performance problems
ftsSuggestionLimit = 500

# ftsSubstitutionLimit: the maximum amount of the substitution characters for single word
# Default value : 100
# Note : If out of range,substitute words will not be added
ftsSubstitutionLimit = 100

# ftsSuggestionRadiusLimit: the maximum radius of the suggestion address
# Range of value : integer from 0 to 9900000
# Default value : 1000000
# Unit : meter
ftsSuggestionRadiusLimit= 1000000

# clipped_word_config_file : the path of clipped word config file
# Possible values: ${main.path_share}na_onecore/resources/fts/clippedWord/clippedWord.txt
# Default value : NULL
clipped_word_config_file = ${main.path_share}na_onecore/resources/fts/common/clippedWord/clippedWord.txt

[MapWindow]
# Real world display resolution.
