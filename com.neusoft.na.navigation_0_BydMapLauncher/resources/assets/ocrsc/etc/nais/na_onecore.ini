# ==================================================================================================================
# crosshair model
# ==================================================================================================================
crosshair_model            = ${main.path_share}na_onecore/resources/mapviewer/${mapviewer.resource_set}/models/crosshair/default/crosshairFlat.dae
crosshair_scale_vector        =  1.0  1.0  1.0
crosshair_rotation_vector     = 90.0  0.0  0.0
crosshair_translation_vector  =  0.0  0.0  0.0

external_route_control     = true


bmd_oneway_icon_width       = 7.0     # One way icon width for BMD point, unit is meter.
bmd_oneway_icon_scale_limit = 0.5     # Minimum one way icon display width won't less than this ratio.
bmd_oneway_icon_max_scale   = 50      # Maximal scale in meter until which the oneway icons are displayed.

bmd_pack_vertices           = true    # use packed vertex attributes to reduce GL buffer memory footprint (memory vs runtime)

clear_color                = 0x4E4E4Eff
ground_max_scale           = 100000
ortho_min_scale            = 2000
zoom_duration              = 2.0  # Duration used for zoom level change. Default 5.0 seconds.
pos_filter                 = 2    # filter speed for car position interpolation
heading_filter             = true
max_render_prepare_time    = 50   # Renderer tuning: Maximum time to execute prepare jobs between two frame render jobs (in msec, default: 10)
prefetch_level             = 8    # DM Tuning: max. number of prefetch views per display (default: 10)
prefetch_job_delay         = 50   # CPU balancing: Delay between triggered load jobs in prefetch loading state (in msec, default: 50)
frq_view_enlarge_factor    = 1.2  # enlarge the load view in fill-render-queue used for freeze causing layers.

# write performance monitor log when switching to 3D when set to true
enable_perfmon_3d          = false

# memory limits (in KBytes)
max_heap_usage             = 40000 # [KB]
max_cache_usage            = 40000 # [KB]

# Recommended value is 80000 KB without DTM. DTM requires additional memory, depending on screen size and DPI.
# To find a good value, track the logs starting with "DtmTextureManager:gpu-mem" -> "totalMax:" and set this value near that.
# If the log is flooded with "free some data", then the current value is too low.
max_gpu_usage              = 400000 # [KB]

#max_load_jobs             = 1
#max_prepare_jobs          = 1

# Map layers
carsor                     = true
crosshair                  = true
bmd                        = true
bmd_load_and_prepare       = true   # load-AND-prepare prefetch tiles in the initial load-job, default: true

# Name:       bmd_area_type_of_tiles_not_in_db
# Default:    0
# Description: This switch offers to replace tiles outside the coverage of a db with an user defined area type.
# Options:    The NDS value of the BMD area feature class. These values are part of the NDS specification (see "NDS-PhysicalModel").
# Example:    AREA_MARINE_WATER has the value 154. This used within our current maps of Japan.
# bmd_area_type_of_tiles_not_in_db = 154

# Name:       bmd_area_type_of_tiles_not_in_db_exceptions
# Default:    0
# Description: This switch defines exceptions for those tiles, which would be added by bmd_area_type_of_tiles_not_in_db (see switch).
# Options:    The packed tile id of the affected tiles.
# Example:    The below settings will enhance the appearance of a Japan map.
#
# level 3
# bmd_area_type_of_tiles_not_in_db_exceptions = 0x080018-0x080019
# bmd_area_type_of_tiles_not_in_db_exceptions += 0x080012
#
# level 5
# bmd_area_type_of_tiles_not_in_db_exceptions += 0x100060-0x100067
# bmd_area_type_of_tiles_not_in_db_exceptions += 0x200120-0x200127
# bmd_area_type_of_tiles_not_in_db_exceptions += 0x20012C-0x20012F


google_sat_images          = false  # Activate google sat image layer
orthoimages                = true
place                      = true   # Activate Place Layer for generic icons (e.g. Markers or Special POIs).
external                   = true   # Activate External Layer for External Icons, Lines and Polygons (e.g. avoid area).
external_special           = true   # Activate External Layer for NonOverlapping Icons.
dtm                        = true   # don't forget to increase the "max_gpu_usage", if DTM is enabled!
citymodel                  = true
landmarks                  = true
extruded_footprints        = false
label                      = true
traffic                    = true # formerly known as 'tpeg'. layer name 'tpeg' is not supported anymore.
trafficicon                = true

weather                    = true

# Brief: Show or hide TI area polygons and icon messages. This feature is commonly used for japan projects only.
# Default:    "false"
# Options
#  "true"   : show area messages
#  "false"  : hide area messages
trafficarea                = false

second_traffic_provider    = carwings
traffic_block              = true      # enable to display of blocked traffic line
traffic_flow_arrow         = true      # enable the display of traffic flow arrows
traffic_flow_arrow_range   = 1 25000   # set the range where the traffic flow arrows are visible
traffic_cap_model          = 0          # traffic cap model. //0: triangle. 1:circle
#show_on_route_traffic_icon = false     # disable to distinguish whether the traffic icon is on the route
original_traffic_icon_hidden_when_highlighted = true
parkingicon                = true
globe                      = true
fog                        = true
maneuver                   = true
maneuverarrow              = false
routemagnet                = true
roadbook                   = true
tracker                    = true
kml                        = false
direction_line             = false
rnc_route                  = true # If true, show RNC (route not classfied) route with dot line; If false, show RNC route as normal.
# Map tracker settings
tracker_point_meter        = 50                 # Can not be more than 50
tracker_point_number       = 3000               # Can not be more than 3000

# NOTE: these info* settings are required for ticket analysis!!
info                       = true               # ALWAYS set it to true, if the target system will generate ticket input!!
info_minimal               = true               # TRUE: show only a single line with "frame tracking" numbers ("FRQ:.."), FALSE: show full info block

# destination depiction
flag_at_destination        = false
link_to_destination        = false

# growth duration for 3d objects in second
o3d_growth_duration        = 3.0

# o3d transparency settings
o3d_transparency           = 0.6

# efb transparency settings
efb_transparency           = 0.6

# default:true
# Description: Setting for controlling efb whether to use lightmode.When true, lightmode, otherwise use color gradient
#              lightmode simulates real lighting.The color gradient changes from light to dark from top to bottom.
efb_light_mode             = true

#  0 no transparency
#  1 transparency around carsor  (default)
#  2 transparency around pivot
o3d_transparency_mode      = 1

o3d_sight_tunnel           = false
o3d_radius_exponent        = 1.5
o3d_transparency_radius    = 0.2
o3d_filter_rect_size       = 30
o3d_roof_dim_factor        = 1.2                # roof color dim configuration: 0 is darkest color. 1.0 is original color
o3d_base_dim_factor        = 0.5                # ground color dim confuguration:. 0 is darkest color. 1.0 is original color

o3d_fade_out_to_skyline    = true               # fade out 3D objects and 3D buildings to skyline?
o3d_fade_out_to_skyline_factor = 0.975          # the factor mean how far away to skyline, now the z coordinate is in the range -1 to 1 when in view, the skyline is 1,  0.975 is a good effect.

# intensity factor for DTM normals, domain: [1.0 - 3.0], default: 1.0
dtm_normal_factor          = 2.0

sun_simulation_speed       = 30                 # minutes per second
sun_simulation_hour        = 12                 # UTC
sun_simulation_minute      = 0

# "abuse" sun simulation for day/night switch
theme_day_id                = 1                           # theme id to be sent by HMI using SetMapViewTheme to switch to day mode
theme_day_hour              = 12                          # UTC hour to be used for sun position on day mode
theme_night_id              = 2                           # theme id to be sent by HMI using SetMapViewTheme to switch to night mode
theme_night_hour            = 22                          # UTC hour to be used for sun position on day mode

reflective_water            = true
#APPLE:   reflective_water  = false                       # problem with jpg loading on iOS
reflective_water_scroll     = 0.02                        # values between 0 and 0.2

label_font_display_size     = 15                          # Actual display size of font, in mm
font_setup                  = 0.53 0.43 0.1 0.1           # configure the inline and outline offsets and outline alpha min and max smoothstep value for the distance-field font

freetype_font_height_mm     = 15                          # For vector font: assumed maximum used text size in mm (default 15). Internal bitmap height of rendered font will be scaled appropriately depending on the display (dpi) resolution
freetype_base_stroke        = 0.02                        # additional stroke of the standard (inner) font (default: 0), in fraction of bitmap height. Applying a small stroke (i.e. make the glyphs more bold) can improve readability of small texts.
freetype_outline_stroke     = 0.08                       # stroke of the font outline (default: 0.08), in fraction of bitmap height
# A list of bit field constants for FT_Load_Glyph to indicate what kind of operations to perform during glyph loading.
# Please refer to FreeType's documentation  http://freetype.org/freetype2/docs/reference/ft2-glyph_retrieval.html#ft_load_glyph
# Possible values : uint32 value > 0,  FT_LOAD_DEFAULT, FT_LOAD_RENDER, FT_LOAD_NO_HINTING, ... or FT_LOAD_DEFAULT | FT_LOAD_RENDER |FT_LOAD_NO_HINTING
# Default value: 0
freetype_load_flags         = 0

scripts                     = Latn Cyrl Grek              # (Hans #Cyrl Grek Arab jpan latn) list of scripts that are covered by map label font (or acceptable otherwise)
#use_label_subtiles         = 0x2400
#suppress_lang_code         = 102                         # Zenrin Japanese/Kanji
#suppress_lang_code         = 1                           # GoldenTom Chinese/Han
#suppress_lang_code        += 269                         # GoldenTom Chinese/Latin

# This switch provides the option to configure the pick up icon corresponding to ExternalIconType
# If this switch is configured, the priority of configuring the pick up icon will be raised to the highest priority
# This can solve the problem of the pick up icon being covered by other elements
# At present, this is a temporary solution, and external refactoring will address these issues as a whole in the future
# The number on the right corresponds to ExternalIconType
# Example:
# elevate_icon_types_picked  = 1
# elevate_icon_types_picked += 2

# Name:       label_icon_text_combined
# Default:    "false"
# Possible values: true / false
# Description: Whether combine label icon and label text for overlapping algorithm
#              TRUE means regarding label icon and label text as a whole integrated rectangle, which brings more efficiency.
#              FALSE means regarding label icon and label text as two separate rectangles, which brings more displayed labels.
#label_icon_text_combined = false

### GL driver features (depends on used hardware)

# Name:       vertex_texturing
# Default:    "true"
# Options
#  "true"   : force enable vertex texturing
#  "false"  : force disable vertex texturing; use this on iMX6
#  "auto"   : enable vertex texturing if the GPU has at least 1 Vertex Texture Image Units
#             (parameter GL_MAX_VERTEX_TEXTURE_IMAGE_UNITS)
#WIN32:   vertex_texturing                       = true
#LINUX:   vertex_texturing                       = true
vertex_texturing                     = auto

bmd_use_advanced_rendering                       = true

# factor to convert a texel to float value. Is GPU dependent (PC-nVidia: 255, Vivante: 256)
texel_to_float             = auto  # domain [auto,255,256]

# Name:       folder_of_compiled_shaders
# Default:    not set
# Description: This switch offers a mechanism for enhancing the start up performance, if a writable directory is available.
# Options
# [path] :    if a path to an existing, writable folder is set, and if the GPU/driver supports binaries,
#             then the binaries are created and stored at the first start and reused with all following life-cycles
# example:    folder_of_compiled_shaders = D:\projects\precompiled_shaders\

# Name:       layer_persistency_file
# Default:    not set
# Description: This switch offers a mechanism for enhancing the start up performance, if a writable directory is available.
# Options
# [path] :    if a path to an existing, writable folder is set,
#             then some meta information about the database is created and stored at the first start and reused with all following life-cycles
# example:    layer_persistency_file = D:\projects\update_region_data\mapviewer.txt
layer_persistency_file = ${main.path_cache}mapviewer.layers

# Name:        label_config_label
# Default:     not set
# Description: By using this switch the user can pass a configuration files with detailed list of settings for the label presentation for LabelLayer.
#              If this switch is not specified a default list of label factories will be created. The default includes plain poi/landmark icon
#              labels as well as settlements, street names and road names.
# example:     label_config_label = ${main.path_share}na_onecore/resources/mapviewer/${mapviewer.resource_set}/config/labeling_config_label.xml
label_config_label       = ${main.path_share}na_onecore/resources/mapviewer/${mapviewer.resource_set}/config/labeling_config_label.xml

# Name:        label_config_parkingicon
# Description: Same as label_config_label but used for ParkingIconLayer.
label_config_parkingicon = ${main.path_share}na_onecore/resources/mapviewer/${mapviewer.resource_set}/config/labeling_config_parkingicon.xml

# Name:        label_config_trafficicon
# Description: Same as label_config_label but used for TrafficIconLayer.
label_config_trafficicon = ${main.path_share}na_onecore/resources/mapviewer/${mapviewer.resource_set}/config/labeling_config_trafficicon.xml

# Please fill in an empty folder and it can be deleted.
# Please do not use the system folder or important folder.
screenshot_path = ${main.path_temp}screenshots/

# Default:    false
# Possible values: true, false
# Description: If set to false, The route path is normally drewn with no outer polygon. If set to true, the map will draw the outer.
# show_route_outer = false

# Carsor position filter, the vehicle position provided by positioning is not smooth enough, especially when only GPS is used. The map uses different filtering methods to smooth the vehicle's position based on the different values of sub configuration items.
# Default:    4
# Options
#  0   : Carsor position linear filter,filtering is performed in a straight line direction, the carsor position not along the route and not smooth enough in pure GPS mode.
#  1   : Carsor position interpolating to avoid the delay by filtering, the carsor and the center of the position map use different filters. This item is only used to test, please don't used in any project.
#  2   : Carsor position interpolating to avoid the delay by filtering, an interpolating filter and a prediction have been added. This item is only used to test, please don't used in any project.
#  3   : Carsor position is smooth through a delayed filter, calculate the distance traveled by the vehicle over time and match the carsor position to the road.
#  4   : carsor position without any filter, use vehicle position provided by Positioning directly.
carsor_filter_type                  = 4

# When receiving the positioning result, it is used to match the carsor position to the road.
# Name:            match_road_length
# Unit:            meter
# Default:         50
# Possible values: uint value, must be greater than 0
# Description:     When there is a guided route,
#                  if the distance on the road between the two carPositions provided in the positioning results is less than match_road_length,
#                  the road shape point between the two carPositions is obtained, used for calculation match road position, otherwise, use the position provided in the positioning result.
match_road_length                   = 50

[streetview]
shader_path = ${main.path_share}na_onecore/resources/streetview/common/shaders
empty_texture = ${main.path_share}na_onecore/resources/streetview/${streetview.resource_set}/neusoft.jpg

[traffic]
# For testing only: If trafficdatafile is specified (file must exist and be readable) and it contains
# traffic data, it is read and processed automatically at startup. Only one file can be specified!
# When no path is given the feature is disabled
# Possible values: path to readable file with any of the supported data formats (tpeg binary, INRIX, ...)
# Default value: empty path
# trafficdatafile             = ${main.path_share}na_onecore/resources/tpeg/Hamburg.tpeg

# Set a radius in km around the car position. A traffic incident or a flow section is marked as "filtered" (and thus hidden), if it is completely outside this radius.
# Possible values: 0 - 10000, 0 means, the filter is disabled
# Default value: 0
# If not set or invalid, the filter is disabled
# filter_radius_km = 200

# Name of configuration file containing a TrafficLtnSelection.position_ltn table (see traffic.position_ltn).
# The only difference to direct configuration traffic.position_ltn is that contents of the file are loaded on demand, which improves the application startup time.
# When no path is given the traffic.position_ltn table in this standard config (loaded at application startup) is used (see traffic.position_ltn below).
# Possible values: path to readable configuration file with TrafficLtnSelection.position_ltn table
# default value: empty path
position_ltn_file = ${main.path_share}na_onecore/resources/traffic/${traffic.resource_set}/TrafficLtnSelection.ini

# Name of configuration file containing a tmc_event_text.text table,which stores the relationship between TMC event code and flag of Roadbook pronunciation
# default value: empty path
tmc_event_text_res_file = ${main.path_share}na_onecore/resources/traffic/${traffic.resource_set}/texts/tmc_event_text.ini

# table containing rectangles covering the TMC TLTs in the USA. The table is used to select tlts for the SDARS-tuner in the USA.
# possible values: tlt + a set of geo rectangles or empty
# default value: an empty table
# If not set TLT selection is disabled. Depending on the SDARS tuner it will either forward no traffic data at all or select random TLTs.
# A geo position is described by WGS84 coordinates, first the longitude (lon) then the latitude (lat)
# A rectangle consists of a south-west geo position and a north-east geo position
# A tlt is identified by ecc/cc/ltn
# format: position_ltn += <ecc>/<cc>/<ltn> rect1.sw.lon rect1.sw.lat rect1.ne.lon rect1.ne.lat rect2.sw.lon... rect<n>.ne.lat
# example:
# position_ltn +=  160/1/1 -88.242188 30.585938 -80.507813 34.804688
# An full table is available in git repository res/traffic/nais/TrafficLtnSelection.ini (if necessary it can be copied and modified for project needs)
# It is *strongly* recommended to use traffic.position_ltn_file instead of direct configuration.

# high_precision_costcalc: configure the cost calculation (w/o lvl 13)
# possible values: true (use the accurate cost calculation using level 13), false (use less acurate but faster cost calculation w/o level 13)
# Default: false
high_precision_costcalc = false

# Time limit for processing (resolving) incoming traffic data.
# Processing incoming traffic data will be interrupted every resolve_time_limit milliseconds to allow route calc and other
# clients to access traffic data (they would have to wait until all input has been processed).
# This allows to tune the performance to give acceptable low latency together with fewest possible update notifications.
# Possible values: uint32 = 0 or uint32 >= 100
# Default value: 0
# Unit: milliseconds
# Values = 0 means disable resolve time limit.
# 0 < Values < 100 ms will be set to 100ms. Recommended range is 700..3000 (estimated, no real life experience).
# low values will especially reduce route calc latency, but *considerably* slow down input processing and increase system load.
# high values will make input processing more efficient, but increase route calc latency.
# resolve_time_limit = 0

# Time delay between resolve each message.
# Special method for lower CPU usage
# The bigger value, the slower resolving, the lower CPU usage
# WARNING: A non-zero value will slows TPEG protocol resolve
# Possible values: uint32 >= 0
# Default value: 0
# Unit: milliseconds
# Values = 0 means do not delay between resolve each message.
# tpeg_resolve_time_delay = 0

# select the strategy to handle different traffic datasources
# possible values:                           Explanation:
#   NoOpTrafficDataSourceCtrl                  Doesn't activate any datasource (for tests or if you don't want to see any traffic data while still handling the messages)
#   ActivateAllTrafficDataSourceCtrl           Activates all datasources received
#   SimpleTrafficDataSourceCtrl                Activates the datasource received last, deactivates all other
#   TakeMostActiveTrafficDataSourceCtrl        Activates the most active datasource, deactivate all others. The number of messages and the last reception time are used to determine the most active datasource.
#   ActAllDoubleMsgSupTrafficDataSourceCtrl    Activates all datasources received, suppresses double messages
#                                              This is currently the only strategy suitable for vics!
# default value:
#   TakeMostActiveTrafficDataSourceCtrl
# example:
# trafficDataSourceStrategy = TakeMostActiveTrafficDataSourceCtrl

# Interval time between tiles for line resolver
# The bigger value, the slower resolving, the lower CPU usage
# WARNING: A non-zero value will slows mapviewer display of traffic
# A recommended value for Proton is 128
# Possible values: uint32
# Default value: 0
# Unit: milliseconds
line_resolve_tiles_interval = 128

# Interval time between tiles for cost resolver
# The bigger value, the slower resolving, the lower CPU usage
# WARNING: A non-zero value will slows routing with traffic
# A recommended value for Proton is 64
# Possible values: uint32
# Default value: 0
# Unit: milliseconds
cost_resolve_tiles_interval = 64

# Whether to redirect TPEG protocol-level resolve TRACK log into files
# Possible values: true (Redirect into files), false (NOT redirect into files)
# Default: false
is_tpeg_resolve_log_file_avail = true

# Whether use distance between location start and link start as tmcstart in NDS DB
# see https://jira.nts.neusoft.local/browse/OC-22778
# Possible values: true (use distance between location start and link start as tmcstart in NDS DB),
# false (use standard NDS tmcstart definition in NDS DB)
# Default: false
use_distance_between_location_start_and_link_start_as_tmcstart_in_nds_db = true

# How to fill the not assigned links/lines with default free LOS
# This value is the range size to be filled.
# It is recommended not to set this value beyond the radius_km within traffic provider section, like inrix/tomtom/here.
# Default: 0 means that do NOT fill the not assigned lines/links.
# radius_km_with_default_free_los = 0

# Maximum FRC of lines/links which will be covered with default free LOS
# This value is only available if radius_km_with_default_free_los != 0.
# Default: 5 means that the not assigned lines/links with FRC [1, 5] will be covered by default free LOS.
# max_frc_with_default_free_los = 5

[inrix]
# inrix section contains configuration for online traffic provider Inrix
# Some values are defaults which may be overwritten via navigation API

# authenticationPath: URL to INRIX authentication server
# Possible values: http URL
# Default value: empty.
# If not set or invalid, feature is not available
authenticationPath  = http://eu.api.inrix.com/traffic/inrix.ashx

# vendorid: ID assigned by INRIX to the vendor of an system. (in this case to NTS)
# Possible values: unsigned number (definition by INRIX)
# Default value: none.
# If not set or invalid, feature is not available
# Value can also be set via navigation API TIOnlineControl.SetInrixConsumerVendorID
vendorid            = 809607280

# consumerid: ID assigned by INRIX to a consumer/user of a system (in this case to NTS)
# Possible values: UUID (definition by INRIX)
# Default value: none.
# If not set or invalid, feature is not available
# Value can also be set via navigation API TIOnlineControl.SetInrixConsumerVendorID
consumerid          = 1f94995b-311a-4d76-99d9-3d88d6d10d80

# dataFileName, authFileName: temporary files to store data fetched from INRIX server
# Possible values: Any writeable filesystem path (filename)
# Default value: none.
# If not set or invalid, feature is not available
# authFileName should be a path that is persisted over onoff cycle
dataFileName        = ${main.path_temp}InrixData.xml
authFileName        = ${main.path_temp}InrixAuth.xml

# reload_threshold_percent: the data is reloaded, when the distance of the car from the last loading position exceeds this percentage of the radius
# Possible values: float from 0.0 to 100.0 (values outside this range may cause undefined behaviour)
# Default value: 100.0
# Note: Select a value depending on radius_km and estimated driving speed, so that it is likely to get new data before car leaves current data area.
reload_threshold_percent = 75

# radius_km: The traffic data is fetched for this radius around the car position
# In normal operation this will be set (overwritten) via navigation API TIOnlineControl.StartLoadData
# This is an initial value used (if not overwritten) when reload_time_seconds is set.
# Possible values: float value > 0.0 (unit: km)
# Default value: 0.0
radius_km           = 20

# reload_time_seconds: enable automatic loading of tmc data from inrix online service.
# The data is automatically loaded every x seconds from the inrix online server.
# !! LEGAL ISSUE !!: Inrix only allows one call every 5 Minutes. Don't change this value to less than 300
# In normal operation this is controlled by HMI via navigation API TIOnlineControl.StartLoadData
# When the API function is called this feature will implicitly disabled.
# Possible values: uint32 value > 0 (unit: seconds)
# Default value: 0 (disabled)
# reload_time_seconds = 300

[tomtom]
# tomtom section contains configuration for online traffic provider TomTom
# Some values are defaults which may be overwritten via navigation API

# authenticationPath: URL to TomTom authentication server
# Possible values: https URL
# Default value: empty.
# If not set or invalid, feature is not available.
authenticationPath  = https://prospect-tts.tomtom.com/Service/InitSession/NEUSOFT_TEST

# certificateURI: SSL certificate assigned by TomTom to the vendor of an system. (in this case to NTS)
# Possible values: Unified Resource Identifier (URI) either of type 'file://' or of type 'data:,'.
#                  The file:// type must contain a local path to a file.
#                  The data:, type must contain inline data (the content of the file)
# Default value: none.
# If not set or invalid, feature is not available. Unless it is set via navigation API.
# Value can also be set via navigation API TIOnlineControl.SetTomTomCredentials
# Commented-out, see MOTS-1161
#certificateURI      = file://${main.path_share}na_onecore/resources/certificates/NEUSOFT-TEST-001.crt

# keyURI: SSL key assigned by TomTom to the vendor of an system. (in this case to NTS)
# Possible values: Unified Resource Identifier (URI) either of type 'file://' or of type 'data:,'.
#                  The file:// type must contain a local path to a file.
#                  The data:, type must contain inline data (the content of the file)
# Default value: none.
# If not set or invalid, feature is not available. Unless it is set via navigation API.
# Value can also be set via navigation API TIOnlineControl.SetTomTomCredentials
# Commented-out, see MOTS-1161
#keyURI              = file://${main.path_share}na_onecore/resources/certificates/NEUSOFT-TEST-001.key

# dataFileName, authFileName: temporary files to store data fetched from TomTom server
# Possible values: Any writeable filesystem path (filename)
# Default value: none.
# If not set or invalid, feature is not available.
# authFileName should be a path that is persisted over onoff cycle
dataFileName        = ${main.path_temp}TomTomData.tpeg
authFileName        = ${main.path_temp}TomTomAuth.xml

# reload_threshold_percent: the data is reloaded, when the distance of the car from the last loading position exceeds this percentage of the radius
# Possible values: float from 0.0 to 100.0 (values outside this range may cause undefined behaviour)
# Default value: 100.0
# Note: Select a value depending on radius_km and estimated driving speed, so that it is likely to get new data before car leaves current data area.
reload_threshold_percent = 75

# radius_km: The traffic data is fetched for this radius around the car position
# In normal operation this will be set (overwritten) via navigation API TIOnlineControl.StartLoadData
# This is an initial value used (if not overwritten) when reload_time_seconds is set.
# Possible values: float value > 0.0 (unit: km)
# Default value: 0.0
radius_km           = 20

# reload_time_seconds: enable automatic loading of tmc data from TomTom online service.
# The data is automatically loaded every x seconds from the TomTom online server.
# In normal operation this is controlled by HMI via navigation API TIOnlineControl.StartLoadData
# When the API function is called this feature will implicitly disabled.
# The implementation enforces a lower limit for this value, which might be changed anytime.
# Therefore the actual limit is NOT documented here.
# Possible values: uint32 value > 0 (unit: seconds)
# Default value: 0 (disabled)
# reload_time_seconds = 120

