fov                        = 50           # horizontal field-of-view angle, for given 'width'
width2depth                = 2.0
width                      = 800          # hardware pixel width of the output device
height                     = 480          # hardware pixel height of the output device
x                          = 10
y                          = 10
title                      = Main Map
display_center             = 0.5 0.5      # '2D' relative center position in the view, normalized x,y position [0..1], origin: top left
display_bottom             = 0.5 0.75     # '3D' relative center position in the view, normalized x,y position [0..1], origin: top left
display_rel_interpolation  = true         # interpolation between "2D" and "3D" relative center y pos (linear to pitch, from 0 to 75 deg)
driver_view_scale_range    = 0 0          # scale range of driver's view(recommend form 1 to 1000), if the range is from 0 to 0, driver's view is deactivated
driver_view_pitch_bottom   = 0.5 1.00     # '3D' relative center position in the driver's view, normalized x,y position [0..1], origin: top left
driver_view_angle          = 75.0
dtm                        = true         # don't forget to increase the "max_gpu_usage", if DTM is enabled!
dtm_range                  = 25000 250000
dtm_flat_fade_offset       = 20000        # start fading from 3d to flat at (dtm min-range + dtm_flat_fade_offset)
dtm_show_normals           = false
dtm_camheight_attenuation  = 0.003        # soften height movemets of the camera on 3D surface (1.0-hard, 0.001-soft)
dtm_subdivide_tiles        = true         # --experimental-- subdivide DTM tiles, if the max level is smaller than 13
dtm_anisotropic_samples    = 8            # samples for anisotropic filtering (1 disables it)
dtm_max_tex_size           = 512          # (N^2) default 512 for dpi=92; increase this parameter with the same factor as the dpi for best results.
dtm_max_tex_cacheMB        = 16           # default: 24MB; Size of DTM texture cache, keep cached textures (cached: outside of the required view) until in given memory limit.
dtm_adapt_pitch            = false
label                      = true
place                      = true         # Activate Place Layer for generic icons (e.g. Markers or Special POIs).
place_range_home           = 1 5000000    # Scale range for Home Special POI.
place_range_favorite       = 1 1000000    # Scale range for Favorite Special POI.
external                   = true         # Activate External Layer for External Icons, Lines and Polygons (e.g. avoid area).
external_range_icons       = 1 1000000    # Scale range for External Icons.
external_range_lines       = 1  500000    # Scale range for External Lines.
external_range_polygons    = 1  250000    # Scale range for External Polygons.
external_special           = true         # Activate External Layer for NonOverlapping Icons.
bmd                        = true
#bmd_range                  = 1 20000000   # default: disabled (let the DB handle this range)
carsor                     = true
carsor_scale_vector        =  0.6  0.6  0.6  // this config in a display section is used for SD carsor
carsor_rotation_vector     = 90.0  0.0  0.0  // this config in a display section is used for SD carsor
carsor_translation_vector  =  0.0  0.0  0.0  // this config in a display section is used for SD carsor
carsor_model               = ${main.path_share}na_onecore/resources/mapviewer/${mapviewer.resource_set}/models/carsor
crosshair                  = false
crosshair_scale            = 2.0
sky                        = true         # range: see mapview.ortho_min_scale && adapted at load time by the DB limits
sat                        = true
google_sat_images          = false  # Activate google sat images for this display
citymodel                  = true
landmarks                  = true
extruded_footprints        = false
route                      = true
flags                      = true
traffic                    = true
trafficicon                = true
range                      = false

# Brief: Show or hide TI area polygons and icon messages. This feature is commonly used for japan projects only.
# Default:    "false"
# Options
#  "true"   : show area messages
#  "false"  : hide area messages
trafficarea                = false

traffic_block              = true # enable to display of blocked traffic line
traffic_flow_arrow         = true # enable the display of traffic flow arrows
traffic_flow_arrow_range   = 1 25000 # set the range where the traffic flow arrows are visible
parkingicon                = true
globe                      = true
globe_range                = 17500000 4000000000
fog                        = true
fog_range                  = 10000000 25000000
maneuver                   = true
maneuverarrow              = false
routemagnet                = false
roadbook                   = true
roadbook_ferry_entry_icon  = true
roadbook_ferry_exit_icon   = true
roadbook_ferry_range       = 1 500000000
roadbook_trafficLights_range  = 1 1000000
roadbook_trafficLights_radius = 40000    # Only traffic lights in a radius of 400m should be displayed.
roadbook_naturalGuidance_range = 1 100000
tracker                    = true
tracker_range              = 1 20000  #Scale range for tracker points.
kml                        = false
direction_line             = false
zoom_duration              = 2.0          # Duration used for zoom level change. Default 5.0 seconds.
info                       = true         # ALWAYS set it to true (in the main display), if the target system will generate ticket input!!
#WIN32:   fps              = true
#LINUX:   fps              = true
fps            = true

low_fps_warn_trigger       = 5     # min frame count, that triggers render warn-timing-logs "Slow frame:"...

#  interval in ms for rendering a frame while in background mode
#  setting to 0 disables background rendering completely
background_render_interval = 1000

# Whether slowly render when background set
# The interval refers to background_render_interval
background_visible = true

# 'scales' is the list of available map scales.
# It is a list of number pairs, flattened into one single list.
# In each pair, the first value is "altitude", and the second is "pitch".

scales              = 200
scales             += 60.0

scales             += 1000
scales             += 60.0

scales             += 2500
scales             += 55.0

scales             += 5000
scales             += 50.0

# from scale 10000 and higher, 3D objects are turned off

scales             += 10000
scales             += 48.0

scales             += 25000
scales             += 47.0

scales             += 50000
scales             += 46.0

scales             += 100000
scales             += 45.0

scales             += 250000
scales             += 40.0

scales             += 500000
scales             += 30.0

scales             += 1000000
scales             += 20.0

scales             += 2500000
scales             += 15.0

scales             += 5000000
scales             += 10.0

scales             += 10000000
scales             += 10.0

# from here on: globe view

scales             += 25000000
scales             += 0.0
scales             += 50000000
scales             += 0.0
scales             += 100000000
scales             += 0.0

# deactivated - these globe views zoom too far out:

# scales           += 250000000
# scales           += 0.0
# scales           += 500000000
# scales           += 0.0

# Set to true if this window should be automatically visible after creation.
# Normally, this only happens upon request from outside (e.g. HMI or project-specific controller).
# However, for debugging purposes, it can be useful to see the window immediately.
# Note that that displaying usually will result in loading a fallback default style (because otherwise nothing would be visible),
# even before the outside HMI has explicitly set one. We set it to true here for platform development purposes.
# Real projects should not set it so it falls back to its default of false.
# See http://jira.nts.neusoft.local/browse/NENA-9824
# Possible values: true / false
# Default: false
initially_visible = true

# Set initial perspective.
# Note: The HMI might persists its perspective settings and apply them when the
#       mapviewer window becomes visible.
# Possible values: 2D / 3D
# Default: 2D
initial_perspective = 2D

# Set the initial scale.
# Note: Currently the HMI expects that the mapviewer window is set to 10km scale
#       (index 9). As long as the OneCore does not notify the HMI about scale changes
#       setting another initial value might confuse the user. The HMI will still
#       display 10km initially unless the scale is changed.
# Possible values: [0..length(scales)-1]
# Default: 9
initial_scale = 9

# Name:       enable_onoff
# Default:    "false"
# Options
#  "true"   : If a frame of this widget consists of incomplete tiles, the mapviewer will be enforced to focus on BMD/DTM data for that frame.
#  "false"  : The current frame content will not influence the mapviewer.
enable_onoff = true

# Name:       number_of_maneuver_show
# Default:    "3"
# Possible values: greater than 0
# Description: This is the number of maneuvers which are shown in map.
number_of_maneuver_show = 3

# Name:       max_screenshots
# Default:    "10"
# Possible values: -1 or greater than 0
# Description: This value indicates the maximum number of screenshots. Set to -1 for unlimited screenshots.
max_screenshots = 10

# Name:       traffic_flow_drawn_under_bmd_road
# Default:    true
# Possible values: true or false
# Description: this item decides the priority between traffic flow lines and BMD road lines
#              value true means traffic flow lines will be drawn under BMD road lines
#              value false means traffic flow lines will be drawn above BMD road lines
# traffic_flow_drawn_under_bmd_road         = true

# Default:    true
# Possible values: true, false
# Description: If set to "true", this widget will load routes data to draw the route.Set to false will not load routes data.
# load_routes_data = true

# Default:    false
# Possible values: true, false
# Description: If set to "true", guided route add circular signs at the starting and ending points of the path.Set to false will not add.
# show_guided_route_start_and_end_signs = false

# Name:       autozoom_highway_max_distance
# Default:    400000
# Unit:       cm
# Description: The timing of autozoom.
#              When distance from vehicle to guided object is less than autozoom_highway_max_distance in high way,start scale calculate.
#              And guided object include Maneuver and Lane_Merge.
autozoom_highway_max_distance                   = 400000
# Name:       autozoom_normalway_max_distance
# Default:    200000
# Unit:       cm
# Description: The timing of autozoom.
#              When distance from vehicle to guided object is less than autozoom_normalway_max_distance in normal way,start scale calculate.
autozoom_normalway_max_distance                 = 200000
# Name:       autozoom_carheading_highway_default_scale
# Default:    50000
# Unit:       cm
# Description: Default scale value when guided object on highway under CarHeading mode.
#              The application timing is when guided object on highway under CarHeading mode,
#              and when  distance between vehicle and guiding object is greater than autozoom_highway_max_distance.
autozoom_carheading_highway_default_scale       = 50000
# Name:       autozoom_carheading_normalway_default_scale
# Default:    10000
# Unit:       cm
# Description: Default scale value when guided object on normalway under CarHeading mode.
#              The application timing is when guided object on normalway under CarHeading mode,
#              and when distance between vehicle and guiding object is greater than autozoom_normalway_max_distance.
autozoom_carheading_normalway_default_scale     = 10000
# Name:       autozoom_carheading_highway_min_scale
# Default:    5000
# Unit:       cm
# Description: Minimum scale value when guided object on highway under CarHeading mode.
#              The value is used when guided object on highway under CarHeading mode and when calculated scale is less than autozoom_carheading_highway_min_scale.
autozoom_carheading_highway_min_scale           = 5000
# Name:       autozoom_carheading_normalway_min_scale
# Default:    2500
# Unit:       cm
# Description: Minimum scale value when guided object on normalway under CarHeading mode.
#              The value is used when guided object on normalway under CarHeading mode and when calculated scale is less than autozoom_carheading_normalway_min_scale.
autozoom_carheading_normalway_min_scale         = 2500
# Name:       autozoom_northheading_highway_default_scale
# Default:    100000
# Unit:       cm
# Description: Default scale value when guided object on highway under NorthHeading mode.
#              The application timing is when guided object on highway under NorthHeading mode,
#              and when distance between vehicle and guiding object is greater than autozoom_highway_max_distance.
autozoom_northheading_highway_default_scale     = 100000
# Name:       autozoom_northheading_normalway_default_scale
# Default:    20000
# Unit:       cm
# Description: Default scale value when guided object on normalway under NorthHeading mode.
#              The application timing iswhen guided object on normalway under NorthHeading mode,
#              and when distance between vehicle and guiding object is greater than autozoom_normalway_max_distance.
autozoom_northheading_normalway_default_scale   = 20000
# Name:       autozoom_northheading_highway_min_scale
# Default:    10000
# Unit:       cm
# Description: Minimum scale value when guided object on highway under NorthHeading mode.
#              The value is used when guided object on highway under NorthHeading mode and when calculated scale is less than autozoom_northheading_highway_min_scale.
autozoom_northheading_highway_min_scale         = 10000
# Name:       autozoom_northheading_normalway_min_scale
# Default:    5000
# Unit:       cm
# Description: Minimum scale value when guided object on normalway under NorthHeading mode.
#              The value is used when guided object on normalway under NorthHeading mode and when calculated scale is less than autozoom_northheading_normalway_min_scale.
autozoom_northheading_normalway_min_scale       = 5000
# Name:       autozoom_factor_of_alongroute_and_linear
# Default:    1.5
# Possible values: 1 ,1.5 or other
# Description: Curvature,alongroute distance to guided object divided by linear distance to guided object.
#              When vehicle and guided object are at a bend, it is more desirable to calculate a suitable scale to see the bend,
#              rather than limited to seeing the guided object. This parameter represents a curvature, and when greater than this parameter,
#              it indicates that there is a bend that needs attention.
autozoom_factor_of_alongroute_and_linear        = 1.5
# Name:       autozoom_min_interval_of_scale_change
# Default:    100
# Unit:       cm
# Possible values: 100 ,200 or 100*i
# Description: Minimum interval of scale change.
#              When min_interval_cm_of_scale_change parameter is 100, the minimum interval for calculating the scale is 100cm,
#              and calculating the scale may be 2500,2600. If set to 200, the result of calculating the scale may be 2400,2600.
autozoom_min_interval_of_scale_change           = 100
# Name:       autozoom_factor_of_scale_change
# Default:    2.0
# Possible values: 1.0 ,2.0 or other
# Description: The factor of scale change, current scale divided by previous scale.
#              When the scale changes greatly, it need a longer time to execute autozoom animation, and then determined by factor_of_scale_change,
#              if the scale change is greater than this parameter, it indicates that it takes a longer time to execute autozoom animation.
autozoom_factor_of_scale_change                 = 1.5
# Name:       autozoom_duration_when_scale_change_small
# Default:    0.6s
# Unit:       second
# Possible values: 0.6 or other
# Description: Animation duration when small change in autozoom scale.
#              if the scale change is less than or equal factor_of_scale_change parameter, use duration_when_scale_change_small parameter to execute autozoom animation.
autozoom_duration_when_scale_change_small       = 0.6
# Name:       autozoom_duration_when_scale_change_large
# Default:    2.0s
# Unit:       second
# Possible values: 2.0 or other
# Description: Animation duration when large change in autozoom scale.
#              if the scale change is greater than factor_of_scale_change parameter, use duration_when_scale_change_large parameter to execute autozoom animation.
autozoom_duration_when_scale_change_large       = 2.0

# Name:       autozoom_guided_point_to_top_ratio
# Default:    0.125
# Possible values: 0.125(1/8),0.25(1/4)
# Description: Minimum distance between next guided point in map to the top of the screen. Value is a ratio of the whole display height.
#              And guided point include Maneuver and Lane_Merge.
autozoom_guided_point_to_top_ratio              = 0.25

# Name:       autozoom_viewlength_of_calculate_scale
# Default:    437.0
# Possible values: 437.0
# Description: View Length from car position to guided point under CarHeading mode.Screen distance between car position and guided point is different,and the calculation scale is also different.
#              In order to adapt to different situations such as the size of navigation machine, car screen position, and guidede point screen position, etc.
autozoom_viewlength_of_calculate_scale          = 437.0

# Name:       autozoom_linear_factor
# Default:    1.1
# Possible values: 1.0,1.1
# Description: Linear relationship coefficient between scale change and car position change.At low scales, the changes in scale are synchronized with the car position,
#              ensuring a linear relationship.The change in scale is equal to the change in car position multiplied by autozoom_linear_factor.
autozoom_linear_factor                          = 1.1

[mapviewer]
# set here the max number of map instances
# a correct value (>= real map_instances) saves a lot of startup time (texture loader etc.)
# after loading number of instances, the cache entry will be deleted (save memory)
max_map_instances = 2

# Bits per pixel for the OpenGL depth buffer (default: 32)
gl_depth_buffer_bits       = 32

# Samples per pixel for the OpenGL image buffer (default: 1)
gl_per_pixel_samples       = 4

# Enable GL feature Vertex Array Object (container for vertex attribute states)
#IOS:     gl_use_VAO         = false # workaround for https://jira.nts.neusoft.local/browse/OC-17864
gl_use_VAO                ?= true  # see https://www.khronos.org/registry/gles/extensions/OES/OES_vertex_array_object.txt

# Enable GL-context resource sharing for multiple displays
gl_share_contexts          = false  # -EXPERIMENTAL- main switch for all gl_share_* ; keep in sync with EGLWidgetManager::gl_share_contexts
gl_share_textures          = false  # shall share textures between GL contexts
gl_share_buffers           = false  # shall share vertex/index buffers between GL contexts
#gl_share_programs          = false  # shall share shader programs between GL contexts (not yet ready to use, wait until OpenGL ES 3.0 is usable && adapt code first!)

# Enable GLSL300 Features
gl_use_GLSL300Features     = false

# if set to true, only complete frames will be rendered.
# this will prevent rendering incomplete frames, but kill mapviewer's reactivity.
# it is strongly recommended to keep this switch set to false.
show_only_complete_frames = false

# below this scale denominator value, the camera scale is set up relative to the display centers latitude (i.e. precise scale at that point)
# default value: "0" = always use precise scale in focus
# recommended value: 5000000 (=1:5,000,000 = "50 km", i.e. medium to most detailed scales)
# max_scale_for_focus_latitude = 5000000

# above this scale denominator value, the camera scale is set up relative to a fixed latitude of 45 degree (avoiding impression of scale change when scrolling N-S direction)
# default value: 50000000 (=1:50,000,000 = "500 km", i.e. global overview scales) (but when max_scale_for_focus_latitude is 0=default, that setting will always be active, and this value is ignored)
# for scales between max_scale_for_focus_latitude and min_scale_for_fixed_latitude, the reference latitude is interpolated between "fixed" and "focus"
# min_scale_for_fixed_latitude = 50000000

styledb                    = ${main.path_share}na_onecore/resources/mapviewer/${mapviewer.resource_set}/styles/Default_Day.style.bin

shader_path                = ${main.path_share}na_onecore/resources/mapviewer/common/shaders
style_path                 = ${main.path_share}na_onecore/resources/mapviewer/${mapviewer.resource_set}/styles
texture_path               = ${main.path_share}na_onecore/resources/mapviewer/${mapviewer.resource_set}/textures
font_path                  = ${main.path_share}na_onecore/resources/mapviewer/${mapviewer.resource_set}/fonts
sat_map_resources_path     = ${main.path_share}na_onecore/resources/mapviewer/${mapviewer.resource_set}/textures/satellite

# choose source of satellite images: 0 = NDS DB, 1 = use sat_map_resources_path path
sat_data_source = 0

# when sat_data_source is set to 1, the following parameters are evaluated:
sat_map_res_tilelevel1_range   = 50000001 4000000000      # 0 means: invalid
sat_map_res_tilelevel2_range   = 10000001 50000000        # 0 means: invalid
sat_map_res_tilelevel3_range   = 1 10000000               # 0 means: invalid

# Override the default folder (texture_path) where the TrafficEventInfos.csv and traffic icons are stored
# Possible values: valid and read accessible filesystem path
# Default value: ${mapviewer.texture_path}
# If not set or invalid, no traffic icons are shown in map or elsewhere i.e. traffic text list
# The folder must contain a file named TrafficEventInfos.csv and should contain traffic icons referenced by TrafficEventInfos.csv
# ti_icon_path = ${mapviewer.texture_path}/NAR

google_satimage_cache_size = 10240 # Cache size in KB for downloading images

#  table for mapping scale to NDS level
#  level, min scale, max scale
google_sat_image_levels    = 13 0 50000
google_sat_image_levels    += 11 50001 250000
google_sat_image_levels    += 9 250001 1000000
google_sat_image_levels    += 7 1000001 5000000
google_sat_image_levels    += 5 5000001 25000000
google_sat_image_levels    += 3 25000001 100000000

# setting this to true assumes that day/night style db are compatible (same scales, same texture atlas layout etc.)
force_styledb_equality     = true

# scaling factor for maneuver points
maneuver_size              = 24.0

# ==================================================================================================================
# The common carsor model. Commonly the carsor base the specific transportation means model is placed on.
# ==================================================================================================================
carsor_model            = ${main.path_share}na_onecore/resources/mapviewer/${mapviewer.resource_set}/models/carsor/transportation_means/model_carsor.obj
carsor_scale_vector        =  0.6  0.6  0.6  // this config in [mapviewer] section is used for HO carsor
carsor_rotation_vector     = 90.0  0.0  0.0  // this config in [mapviewer] section is used for HO carsor
carsor_translation_vector  =  0.0  0.0  0.0  // this config in [mapviewer] section is used for HO carsor

