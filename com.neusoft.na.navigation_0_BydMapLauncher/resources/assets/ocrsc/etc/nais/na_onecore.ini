#
# Distance rounding and formating for Localization manager
#
[measprov_distance_table_def_metric]
target_system          = metric
target_client          = default
quantization_table     =       1;    100;    10  # 10m / 20m / ... / 100m
quantization_table    +=     100;    400;    50  # 100m / 150m / 200m / 250m / 300m / 350m
quantization_table    +=     400; 100000;   100  # 400m / ... / 900m / 1km / 1.1km ... 99.9km
quantization_table    +=  100000;    INF;  1000  # 100km / 101km / ...
format_table           =       0;    950;    m;  float:1:0;  meters
format_table          +=     950;  99950;   km;  float:1:1;  kilometers
format_table          +=   99950;    INF;   km;  float:1:0;  kilometers

[measprov_distance_table_def_us]
target_system          = imperial_US
target_client          = default
quantization_table     =       1;    400;    50  # 50ft, 100ft, 150ft ... 400ft
quantization_table    +=     400;    514;   100  # 400ft, 500ft
quantization_table    +=     514; 316800;   528  # 0.1mi / 0.2mi / .. / 59.9mi
quantization_table    +=  316800;    INF;  5280  # 60mi / 61mi / ...
format_table           =       0;    514;   ft;  float:1:0;  feet
format_table          +=     514; 316536;   mi;  float:1:1;  miles
format_table          +=  316536;    INF;   mi;  float:1:0;  miles
unit_table_UK  = ft;    ft
unit_table_UK += yd;    yd
unit_table_UK += mi;    mi

[measprov_distance_table_def_uk]
target_system          = imperial_UK
target_client          = default
# values in quantization_table and format_table in unit feet (3 feet = 1 yard)
quantization_table     =       1;    300;    30  # 10yd / 20yd / ... / 100yd
quantization_table    +=     300;   1200;   150  # 100yd / 150yd / ... / 400yd
quantization_table    +=    1200;   5190;   300  # 400yd / 500yd / ... / 1700yd
quantization_table    +=    5190; 316800;   528  # 1.0mi / 1.1mi / .. / 59.9mi
quantization_table    +=  316800;    INF;  5280  # 60mi / 61mi / ...
format_table           =       0;   5190;   yd;  float:1:0;  yards
format_table          +=    5190; 316536;   mi;  float:1:1;  miles
format_table          +=  316536;    INF;   mi;  float:1:0;  miles
unit_table_UK  = ft;    ft
unit_table_UK += yd;    yd
unit_table_UK += mi;    mi


[measprov_distance_table_acoustical_metric]
target_system          = metric
target_client          = Guidance_Acoustical
# values in quantization_table and format_table in unit meter
quantization_table     =       1;    100;    10  # 10m / 20m / ... / 100m
quantization_table    +=     100;    400;    50  # 100m / 150m / 200m / 250m / 300m / 350m
quantization_table    +=     400;   1000;   100  # 400m / ... / 900m
quantization_table    +=    1000;    INF;  1000  # 1km / 2km / ...
format_table           =       0;    950;    m;  float:1:0;  meters
format_table          +=     950;    INF;   km;  float:1:0;  kilometers

[measprov_distance_table_acoustical_uk]
target_system          = imperial_UK
target_client          = Guidance_Acoustical
# values in quantization_table and format_table in unit feet (3 feet = 1 yard)
quantization_table     =       1;    300;    30  # 10yd / 20yd / ... / 100yd
quantization_table    +=     300;   1200;   150  # 100yd / 150yd / ... / 400yd
quantization_table    +=    1200;   5190;   300  # 400yd / 500yd / ... / 1700yd
quantization_table    +=    5190;    INF;  5280  # 1 / 2 / ... mi
format_table           =       0;   5190;   yd;  float:1:0;  yards
format_table          +=    5190;    INF;   mi;  float:1:0;  miles
unit_table_UK  = ft;    ft
unit_table_UK += yd;    yd
unit_table_UK += mi;    mi

[measprov_distance_table_acoustical_us]
target_system          = imperial_US
target_client          = Guidance_Acoustical
# values in quantization_table and format_table in unit feet
quantization_table     =       1;    400;    50  # 50ft, 100ft, 150ft ... 400ft
quantization_table    +=     400;   1250;   100  # 400ft, 500ft ... 1200ft
quantization_table    +=    1250;   5280;  1320  # 1/4, 1/2, 3/4, 1 mi
quantization_table    +=    5280;    INF;  5280  # 1, 2, 3, 4, 5mi ...
format_table           =       0;   1250;   ft;  float:1:0;  feet
format_table          +=    1250;   4620;  qmi;  float:1:0;  quarter_miles
format_table          +=    4620;    INF;   mi;  float:1:0;  miles
unit_table_UK  = ft;    ft
unit_table_UK += yd;    yd
unit_table_UK += mi;    mi

#Adas specific settings
# - AdasAutoTree => AdasManager, AdasAutoTreeClient
[AdasManager]
# If true: a tree will be automatically constructed with the given parameters.
# for debugging and DLT creation if no AdasTreeClient is connected via DBUS
AdasAutoTree_Enabled          = false

# As long as the tree is below this forecast length, the TreeExpansionState is short_expansion
# if the tree forecast length is above the TreeExpansionState is ready, SA external interface documentation.
# ValueRange: 1 .. < AdasAutoTree_maximumLength in [m]
# DefaultValue in code: 1000
AdasAutoTree_minimumLength    = 1000

# If the forecast length of the tree reaches this value or is above the TreeExpansionState is ReadyMax and
# the tree will not be automatically expanded further, SA external interface documentation.
# ValueRange: AdasAutoTree_minimumLength > .. uint32_max in [m]
# DefaultValue in code: 5000
AdasAutoTree_maximumLength    = 5000

# The length that should be kept behind the CCP on the tree.
# This also effects the position jump handling and associated tree merging capabilities
# ValueRange: 0m .. uint32_max in [m]
# DefaultValue in code: 200
AdasAutoTree_trailingLength   = 100

# If the count of registered trees reaches this value,
# the request for register tree will not be processed, and an error will be returned
# DefaultValue in code: 8
AdasRegisteredTree_maximumCount    = 8

# Ways to provide first append result when tree is changed from the root link
# ValueRange: 0 .. 2
# 0 : start a new tree, from = 0x0, to = the first changed link
# 1 : avoid starting a new tree by from = to = the first changed link
# 2 : avoid starting a new tree by from = the first changed link, to = next
# DefaultValue in code: 2
AdasTree_AppendOperationType = 2

# Publish the ADAS internal tree as MPP route in OTTO
# Note: This activates the internal AdasTree client as tree source
MppRoute = ON

#----AdasBranch settings

# Publish branches along Mpp Tree
AdasBranch = OFF

# During driving in a section from OutDist_start to OutReady_end,
# Navi_OutDist is set to distance to the branch and sent to control ECU.
# ValueRange: 0 .. 1000 in [m]
# DefaultValue: 1000 in [m]
AdasBranch_OutDist_Start = 1000

# angle formed by branches shall be within this value
# DefaultValue: 60 degrees
AdasBranch_Angle = 60.0

# During driving in a section from OutReady_start to OutReady_end,
# Navi_OutReady is set to branch direction and sent to control ECU.
# OutReady_start and OutReady_end depend on road type

# A series of road type
# ValueRange: 0 .. 2
# 0 : Expressway
# 1 : Urban Expressway
# 2 : Toll Road
AdasBranch_Road_Type = 0 1 2

# A series of OutReady_start
# ValueRange: 0 .. 500 in [m]
# DefaultValue: depends on road type
AdasBranch_OutReady_Start = 400 250 250

# A series of OutReady_end
# ValueRange: 0 .. 500 in [m]
# DefaultValue: depends on road type
AdasBranch_OutReady_End = 300 150 150

# Define if unspecified exit lane information shall be
# calculated from road geometry on motorway exits.
# This configuration shall be set in the DATABASE ini!
# Default value: false
AdasBranch_Unspecified_Motorway_Exitlanes = false

# Publish toll gates along Mpp Tree
AdasBranch_TollGate = OFF

# Detect section for toll gates:
# from current car position to AdasBranch_TollGate_Ready_Distance ahead
# DefaultValue: 1000 in [m]
AdasBranch_TollGate_Ready_Distance = 1000

# Publish section for toll gates:
# from AdasBranch_TollGate_Start to AdasBranch_TollGate_End
AdasBranch_TollGate_Start = 400
AdasBranch_TollGate_End = 300

#----Adasis settings

# Publish Adasis stream to CAN bus
Adasis_Enabled = OFF

# Provide long-range Horizon
Adasis_LongRange = OFF

# Level of service which can be provided
# ValueRange: 1 .. 5
# 1 for ADASIS Mini
# 2 for Main Path Only
# 3 for Main Path with Stubs
# 4 for Main Path with first level Sub-paths
# 5 for Full Horizon
# DefaultValue: 3 (Main Path with Stubs)
Adasis_Level_of_Service = 3

# Maximum Offset Range
# Allowed number range to define an offset value in each CAN message
# ValueRange: 0 .. 8190 in [m]
# DefaultValue: 8190 in [m]
Adasis_Maximum_Offset_Range = 8190

# Maximum Length of Transmitted Path
# Never transmit information farther away from
# the current vehicle position than "maximum length of transmitted path".
# ValueRange: 0 .. 8190 in [m]
# DefaultValue: 6000 in [m]
Adasis_Maximum_Length_of_Transmitted_Path = 6000

# Maximum Length of Transmitted Path
# ValueRange: 0 .. 600 in [m]
# DefaultValue: 600 in [m]
Adasis_Trailing_Length = 600

# Limit the number of active path index values to half of available range
# In adasis protocol, there are 56 path index can be used.
# Use a fixed number of path index values at each time for the current MPP.
# If a new MPP has to be created, the remaining path index values to be used.
# For differentiate MPP, The number must be <= 28 and >= 2
# For transmitted a relatively complete MPP, The number should be >= 20
# DefaultValue: 28
Adasis_Default_Path_Index_Amount = 28

# If the vehicle has driven a distance larger than "Adasis_Max_Offroad_Dist" in "off-road" status
# ADAS horizon provider (OneCore) will delete current MPP, and notify ADAS Reconstructor by "KillTree"
# ADAS horizon provider (OneCore) will send a unknown META-DATA message to ADAS Reconstructor
# ValueRange: 0 .. 8190 in [m]
# DefaultValue: 200 [m]
Adasis_Max_Offroad_Dist = 200

# ADAS horizon provider (OneCore) have to keep in sync with ADAS Reconstructor
# The time gap between the moment a pathindex is made inactive by implicitly removing the path in the
# horizon trail and the moment this pathindex is used again for a new path.
# DefaultValue: 2 [s]
Adasis_Inactive_PathIndex_TimeGap = 2

# If route guidance switches from inactive to active or from active to inactive,
# Segment and stub messages of the ADASIS horizon have to be updated to change the contents of the field "Part of Calculated Route"
# ValueRange: 0, 1
# 0 for "use the update mechanism of ADASIS to resend the changed data"
# 1 for "rebuild the ADASIS horizon from scratch"
# DefaultValue: 1
Adasis_Guided_Route_Change_Handling = 1

# Define ADASIS subpath configuration as a list
# Each line contains the max length of each subpath
# The valueRange of length: 0 .. 8190 in [m]
# The setting is only effective when "Adasis_Level_of_Service" > 3
Adasis_SubPathLength = 5000 # First order subpath

# Adasis_SubPathLength += 800 # Second order subpath

# for Speed limit signs in Profile Long Message
# If true: omit weather-dependent speed limit signs if any weather-independent sign at the same location
# If false: provide all speed limit signs without filter
# If not set: Depends on software default
Adasis_SpeedLimitSign_OmitWeatherDependent = true

#----AdasTraffic settings

AdasTraffic_Enable = OFF

# If the count of registered clients reaches this value,
# the request for register client will not be processed, and an generic error will be returned
# DefaultValue in code: 8
AdasTraffic_RegisteredClient_MaximumCount = 8

# If the count of tiles per client reaches this value,
# the request for set update scope will not be processed, and an generic error will be returned
# DefaultValue in code: 20
AdasTraffic_TileMaximumCount_PerClient = 20

# If the overall number of tiles by all clients reaches this value,
# the request for set update scope will not be processed, and an generic error will be returned
# DefaultValue in code: 100
AdasTraffic_TileMaximumCount_AllClients = 100

#----AdasRouteLinks settings
# On RouteList export give the product id of ADAS database product if set
# or provide the information on routing database (default)
AdasRouteLinks_AdasDb = false


