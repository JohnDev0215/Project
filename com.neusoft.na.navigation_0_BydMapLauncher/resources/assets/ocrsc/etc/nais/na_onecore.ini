appCode             = CT2ZcOvgGRDikVYYVrW4hg

# dataFileName, authFileName: temporary files to store data fetched from HERE server
# Possible values: Any writeable filesystem path (filename)
# Default value: none.
# If not set or invalid, feature is not available.
# authFileName should be a path that is persisted over onoff cycle
dataFileName        = ${main.path_temp}HEREData_AroundVehicle.tpeg
authFileName        = ${main.path_temp}HEREAuth.xml

# reload_threshold_percent: the data is reloaded, when the distance of the car from the last loading position exceeds this percentage of the radius
# Possible values: float from 0.0 to 100.0 (values outside this range may cause undefined behaviour)
# Default value: 100.0
# Note: Select a value depending on radius_km and estimated driving speed, so that it is likely to get new data before car leaves current data area.
reload_threshold_percent = 75

# radius_km: The traffic data is fetched for this radius around the car position
# In normal operation this will be set (overwritten) via navigation API TIOnlineControl.StartLoadData
# This is an initial value used (if not overwritten) when reload_time_seconds is set.
# Possible values: float value > 0.0 (unit: km)
# Default value: 0.0
radius_km           = 20

# reload_time_seconds: enable automatic loading of tmc data from HERE online service.
# The data is automatically loaded every x seconds from the HERE online server.
# In normal operation this is controlled by HMI via navigation API TIOnlineControl.StartLoadData
# When the API function is called this feature will implicitly disabled.
# The implementation enforces a lower limit for this value, which might be changed anytime.
# Therefore the actual limit is NOT documented here.
# Possible values: uint32 value > 0 (unit: seconds)
# Default value: 0 (disabled)
# reload_time_seconds = 120

[trafficcloud]
# trafficcloud section contains configuration for Neusoft online traffic cloud
# Some value are defaults which may be overwritten via navigation API

# geoFilter: Geographic shape of request to download data
# Possible values: String either of type 'circle' or 'rectangle'.
# Default value: rectangle
# note: value can also be set via navigation API.
geoFilter = rectangle

# requestFreeFlow: whether request information for the road unblocked.
# Possible values: String either of type 'off' or 'on'.
#                  The off means TRAFFIC_CLOUD_FREEFLOW_OFF.
#                  The on means TRAFFIC_CLOUD_FREEFLOW_ON.
# Default value: on
# note: value can also be set via navigation API.
requestFreeFlow = on

# dataFileName: temporary files to store data fetched from cloud.
# Possible values: Any writeable filesystem path (filename)
# Default value: none.
# If not set or invalid, feature is not available.
dataFileName = ${main.path_temp}TrafficCloudData.tpeg

# reload_threshold_percent: the data is reloaded, when the distance of the car from the last loading position exceeds this percentage of the radius
# Possible values: float from 0.0 to 100.0 (values outside this range may cause undefined behaviour)
# Default value: 100.0
# note: Select a value depending on radius_km and estimated driving speed, so that it is likely to get new data before car leaves current data area.
reload_threshold_percent = 75

# radius_km: The traffic data is fetched for this radius around the car position
# In normal operation this will be set (overwritten) via navigation API TIOnlineControl.StartLoadData
# This is an initial value used (if not overwritten) when reload_time_seconds is set.
# Possible values: float value > 0.0 (unit: km)
# Default value: 0.0
radius_km = 20

# reload_time_seconds: enable automatic loading of data from cloud online service
# The data is automatically loaded every x seconds from the cloud online server.
# In normal operation this is controlled by HMI via navigation API TIOnlineControl.StartLoadData
# When the API function is called this feature will implicitly disabled.
# The implementation enforces a lower limit for this value, which might be changed anytime.
# Therefore the actual limit is NOT documented here.
# Possible values: uint32 value > 0 (unit: seconds)
# Default value: 0 (disabled)
# reload_time_seconds = 300

[vics]
# BeaconDataFileName: Path to put the beacon protobuf files.
# Possible values: Any writeable filesystem path, followed by the prefix that each protobuf file name must have and the suffix ".vics"
#                  The value must not be the same as FMDataFileName or CarwingsDataFileName (prefix or path may be the same though)
# The file name will be extended with some unique identifier (i.e. reception timestamp)
# to implement buffering. In that case the identifier will be added to the basename (before the sufix).
# Example: BeaconDataFileName  = ${main.path_temp}VICSBeacondata.vics could result in a created file with name:
# Example: ${main.path_temp}VICSBeacondata0000000000000000.vics
# If not set or invalid, the feature is disabled
# Default value: none
BeaconDataFileName = ${main.path_temp}VICSBeacondata.vics

# beaconDSRC_transmission_radius_m: The distance between DSRC beacon and receiver above which no data can technically be received
# Unit: meter
# Possible values: double 0.0..100.0
# default value: 70 (from http://www.vics.or.jp/en/data/media_list.html)
# beaconDSRC_transmission_radius_m = 70

# beaconIR_transmission_radius_m: The distance between infrared beacon and receiver above which no data can technically be received
# Unit: meter
# Possible values: double 0.0..beaconDSRC_transmission_radius_m
# default value: 3.5 (from http://www.vics.or.jp/en/data/media_list.html)
# beaconIR_transmission_radius_m = 3.5

# beacon_L1L2_history_depth: The maximum size of the L1 / L2 beacon history
# Possible values: integer 0..15
# If set to 0, the L1 / L2 feature is disabled
# default value: 10
# beacon_L1L2_history_depth = 10

# beacon_L1L2_expiry_time_s: The duration of L1 / L2 beacon data
# Unit: second
# Possible values: integer 0..3600 (1 hour)
# If set to 0, data will not expire
# default value: 900 (15 minutes)
# beacon_L1L2_expiry_time_s = 900

# beacon_L3_expiry_time_s: The duration of L3 beacon data
# Unit: second
# Possible values: integer 0..3600 (1 hour)
# If set to 0, data will not expire
# default value: 900 (15 minutes)
# beacon_L3_expiry_time_s = 900

# check_beacon_area_in_out_status: Whether to determine if the CCP is within range of a beacon or not
# Once the CCP leaves the beacon range, the data received from the beacon so far is finalized for display and further data from the beacon is ignored
# The range is determined by beaconIR_transmission_radius_m and beaconDSRC_transmission_radius_m
# If the beacon location is unknown, the beacon location is essentially taken to be the CCP at which data was first received and the range is doubled
# Possible values: true or false
# default value: false
# check_beacon_area_in_out_status = false

# FMDataFileName: Path to put the FM protobuf files.
# Possible values: Any writeable filesystem path, followed by the prefix that each protobuf file name must have and the suffix ".vics"
#                  The value must not be the same as BeaconDataFileName or CarwingsDataFileName (prefix or path may be the same though)
# The file name will be extended with some unique identifier (i.e. reception timestamp)
# to implement buffering. In that case the identifier will be added to the basename (before the sufix).
# Example: FMDataFileName = ${main.path_temp}VICSFMdata.vics could result in a created file with name:
# Example: ${main.path_temp}VICSFMdata0000000000000000.vics
# If not set or invalid, the feature is disabled
# Default value: none
FMDataFileName = ${main.path_temp}VICSFMdata.vics

# fm_L1L2_expiry_time_s: The duration of L1 / L2 FM data
# Unit: second
# Possible values: integer 0..3600 (1 hour)
# If set to 0, data will not expire
# default value: 1800 (30 minutes)
# fm_L1L2_expiry_time_s = 1800

# fm_L3_expiry_time_s: The duration of L3 FM data
# Unit: second
# Possible values: integer 0..3600 (1 hour)
# If set to 0, data will not expire
# default value: 1800 (30 minutes)
# fm_L3_expiry_time_s = 1800

# fm_packet_interval_s: The interval between successive timestamps
# Unit: second
# Possible values: integer 0..min(fm_L1L2_expiry_time_s, fm_L3_expiry_time_s)
# default value: 300 (5 minutes)
# fm_packet_interval_s = 300

# fm_L1L2_stored_timestamp_count: The number of FM timestamps for which FM data is to be saved in the system
# Possible values: integer fm_L1L2_expiry_time_s / fm_packet_interval_s + 1...15
# Note: it can happen that the oldest cycle is overwritten a few seconds before it should time out (as determined by fm_L1L2_expiry_time_s),
#       i.e. still-valid data is deleted.
#       Therefore the number of cycles must be greater than fm_L1L2_expiry_time_s / fm_packet_interval_s
# default value: fm_L1L2_expiry_time_s / fm_packet_interval_s + 1
# fm_L1L2_stored_timestamp_count = 7

# enable_L1L2_wideL3_emergency_messages: Whether to enable level 1, level 2 or VICS wide level 3 emergency messages
# Possible values:
# L1L2        --- enable only level 1 and level 2 emergency messages
# wideL3      --- enable only VICS wide level 3 emergency messages
# L1L2_wideL3 --- enable level 1, level 2 or VICS wide level 3 emergency messages
# default value: L1L2_wideL3
# enable_L1L2_wideL3_emergency_messages = L1L2_wideL3

# enable_vics_wide: Whether to enable VICS wide messages
# Possible values: true or false
# Default value: true
# enable_vics_wide = true

# CarwingsDataFileName: Path to put the Carwings protobuf files.
# Possible values: Any writeable filesystem path, followed by the prefix that each protobuf file name must have and the suffix ".vics"
#                  The value must not be the same as FMDataFileName or BeaconDataFileName (prefix or path may be the same though)
# The file name will be extended with some unique identifier (i.e. reception timestamp)
# to implement buffering. In that case the identifier will be added to the basename (before the sufix).
# Example: CarwingsDataFileName = ${main.path_temp}VICSCarwingsdata.vics could result in a created file with name:
# Example: ${main.path_temp}VICSCarwingsdata0000000000000000.vics
# If not set or invalid, the feature is disabled
# Default value: none
CarwingsDataFileName = ${main.path_temp}VICSCarwingsdata.vics

# carwings_L1_history_depth: The maximum size of the L1 carwings history
# Possible values: integer 0..15
# If set to 0, the L1 feature is disabled
# default value: 10
# carwings_L1_history_depth = 10

# carwings_L1_expiry_time_s: The duration of L1 carwings data
# Unit: second
# Possible values: integer 0..3600 (1 hour)
# If set to 0, data will not expire
# default value: 900 (15 minutes)
# carwings_L1_expiry_time_s = 900

# carwings_L3_expiry_time_s: The duration of L3 carwings data
# Unit: second
# Possible values: integer 0..3600 (1 hour)
# If set to 0, data will not expire
# default value: 900 (15 minutes)
# carwings_L3_expiry_time_s = 900

# carwings_max_route_mesh_count: The maximum number of 2nd meshes to be calculated through which a route passes,
#                                for which carwings traffic data should be downloaded.
# Note: the set of calculated meshes is always simply connected and includes the car position, only meshes towards the end of the route are excluded
# Possible values: 0..UINT16_MAX
# If set to 0, no maximum will be used
# default value: 50
# carwings_max_route_mesh_count = 50

# expiry_time_reference: Whether to use reception time of the message or the time in the message (provider time) as reference for expiry time
# Possible values: reception_time or provider_time
# default value: reception_time
# expiry_time_reference = reception_time

# vehicle type information : Defines which type of vehicle this vehicle is
# Possible values: large_car, small_car or plate3_car
# Default value: small_car
# Note:  large car: more than 11 tons (freight vehicle), or more than 30 passenger seats (bus), all others are small cars.
#        A plate3 car is a small car with: width > 1700mm or length > 4700mm or engine power > 2000cc (sth. like a SUV).
#        In case an unknown value is set, default value will be used.
# vehicle_type = small_car

# uplink_interval_m : Uplink configuration to send to the VICS beacon to tell at which driving distance interval the device (navi) will sample the uplink data.
# Possible values : uint16. Either 100 or 200 (no other values allowed)
# Default value : 200
# Unit : meter
# Note : In case an illegal value is set, the default value will be used.
#        These values are defined by VICS DSRC/ETC2.0 uplink specification.
# uplink_interval_m = 200

# dsrc_uplink_angle_deg : DSRC uplink configuration send to VICS beacon to tell at which driving direction angle change the device (navi) will sample the uplink data.
# Possible values : float. Either 22.5 or 45.0 (no other values allowed)
# Default value : 45.0 degree
# Unit : degree
# Note : In case an illegal value is set, the default value will be used
#        These values are defined by VICS DSRC/ETC2.0 uplink specification.
# dsrc_uplink_angle_deg = 45.0

# FM packets containing level 3 data of a given timestamp are received by the VICS manager over an up to 5 minute period.
# The protobuf file containing the level 3 units decoded from these packets can be sent to the traffic manager during this period as they are completed.
# Once the number of units in the protobuf file increases to or above l3_units_threshold, it will be sent to the traffic manager.
# Note: The smaller the value of l3_units_threshold, the more the number of protobuf files that have to be created and handled.
#       The larger the value of l3_units_threshold, the more the number of level 3 units that the traffic manager has to handle in one sweep,
#       and the longer the duration between reception by platform of level 3 data and presentation of that level 3 data to the driver.
# Possible values: 0..UINT16_MAX
# Default value: 100
# l3_units_threshold = 100

# The maximum duration that a protobuf file containing level 3 units can exist before it must be sent to the traffic manager.
# Note: In the typical case that FM packets are arriving less than every few seconds, this parameter has no effect,
#       but becomes important in the case of poor or no FM reception, or of FM packets containing only a few level 3 data.
# Unit: second
# Possible values: 0..UINT16_MAX
# Default value: 30
# l3_time_threshold_s = 30

# The section [VICSIncidentText] defines localized texts for VICS causedetail and restrictiondetail.
# Description: By using this section the user can pass a configuration file with detailed list of vics incident text.
#              Users implement customized text display through this section.
#              If this section is not specified there are hard coded default texts that are NOT end user suitable.
#              i.e. "Cause:0 None. CauseDetail:1 Natural traffic jam"
# Possible values: path to readable file
# Default value: empty.
#
# Contents of incidenttextfile:
# Within section [VICSIncidentText] (yes, the incidenttextfile shall also contain a section VICSIncidentText!)
# Tables of localized text with keys specified as LANG_COUNTRY_SCRIPT (ISO codes) e.g. eng_USA_Latn
# Only ISO codes that are available in NDS database will be processed (more may be specified, but will be ignored).
# <LANG_COUNTRY_SCRIPT> = <iconid> "<text>"
#                     += <iconid> "<text>"
# <iconid> is the TrafficEventInfos.csv column "Event Id/IconSetId".
# Please lookup the ids in Event TrafficEventInfos.csv (traffic icon resources).
#
# Example:
# [VICSIncidentText]
# incidenttextfile = ${main.path_share}na_onecore/resources/traffic/${streetview.resource_set}/texts/VICSIncidentText.ini

[DSSS]
# The [DSSS] section defines configuration values for warning functions
# DSSS function uses parameters,all the parameters are from "F-H06-01_Safe Driving Support System with communication_A-IVI.doc"

# DSSSManager judge DSSS function time interval: It's interval,when vehicle move from beacon area out position to target position ,DSSSManager need judge function  continuously
# Range of value : integer from 100 to 1000 in steps of 100.
# Default value : 100
# Unit : millisecond
# Note : Performance problems when set too low.
# DSSS_circleJudgeTimer = 100

# In the real environment, we can't accurate judgement vehicle whether out of scope
# (vehicle in scope: from area out position of IR beacon to intersection coordinates)
# When the distance from vehicle position to intersection coordinates is close to this threshold, DSSSManager suppose that vehicle was out of the scope.
# Range of value : floating from 0.0 to 10.0 in steps of 0.1
# Default value : 10.0
# Unit : meters
# Note : DSSSManager can't judgement vehicle out of scope when set too low.
# DSSS_areaOutMinDistanceThreshold = 10.0

# DSSSManager judge brake status variable. Due to DSSSManager can't get brake status,
# DSSSManager need calculate a percent of decelerate speed between speed of previous timing and speed of current timing.
# Range of value : integer from 0 to 100 in steps of 1
# Default value : 10
# Unit : %
# Note : A slight change of speed will lead to change brake status from off to on  when set too low.
# DSSS_decelerateSpeedThreshold = 10

# Driver response time in the DSSS function of Stop Sign missing avoidance
# Range of value : integer from 1 to 10 in steps of 1.
# Default value : 2
# Unit : second
# Note : If out of range,it may cause performance problems.
# stop_sign_driverResponseTime = 2

# Head unit process time in the DSSS function of Stop Sign missing avoidance
# Range of value : floating decimal from 0.5 to 10.0 in steps of 0.5.
# Default value : 2.0
# Unit : second
# Note : If out of range,it may cause performance problems.
# stop_sign_headUnitProcessTime = 2.0

# Vehicle deceleration in the DSSS function of Stop Sign missing avoidance
# Range of value : floating decimal from 0.05 to 0.8 in steps of 0.05.
# Default value : 0.4
# Unit : G
# Note : If out of range,it may cause performance problems.
#stop_sign_decelerateSpeedThreshold = 0.4


# Driver response time in the DSSS function of Crossing collision avoidance
# Range of value : integer from 1 to 10 in steps of 1.
# Default value : 4
# Unit : second
# Note : If out of range,it may cause performance problems.
#crossing_collision_driverResponseTime = 4

# Head unit process time in the DSSS function of Crossing collision avoidance
# Range of value : floating decimal from 0.5 to 10.0 in steps of 0.5.
# Default value : 2.0
# Unit : second
# Note : If out of range,it may cause performance problems.
# crossing_collision_headUnitProcessTime = 2.0

# Estimated arrival time difference in the DSSS function of Crossing collision avoidance
# Range of value : integer from -10 to 20 in steps of 1.
# Default value : 0
# Unit : second
# Note : If out of range,it may cause performance problems.
# crossing_collision_estimatesArriveTime = 0

# Time limit value in the DSSS function of Crossing collision avoidance
# Range of value : floating decimal from 1.0 to 10.0 in steps of 0.5.
# Default value : 5.0
# Unit : second
# Note : If out of range,it may cause performance problems.
# crossing_collision_limitTime = 5.0

# Deceleration decision value in the DSSS function of Crossing collision avoidance
# Range of value : integer from 5 to 35 in steps of 1.
# Default value : 10
# Unit : km/h
# Note : If out of range,it may cause performance problems.
# crossing_collision_decelerateSpeedJudgementThreshold = 10

# Low speed decision value in the DSSS function of Crossing collision avoidance
# Range of value : integer from 0 to 50 in steps of 1.
# Default value : 30
# Unit : km/h
# Note : If out of range,it may cause performance problems.
# crossing_collision_lowSpeedThreshold = 30


# Driver response time in the DSSS function of Traffic Signal missing avoidance
# Range of value : integer from 1 to 10 in steps of 1.
# Default value : 3
# Unit : second
# Note : If out of range,it may cause performance problems.
# traffic_signal_driverResponseTime = 3

# Head unit process time in the DSSS function of Traffic Signal missing avoidance
# Range of value : floating decimal from 0.5 to 10 in steps of 0.5.
# Default value : 3.0
# Unit : second
# Note : If out of range,it may cause performance problems.
# traffic_signal_headUnitProcessTime = 3.0

# Vehicle deceleration in the DSSS function of Traffic Signal missing avoidance
# Range of value : floating decimal from 0.05 to 0.8 in steps of 0.05.
# Default value : 0.4
# Unit : G
# Note : If out of range,it may cause performance problems.
# traffic_signal_decelerateSpeedThreshold = 0.4


# Driver response time in the DSSS function of Collision avoidance for vehicle stop signal
# Range of value : integer from 1 to 10 in steps of 1
# Default value : 3
# Unit : second
# Note : If out of range,it may cause performance problems.
# collision_traffic_signal_driverResponseTime = 3

# Head unit process time in the DSSS function of Collision avoidance for vehicle stop signal
# Range of value : floating decimal from 0.5 to 10 in steps of 0.5.
# Default value : 3.0
# Unit : second
# Note : If out of range,it may cause performance problems.
# collision_traffic_signal_headUnitProcessTime = 3.0

# Vehicle deceleration in the DSSS function of Collision avoidance for vehicle stop signal
# Range of value : floating decimal from 0.05 to 0.8 in steps of 0.05.
# Default value : 0.4
# Unit : G
# Note : If out of range,it may cause performance problems.
# collision_traffic_signal_decelerateSpeedThreshold = 0.4


# Velocity threshold in the DSSS function of Rear-end collision avoidance
# Range of value : integer from 0 to 30 in steps of 5.
# Default value : 0
# Unit : km/h
# Note : If out of range,it may cause performance problems.
# rear-end_speedThreshold = 0

# Deceleration threshold in the DSSS function of Rear-end collision avoidance
# Range of value : floating decimal from 0.05 to 0.8 in steps of 0.05.
# Default value : 0.05
# Unit : km/h
# Note : If out of range,it may cause performance problems.
# rear-end_decelerateSpeedJudgementThreshold = 0.05


[Warning]
# When vehicle drives into schoolzone, warning judge overspeed function continuously [ms]
# If SchoolZone_Overspeed_JudgeInterval is 0, warning not to judge the overspeed function
SchoolZone_Overspeed_JudgeInterval = 150
# Signal sent out second interval when car is overspeeding in the schoolzone.
SchoolZone_Overspeed_SignalInterval = 300
# ThresholdSpeed: School zone warning overspeed strategy, default value [km/h]
# FRC(Fuction road class) = [WEEKDAY,Day] [WEEKDAY,Night] [WEEKEND,Day] [WEEKEND,Night] [HOLIDAY,Day] [HOLIDAY,Night]
ThresholdSpeed_PREFECTURE = 90 500 90 500 90 500
ThresholdSpeed_MAIN       = 90 500 90 500 90 500
ThresholdSpeed_LOCAL_1    = 65 500 65 500 65 500
ThresholdSpeed_LOCAL_2    = 65 500 65 500 65 500
ThresholdSpeed_LOCAL_3    = 65 500 65 500 65 500
ThresholdSpeed_NARROW     = 50 500 50 500  50 500
ThresholdSpeed_OTHERS     = 500 500 500 500 500 500

# Combine two or more warnings if distance between them is less than given threshold distance.
# Two possible formats
# Format :  typeA, typeB,  thresholdDistanceMeter  // Create combined warning if B is close behind A.
# Format : {typeA, typeB}, thresholdDistanceMeter  // Set of combines: A,A,th and B,B,th and A,B,th and B,A.th
# Type value reference Warning.fidl
CloseToStrategy = {6,1001},20

# Remedy the lack of database.
# If the railwaycrossing type is unknown stored in database, we assume the worse, i.e. without gates.
hide_railway_crossing_unknown = true

# warning type => WARNINGTYPE_TOLLBOOTH
# Set the distance in meters for toll booths, depending on the administrativeRoadClass.
# most important:   1000m
# second important:  500m
# other:             300m
TollBooth_Warning_Distance = 1000 500 300

# warning type => WARNINGTYPE_TRAFFICCAMERA
# Set the distance in meters for TrafficCamera, depending on the motorway.
# highway:                  1000m
# normal way:               300m
TrafficCamera_Warning_Distance = 1000 300

# warning type => WARNINGTYPE_TRAFFIC_MESSAGE and WARNINGTYPE_TRAFFIC_FLOW
# Set the distance in meters for TrafficMessage and TrafficFlow, depending on the motorway.
# highway:                  10000m
# normal way:               5000m
Traffic_Warning_Distance = 10000 5000

# warning type => WARNINGTYPE_RECOMMEND_LANE
# Set the distance in meters for recommend lane of intersection point, depending on the motorway.
# highway:                  500m
# normal way:               300m
RecommendLane_Warning_Distance = 500 300

# warning type => WARNINGTYPE_SERVICE_AREA and WARNINGTYPE_PARKING_AREA
# Set the warning distance in meters for SAPA.
SAPA_Warning_Distance = 5000

# Timing of overspeed prompt sound
# The times (unit:seconds) given are <first prompt for simple & standard & detail mode> <cyclic re-prompt for standard mode> <cyclic re-prompt for detail mode>.
# The default setting is 5 30 15:
# If the vehicle overspeeds for 5 seconds, the first overspeed sound will be prompted. For simple mode, only prompt once.
# For standard mode, if the vehicle overspeeds continuously after the first prompt, the overspeed sound will be repeated every 30 seconds.
# For detail mode, if the vehicle overspeeds continuously after the first prompt, the overspeed sound will be repeated every 15 seconds.
Overspeed_Interval = 5 30 15

# path to the laser lua files
# Default value: ${main.path_share}na_onecore/resources/warning/${warning.resource_set}
laser_lua_path                       = ${main.path_share}na_onecore/resources/warning/${warning.resource_set}

[ImagePath]
iconPath                   = ${main.path_temp}

[imagecomposer]
# defined maximum image count for each image handle, default value is 3.
max_image_count = 3

# image composer max width of image, default is 64.
max_width = 64

# image composer max height of image, default is 64.
max_height = 64

# resources path
texture_path               = ${main.path_share}na_onecore/resources/guidanceviewer/${guidanceviewer.resource_set}/textures
shader_path                = ${main.path_share}na_onecore/resources/guidanceviewer/${guidanceviewer.resource_set}/shaders
font_path                  = ${main.path_share}na_onecore/resources/mapviewer/${mapviewer.resource_set}/fonts

# additional stroke of the standard (inner) font, in fraction of bitmap height. Applying a small stroke (i.e. make the
# glyphs more bold) can improve readability of small texts. Supported for free type font only.
# Default value: 0
freetype_base_stroke = 0.02

# stroke of the font outline, in fraction of bitmap height. Supported for free type font only.
# Typical imagecomposer texts, e.g. on road icons, will be rendered without outline anyway.
# Default value: 0.08
freetype_outline_stroke = 0.08

# A list of bit field constants for FT_Load_Glyph to indicate what kind of operations to perform during glyph loading.
# Please refer to FreeType's documentation  http://freetype.org/freetype2/docs/reference/ft2-glyph_retrieval.html#ft_load_glyph
# Possible values : uint32 value > 0, e.g. FT_LOAD_DEFAULT, FT_LOAD_RENDER, FT_LOAD_NO_HINTING, ... or 'FT_LOAD_DEFAULT | FT_LOAD_RENDER |FT_LOAD_NO_HINTING'
# Default value: 0
freetype_load_flags         = 0

# Size correction for texts on icons. FreeType rendering will scale the texts to precisely fit into the icons text area
# (as defined by the NDS database). But depending on the DB contents, this might be too close to the margins, so a slight
# downscaling of texts may look prettier.
# Default value: 1
font_scaling  = 0.95

# interval in ms for rendering a frame while in background mode
# setting to 0 disables background rendering completely
background_render_interval = 1000

[route]
# The basic speed for calculation or evaluation.
# It dependent on traffic services provided additional cost type,
# if additional cost type is DELAY_S then base speed is DB::averageSpeed,
# if additional cost type is SPEED_MS then base speed is traffic FreeFlowSpeed,
# Possible value: 0: DB::averageSpeed, 1: TrafficService::FreeFlow
# Default value: 1
BasicSpeedDataSource = 0

# This value is used to turn on/off U-turn.
# Possible value : true/false
# Default value: false.
# Note: true:  Under specific conditions, both direction link can U-turn.
#              (Specific conditions: without u-turn restriction && level-13 link && intersetion connects at last 3 road sections && frc:0,1,2,3)
#       false: The Default both direction link can not U-turn.
enable_uturn = false

# The format version of RouteProto requested by OC to OCServer.
# This configuration item is designed to address the compatibility of RouteProto format versions between OCServer and OC.
# After all projects have deployed a compatible version of OCServer, this configuration item will be deprecated.
# Possible value : >= 1000000
# Default value: 1010000.
#cur_sw_proto_format_ver = 1020000

# Name of a configuration file containing the route label strategies.
route_label_file = ${main.path_share}/na_onecore/resources/route/${route.resource_set}/route_label.ini

# It is an bit set of ignored LOS(Level of Service) types, it is use to reduce the traffic LOS data on route.
# Ignored LOS type define is corresponds to na::iface::mgr::com::neusoft::types::onecore::TrafficTypes::LOS.
# {
#   IGNORED_LOS_INVALID = 0x0,
#   IGNORED_LOS_UNKNOWN_TRAFFIC = 0x1,
#   IGNORED_LOS_FREE_TRAFFIC = 0x2,
#   IGNORED_LOS_HEAVY_TRAFFIC = 0x4,
#   IGNORED_LOS_SLOW_TRAFFIC = 0x8,
#   IGNORED_LOS_QUEUING_TRAFFIC = 0x10,
#   IGNORED_LOS_STATIONARY_TRAFFIC = 0x20,
#   IGNORED_LOS_NO_TRAFFIC = 0x40,
#   IGNORED_LOS_NOT_ASSIGNED = 0x80,
#   IGNORED_LOS_INCIDENT = 0x100,
# }
# Default value: 129 (IGNORED_LOS_UNKNOWN_TRAFFIC|IGNORED_LOS_NOT_ASSIGNED)
# Note: If it doesn't need to reduce the traffic LOS data then set ignored_los as 0(IGNORED_LOS_INVALID).
#ignored_los = 129

# This value is used to add extra per meter cost in unit millisecond for route calculation consider traffic LOS::E_QUEUING_TRAFFIC for avoid traffic congestion
# Possible value : traffic_congestion_cost_per_meter_level1 >= 0
# Default value: 200.
#traffic_congestion_cost_per_meter_level1 = 200

# This value is used to add extra per meter cost in unit millisecond for route calculation consider traffic LOS::E_STATIONARY_TRAFFIC and LOS::E_NO_TRAFFIC for avoid traffic congestion
# Possible value : traffic_congestion_cost_per_meter_level2 >= 0
# Default value: 400.
#traffic_congestion_cost_per_meter_level2 = 400

# This value is used to reduce additional cost of FRC 0 and FRC 1 road ,when there is traffic information.
# Possible value : traffic_additional_cost_factor_frc_0_1 >= 0
# Default value: 0.
# Note: If it doesn't need to reduce the traffic additional cost on toll road, it will be zero.
traffic_additional_cost_factor_frc_0_1 = 0

# This value is used to reduce additional cost When has traffic on FRC>1 road.
# Possible value : traffic_additional_cost_factor_normal >= 0
# Default value: 0
# Note: If it doesn't need to reduce the traffic additional cost on FRC>1 road, it will be zero.
traffic_additional_cost_factor_normal = 0

# The max length of the route result,unit is meter.
# Possible value: 1 to 42949672
# Default value: 42949672
# Note: When the route is longer than this value,the calculation fails.
max_route_length = 42949672

# link cost factor
# Reduce link cost proportionately.
# Only valid when calculating regular route.
# Possible value: 0.3~1.0
# Default value: 0.92 until we have the real parameters.
# Note: In order to take as many regular route as possible,
#       The linkcost of regular route will be reduced in proportion.
regularroute_linkcost_factor = 0.92

# trafficinfo cost factor
# Reduce trafficinfo cost proportionately.
# Only valid when calculating regular route
# Possible value: 0.3~1.0
# Default value: 0.5 until we have the real parameters.
# Note: In order to take as many regular route as possible,
#       The trafficinfo cost of regular route will be reduced in proportion.
regularroute_ticost_factor = 0.5

# regularroute percent
# Use the percentage of regular route provided by big data.
# Only valid when calculating regular route
# Possible value: 0.5~1.0
# Default value: 0.9 until we have the real parameters.
# Note: When the length of regular route included in the calculated route
#       reaches a certain proportion ( > regularroute_percent ),
#       The route is considered to be a regular route.
regularroute_percent = 0.9

# kml_output_control: switch to the route kml file output.
# Possible value: true or false.
# Default value: false.
# Note: When set to "true", output route kml file to special path, when set to "false", not output the file.
kml_output_control         = false

# kml_output_path: configuration for the route kml file output path, which will specify the path to store route kml file.
# Possible value: all value path for store files.
# Default value: /tmp.
# Note: only when kml_output_control as true, the kml_output_path will be used for get the route kml file.
kml_output_path            = ${main.path_temp}

# costmodel : configurable the route model when calculating route
# Possible value: 0(FAST), 1(SHORT), 2(ECO), 3(FASTEST).
# Default value: 0(FAST).
# Note: to set the cost model of route.
costmodel                  = 0

# name of a project specific variant of "fast(est)" costmodel data set:
# Default value is empty string = standard FAST (typically for TomTom and Here data)
# Supported values:
# = FAST_JPN (old Zenrin config for Nissan)
# = FAST_JPN2 (new Zenrin config for all other Japan projects)
# = FAST_OSM (for OpenStreetMap)
fast_costmodel_variant_name =

# Toggles if energy consumption calculation shall be done for ECOLOGICAL ROUTE only (default).
# If set to false, then this computation additionally will be done for FAST, SHORT etc. ROUTE as well.
# This saves some computing time.
# Default value: true
compute_consumption_for_eco_only = false

# Japan option: Ignore road attribute toll, just consider passed toll gates (default: false)
#toll_based_on_gates = true

# how to avoid carpool roads (depending on the HOV modeling in the database)
# 0: the NDS standard way: observe only PROHIBITED_PASSAGE
# 1: observe IS_COMPLETE_CARPOOL_ROAD, evaluating with all secondary attributes
# 2: observe IS_COMPLETE_CARPOOL_ROAD in any case (TomTom Workaround, also default)
carpool_mode = 2

# assumed number of passengers (incl. driver) when avoid/prefer CARPOOL is used
# HOV lanes are typically free for 2 or more passengers (sometimes 3 or more)
# Has no effect when carpool_mode = 2 is used.
# As enhanced TomTom workaround for carpool_mode = 1, the default values may be inverted to reflect the inverted representation in the database.
occupancy_allow_carpool    = 3    # default: 3
occupancy_prohibit_carpool = 1    # default: 1

# consider_recycle_route : switch of considering using a history routes or paths when recalculating
# Possible value: 0(history route never considered), 1(history route considered).
# Default value: 0(history route never considered).
# Note: none.
consider_recycle_route     = 1

# consider_traffic_info: switch to consider TI message when calculating route.
# Possible value: true or false.
# Default value: false.
# Note: this value will be set to consider TI message or not when calculating route.
consider_traffic_info      = true

# Maximum radius to consider traffic information (in km). Default: 200 km
#traffic_radius = 200

# Limit distance for off-road matching to road links. Default: 2,000,000 m = 2000 km
#max_offroad_distance_meter = 2000000

# Maximum length of clipped-off illegal on-road route parts (prohibited links or turns) at head or tail of the
# originally calculated route. Those illegal parts will be missing at start or end of the finally resulting route.
# When set to != 0, it may happen that the resulting route does not begin at start position, or does not
# reach the destination. This might confuse users, but is mandatory e.g. in Japan due to legal regulations.
# Unit : meter
# Default value: 10000, illegal links truncated when travelLength is smaller than 10km
# Possible value: 0, no illegal link truncated.
# Possible value: 16777215 (0xFFFFFF), all illegal links truncated

max_clip_illegal_length_meter = 0

# Allow to route across linkType SERVICE_ACCESS when combined with higher FRC
# Possible value: true or false.
# Default value: false.
# Note: Required in NTS/Japan to enable use of most SmartIC
#use_service_access = false

# Create descriptive name for alternative routes (ALTERNATIVE_VIA_NAMES element in RouteOverview)
# Considered only when at least 1 alternative route is requested.
# This requires some extra DB accesses and processing per alternative route, so it should only be activated in products
# where the HMI actually displays that data.
# Default: false
name_routes = true

# level_match_switch: configurable the path level.
# Possible value: 0 (no matching in routing), 1(matching level13 in routing itself),2(matching level13 in nds manager).
# Default value: 1(matching level13 in routing itself).
# Note: In future, level_match_switch is always 0, current is 1 for compitalbe system.
#       0: routing will only provide original path level;
#       1: routing will provide level13 path level and original(level13 also) path level;
#       2: routing will match level13 via nds manager, and the original level is not level13.Just for nds manager test;
#       So if 2, mapviewer and position maybe cannot work well.
level_match_switch         = 0

# consider_vehicle_parameter: switch whether consider consumption when routing.
# Possible value: true(consider the parameters of db and vehicle) or false(not consider any consumption parameters).
# Default value: true.
# Note: vehicle_parameter will not work if no consumption attrs in Db even if true set.
#    and only support gasoline energy(energy kind: gasoline/electric/other value e.g hybrid).
#    If the default value or energy kind changed, all vehicle parameters should be checked whether updated.
#    we had to convert the parameter unit to the one of gasoline.
consider_vehicle_parameter = true

# vehicle parameter: is drivetrain electric or combustion engine
# interprete Consumption Speed Curve values as [L/100Km] or [KWH/100Km]
# If changed then following also need an update: eff_* and csc array
# Default value: false
electric_drivetrain = true

# vehicle parameter: the gravity factor
# Possible value: 9.80665, other different values according to latitude
# Default value: 9.81 until we have the real parameters.
# Note: combined with consider_vehicle_parameter and other parameters.
gravity                    = 9.81

# vehicle parameter: the mass of a car
# Possible value: depends on the car or energy kind.
# Default value: test value 1300 until we have the real parameters.
# Note: combined with consider_vehicle_parameter and other parameters.
vehicle_mass               = 1300

# vehicle parameter: the efficiency of upslope/downslope [J/L or J/KWH]
# Possible value: depends on the car and energy kind.
#    energy_kind == gasoline: eff_up = 0,30*32000000 J/L, eff_down = 0,5*32000000 J/L.
#    energy_kind == electric: eff_up = 0,87*3600000 J/kWh, eff_down = 0,94 * 3600000 J/kWh.
# Default value: the values of gasoline
# Note: combined with consider_vehicle_parameter and other parameters. More vehicle-dependent, larger efficiency with smaller consumption.
eff_up                     = 3132000
eff_down                   = 3384000

# vehicle parameter: the efficiency of accelerate/decelerate [J/L or J/KWH]
# Possible value: depends on the car and energy kind.
# Default value: the same configuration values with upslope/downslope
# Note: combined with consider_vehicle_parameter and other parameters. More vehicle-dependent, larger efficiency with smaller consumption.
eff_acc                    = 3132000
eff_dec                    = 3384000

# vehicle parameter: transportation consumption for cartrain and ferry
# Possible value: 0 normally
#    The consumption calculation used 0 as consumption on transportation.
#    the router has virtual consumption(minimum of the CSC) to calculate the consumption.
# Default value: 0
# Note: combined with consider_vehicle_parameter and other parameters.
transportation             = 0

# vehicle parameter: the slopeWeight of every slope.
# Possible value: default was just 1.0 for every slope(the number of slope is 255).
# Default value: 1.0
# Note: There has been some extra penalty for excessive slope though in router.
slope_weight               = 1.0

# vehicle parameter: the tip speed of consumption
# Possible value: 255 km/h for normal driving (equals unbounded), 120 km/h
# Default value: 120
# Note: 120 km/h could make sense for eco mode though, to avoid high velocity (due to CSC) with much of a penalty for highways.
tip_speed                  = 120

# vehicle parameter: Consumption Speed Curve [L/100Km or KWH/100Km] is precondition for ECO route
# Possible value: depends on the car and energy kind.
# e.g.[speed-L/100Km]: [7.5-28.9][22.5-11.8][37.5-9.3][52.5-6.8][67.5-6.2][97.5-6.8][127.5-7.4][142.5-8.1][157.5-9.9]
# example for electric: in this case, the table is a mapping of speed -> kWh/100Km:
# e.g.[speed-kWh/100Km]: [0.5-100.0][7.5-26.0][22.5-13.0][37.5-12.0][52.5-9.7][67.5-11.2][97.5-16.4][127.5-22.7][142.5-26.7][157.5-31.1]
# Default value: none
# Note: no need for equal distant speed values, the values between are linear interpolated.
csc                        = 0.5
csc                       += 100.0
csc                       += 7.5
csc                       += 26.0
csc                       += 22.5
csc                       += 13.0
csc                       += 37.5
csc                       += 12.0
csc                       += 52.5
csc                       += 9.7
csc                       += 67.5
csc                       += 11.2
csc                       += 97.5
csc                       += 16.4
csc                       += 127.5
csc                       += 22.7
csc                       += 142.5
csc                       += 26.7
csc                       += 157.5
csc                       += 31.1

# max_num_route_search_worker: Some products will always calculate multiple different routes in initial route calculation (e.g. Fast, Short, Eco, No-Toll).
# We could probably gain some performance when we calculate them in parallel in 2 (or even more?) RouteSearch threads.
# Possible value: 0 < max_num_route_search_worker < 4.
# Default value: 2.
# Note: For values greater 1 this will require adaptions in the Controller, which must then start the calculations in parallel instead of one after the other.
#       It is also important that the most expensive route (No Toll) is started as 1st or 2nd job.
max_num_route_search_worker = 2

# Enable EnergyRangeManager(enable_energy_range_calculation) or not.
# Possible value: true or false.
# Default value: true.
enable_energy_range_calculation = true

# Sum up path lengths from evaluation start point on route and check if a threshold length is exceeded.
# * E.g. start evaluation on lowest available routing link level and then fall back to original level,
# * reducing processing time for oversized routes.
# Unit : km
# Default value: 500
# eva_original_level_threshold_length_km = 500


# Configuration settings for range calculation:
# how far can you get with your car with its available remaining energy (e.g. fossile fuel, electric, etc.)?
# 2 ranges are computed:
# * (optionally:) a safe range where you have some energy (for example 20%) left in the car
# * a maximum range where you have no energy (0%) left in the car
# See funit\route\doc\RangeCalculation.pptx for details.
# Note that all visualization configuration is done in mapviewer configuration sections, not this one:
[range-calc]
# If rangemap shall be clipped by land.geojson.
# Possible value: true or false
# Default value: true
# Note: true：RangeMap shall be clipped by land.geojson.
#       false：RangeMap shall not be clipped by land.geojson.
range_map_clip_enable = true

# Name of a Range Clipper Data.
range_land_file = ${main.path_share}/na_onecore/resources/route/${route.resource_set}/land.geojson

# The maximum energy which the battery or fuel tank of the car can maximally contain when 100% filled.
# This value is the de facto real-life possible maximal value,
# i.e., the one which the battery really physically can maximally contain in reality.
# It is not the nominal value, i.e., not the one which it could hold when it was brand-new.
# Valid values for this are >0.
# The special value 0.0 means "unknown".
# This is only a development switch. Normally, this value will be set by FIDL API com.neusoft.onecore.common.Energy
# Unit : kWh
# Default value: 0 kWh
# max_energy_kwh = 0

# Available total remaining energy available in the battery (or fuel tank) of the car in kWh.
# Valid range for this number is >=0 (a battery or fuel tank cannot hold a negative amount of energy).
# If this number is set to any negative value, the whole range calculation,
# and, as an implicit consequence, visualization etc., will be turned off.
# This is only a development switch. Normally, this value will be set by FIDL API com.neusoft.onecore.common.Energy
# Unit : kWh
# Default value: 40.0 kWh
remaining_energy_kwh = 0

# Electric power consumption of all other (non-motor) in-car devices in use.
# For example: air condition, radio, heating, etc.pp.
# (Opposed to that, use the separate function SetEcoConsumptionParameter to set the motor consumption.)
#    extra consumption = OtherDevicesPowerConsumption_kW * time span
# If this consumption is not known, choose a statistical somewhat realistic average value
# to correctly reflect that energy drain, for example 0.8 kW
# This value is only about real consumers, i.e., has to be >=0.
# We are not talking about recuperation, solar cells etc. here.
# This is only a development switch. Normally, this value will be set by FIDL API com.neusoft.onecore.common.Energy
# Unit : kW
# Default value: 0.8 kW
other_devices_power_consumption_kw = 0.8

# Distance by which CCP must move at least since last calculation to re-trigger range model calculation.
# This is a OneCore-internal development switch, this value later will be fed in via OC FIDL API.
# Note: If set to 0, then consumption re-calculation will be done time-dependent (if at least the car moves a little bit and we get messages from Positioning).
# Jumps caused by SetPostion (demo mode) will lead to immediate recalculation of the RangeModel.
# Unit : km
# Default value: 5.0 km
rangemodel_recalc_trigger_distance = 5.0

# For distance fraction related to max. expected distance with remaining energy by which CCP must change to re-trigger model calculation since last calculation, has to be feed later via IF Energy.fidl
# Default value: 0.0 km
# Note: If 0 then trigger_rangemodel_recalc_distance is used alone else the one which fires first.
# Jumps caused by SetPostion (demo mode) will lead to immediate re-calculation of the RangeModel.
trigger_rangemodel_recalc_fraction = 0.2

# Level expansion factor
# Increasing expansion limit for the different level
# Default value: 1.0
# e.g.[level factor]: 13 1.0
# Note: The order of levels is not specified, and it is unnecessary to define all levels.
#       For example, if only [9 2.0] is defined, only the expansion limit of level 9 will be increased.
#       The level smaller than the best level is valid.(see range_expansions_factor_bestlevel)
#       For example, if the best level is 7, then levels 13, 11, and 9 are valid.
range_expansions_factor_level     = 13 0.5
range_expansions_factor_level    += 11 0.5
range_expansions_factor_level    +=  9 10.0

# Level expansion factor for the best level
# Increasing expansion limit for the best level
# [best level]: It is not fixed. According to the estimated distance (m), determine which layer of the link will be used more when calculating the range.
#               The maximum best level is 7, because there is no expansion limit at Level 5.
# Default value: 3.0
# Note: When best level and range_expansions_factor_level are the same, only range_expansions_factor_bestlevel is valid.
#       For example, if the best level is 9, the expansion limit of level 9 will will adjusted based on the configuration items.
range_expansions_factor_bestlevel = 13.0

# Range contour calculation mode:
# 1 = Bubble View (Default)
# 2 = Sector View
view_mode = 1

# Portion of max available energy for the battery safe range (avoid low battery charge condition)
# If at CCP the remaining energy is smaller than the max energy portion then a safe range does not exist at all around CCP.
# Default: 0.8 (=80%, i.e. 20% of max_energy_kwh is the rest energy along the border of the safe range)
# Set to 0 when only one contour is desired
inner_range_factor = 0.8

# whether use inner_range_factor instead of max_range_factor and safe_range_factor
# Default: false
use_inner_range_factor = false

# Portion of remain available energy for max range area
# Default: 0.95 (=95%, i.e. 95% of remain available energy is the the border of max range area)
# Note: If use_inner_range_factor = false then max_range_factor is effective.
max_range_factor = 1.0

# Portion of remain available energy for safe range area
# Default: 0.7 (=70%, i.e. 70% of remain available energy is the the border of safe range area)
# Note: If use_inner_range_factor = false then safe_range_factor is effective.
safe_range_factor = 0.7

# Bubble View: number of horizontal + vertical grid lines
# Controls the detail level of the bubble contour(s)
# Default: 40
# Recommendable: 15 - 150
bubble_view_num_grid_lines = 61

# Bubble View: size of bubbles around inner nodes (estimated reachable radius)
# Default: 0.4
bubble_view_inner_extrapolation = 0.4

# Sector View: number of sectors per octant (= 1/8 of total sector amount)
# Default: 20
sector_view_num_sectors_per_octant = 20

# Sector View: number of sectors to spread data (see .pptx)
# Default: 8
# Set to 0 for a plain "cog wheel style" view
sector_view_spread_num = 8

# Sector View with "range spread" only: maximum reduction of radius for spread points (see .pptx)
# Default: 0.4
sector_view_spread_depth = 0.4

# The forbidden lane change distance at an intersection (cm)
# Possible value: 500 to 5000
# Default value: 3000.
# Note: In rare cases though, there is no prohibited lane change distance at an intersection
intersections_prohibited_distance_cm = 3000

# L1_lane_deviation_speed and L1_lane_basic_speed are the constants for the equation which is used to calculate a minimum distance for car to switch lanes at specific driving speeds.The equation is ((speed-L1_lane_deviation_speed)^2/100+L1_lane_basic_speed).
# The constant a and b in this equation are distance_a_to_switch_lanes_km and distance_b_to_switch_lanes_km respectively.
# For example，current speed is 60km/h ,param L1_lane_deviation_speed is -50,L1_lane_basic_speed is 20,L1 lane changing distance is ((60-50)^2/100+20) = 21m
# L1_lane_deviation_speed Possible value: 0 to -100
# Default value: -50
# L1_lane_basic_speed Possible value: 0 to 100
# Default value: 20
L1_lane_deviation_speed = -50
L1_lane_basic_speed = 20

[guidance]
# maneuver_calc_silent_maneuver: switch to consider/ignore silent maneuver in maneuver calculation, which was generated just for show the JV, no acoustical driving recommendation.
# Possible value: on or off.
# Default value: on.
# Note: When set to "on", generate silent maneuvers, when set to "off", don't generate silent maneuvers.
maneuver_calc_silent_maneuver      = off

# maneuver_calc_lanemerge_maneuver: switch to consider/ignore lane merge maneuver in maneuver calculation, which will generate maneuver at lane merge location.
# Possible value: on or off.
# Default value: on.
# Note: When set to "on", generate lane merge maneuvers, when set to "off", don't generate lane merge maneuvers.
maneuver_calc_lanemerge_maneuver   = off

# maneuver_calc_enter_motorway_maneuver: switch to create a enter motorway maneuver.
# Possible value: on or off.
# Default value: off.
# Note: When set to "on", generate creates an enter motorway maneuver, otherwise not.
maneuver_calc_enter_motorway_maneuver   = off

# maneuver_calc_enter_vignette_maneuver: switch to create a enter vignette maneuver.
# Possible value: on or off.
# Default value: off
# Note: When set to "on", generate an enter vignette maneuver, otherwise not.
maneuver_calc_enter_vignette_maneuver   = off

# maneuver_calc_enter_toll_maneuver: switch to create a enter toll maneuver.
# Possible value: on or off.
# Default value: on.
# Note: When set to "on", generate creates an enter toll maneuver, otherwise not.
maneuver_calc_enter_toll_maneuver       = off

# maneuver_recommend_lanes_at_toll_gate: switch to create lane recommendations at toll gates.
# Possible value: on or off.
# Default value: off
# Recommended value: on for Bosch, off for Delphi.
# Note: When set to "on", lanes will be recommended at toll gates.
# Which lanes are recommended (ETC or cash) depends on the value of the ETCInsertState.
maneuver_recommend_lanes_at_toll_gate    = off

# maneuver_calc_time_domain_maneuver: switch to create an enter time-domain maneuver.
# Possible value: on or off.
# Default value: on.
# Note: When set to "on", generate creates an enter time-domain maneuver, otherwise not.
maneuver_calc_time_domain_maneuver = on

# maneuver_calc_hov_maneuver: switch to create an enter/leave HOV maneuver.
# Possible value: on or off.
# Default value: off.
# Note: When set to "on", generate creates an enter/leave HOV maneuver, otherwise not.
maneuver_calc_hov_maneuver = off

# maneuver_calc_toll_booth_maneuver: switch to create a toll-booth maneuver.
# Possible value: on or off.
# Default value: on.
# Note: When set to "on", generate creates an toll-booth maneuver, otherwise not.
maneuver_calc_toll_booth_maneuver       = on

# maneuver_calc_border_maneuver_on_country_change: switch to create a border maneuver on country change.
# Possible value: on or off.
# Default value: off.
# Note: When set to "on", generate creates an border maneuver on country change, otherwise not.
maneuver_calc_border_maneuver_on_country_change = off

# maneuver_calc_border_maneuver_on_sub_country_change: switch to create a border maneuver on sub country change.
# Possible value: on or off.
# Default value: off.
# Note: When set to "on", generate creates a border maneuver on sub country change, otherwise not.
maneuver_calc_border_maneuver_on_sub_country_change = off

# consider_lane_status_merge: switch to consider/ignore lane status merging when lane recommendation.
# Possible value: on or off.
# Default value: off.
# Note: When set to "on", If a lane is close and then open at same side, then only show open lane.
consider_lane_status_merge = on

# maneuver_calc_tunnel_maneuver: switch to consider/ignore tunnel maneuver.
# Possible value: on or off.
# Default value: on.
# Note: When set to "on", warning for tunnel is considered.
maneuver_calc_tunnel_maneuver = off

# maneuver_calc_schoolzone_maneuver: switch to consider/ignore school zone maneuvers.
# Possible value: on or off.
# Default value: off.
# Note: When set to "on", warning for school zones are considered.
maneuver_calc_schoolzone_maneuver = off

# maneuver_calc_railway_crossing_maneuver: switch to consider/ignore railway crossing maneuver.
# Possible value: on or off.
# Default value: off.
# Note: When set to "on", warning for railway crossing is considered.
maneuver_calc_railway_crossing_maneuver = off

# maneuver_calc_sa_pa_maneuver: switch to consider/ignore SA/PA maneuver.
# Possible value: on or off.
# Default value: off.
# Note: When set to "on", SA/PA, service and parking maneuver is considered.
maneuver_calc_sa_pa_maneuver = off

# maneuver_calc_express_lane_maneuver: switch to create enter express lane or leave express lane maneuvers.
# Possible value: on or off.
# Default value: off.
# Note: When set to "on", generate an enter/leave express lane maneuvers,
# otherwise instead of an enter express lane maneuver generate a highway bifurcation maneuver.
maneuver_calc_express_lane_maneuver = off

# maneuver_calc_ferry_maneuver: switch to consider/ignore ferry maneuver.
# Possible value: on or off.
# Default value: on.
# Note: When set to "on", warning for ferry is considered.
maneuver_calc_ferry_maneuver = on

# continuous_lane_recommendations: deliver more lane recommendations for one maneuver
# Possible value: on or off.
# Default value: on.
# Note: When set to "off", only one lane recommendation for the maneuver point is delivered
continuous_lane_recommendations = off

# roundabout_lane_recommendations: deliver lane recommendations for roundabout maneuvers
# Possible value: on or off.
# Default value: on.
# Note: When set to "off", no lane recommendations for roundabout maneuvers will delivered
roundabout_lane_recommendations = off

# max_lane_connection_gap_link_num: the max link number that should be checked if a dest lane is on the current route.
# Possible value: 0 - max integer
# Default value: 20.
max_lane_connection_gap_link_num = 20

# A angle which is used to decide if create a maneuver.
# if the angle change between entry link and exit link is greater than this angle, then create a turn maneuver.
# Default value: 80 degrees.
create_maneuver_greater_than_angle = 80

# ignore_entry_only_roads: switch to consider/ignore entry only roads on roundabout and square.
# Possible value: on or off.
# Default value: on.
# Note: When set to "on", announcement as "leave the roundabout at 2rd exit", when set to "off", announcement as "leave the roundabout at 3rd street".
ignore_entry_only_roads = on

# seconds_for_lane_recommendation_ahead:  forecast seconds to calculate a distance with average speed to move location of lane guidance.
# Possible value: 0 - 600.
# Default value: 0.
# Note: When set to "0", not move lane recommendation ahead of time.
seconds_for_lane_recommendation_ahead = 0

# min_route_compare_time: value of the minimum time (minute) for route comparison, which will used to identify which route is better.
# Possible value: value lager than 5.
# Default value: 5.
# Note: Currently when new route's total time is less than 5 minute, use the new route as better route, more detail specification needed for route comparison
min_route_compare_time = 5

# min_route_compare_distance: value of the minimum distance (meter) for route comparison, which will used to identify which route is better.
# Possible value: value lager than 2000.
# Default value: 2000.
# Note: Currently the distance was not used in route comparison, more detail specification needed for route comparison.
min_route_compare_distance = 2000

# distance_to_endLink: value of the distance (meter) for destination side comparison, which will used to identify which destination side is better.
# Possible value: [0.0, 5.0].
# Default value: 3.0.
# Note: Currently when the distance from destination to the match link is smaller than distance_to_endLink, the destination is on the road.
distance_to_endLink = 3.0

# simulate_deviation: switch of simulate deviation, which will used to simulate deviation and trigger re-routing.
# Possible value: on or off.
# Default value: off.
# Note: Currently we use 0 as default value for deviation identification, it may be changed with Positioning's features.
simulate_deviation = off

# consider_deviation_in_park_mode: switch if considering deviation and trigger rerouting when the status in positioning result is related to park.
# Possible value: on or off.
# Default value: off.
# Note: when positioningresult::mode is carpark or parkingplace, and this value is on, consider deviation and trigger route-recalculation.
consider_deviation_in_park_mode = off

# consider_deviation_in_ferry_mode: switch if considering deviation and trigger rerouting when the status in positioning result is related to ferry.
# Possible value: on or off.
# Default value: off.
# Note: when positioningresult::mode is ferry or cartrain, and this value is on, consider deviation and trigger route-recalculation.
consider_deviation_in_ferry_mode = off

# make a special handle for a manuever after toll booth maneuver if the toll booth is combined with it.
# in order to avoid late guiding for the maneuver.
# when the approach(or action if there is no approach) phase of toll booth is passed, then trigger next maneuver.
handle_maneuver_after_toll_booth_specially = off

# kml_output_control: switch to the maneuver kml file output, which contain the maneuver information for the whole route.
# Possible value: on or off.
# Default value: off.
# Note: When set to "on", output maneuver kml file to special path, when set to "off", not output the file.
kml_output_control         = off

# kml_output_path: configuration for the maneuver kml file output path, which will specify the path to store maneuver kml file.
# Possible value: all value path for store files.
# Default value: ${main.path_temp}.
# Note: only when kml_output_control as true, the kml_output_path will be used for get the path to store maneuver kml files.
kml_output_path            = ${main.path_temp}

# use_text_out: configuration for route guidance whether using guidance text out.
# Possible value: On, Off.
# Default value: On. benifit for test.
# Note: this value will be set to enable guidance text out.
use_text_out                = on

# path to the laser lua files (lang_[...].lua
# Default value: ${main.path_share}na_onecore/resources/guidance/${guidance.resource_set}
laser_lua_path                       = ${main.path_share}na_onecore/resources/guidance/${guidance.resource_set}

# path to the additional data for the voice announcement generation
# For example, path to additional wavefiles and the phoneme mapping database
# For projects without additional data, the path remains empty.
# Default value: empty
voice_data_path =

# use phonemes from database for voice announcement generation.
# Default value: true
use_phonemes  = true

# use road number phonemes from database for voice announcement generation.
# The switch has only an effect if the use_phonemes switch is activated.
# Default value: true
use_phonemes_for_road_numbers  = true

# if true, it means that the phoneme stores the full name of the road
# if false, it means that the phoneme stores the tts string instead of the full name of the road
# Default value: false
use_phoneme_full_name = false

# Use a special packet format for phonemes of the following languages
special_phoneme_format_for_languages  = jpn

# indicate if send the broadcast when the waypoint is reached.
# Default value is true
send_waypoint_reached               = true

# min radius, that means if the distance between car and offroad position is less or equal it, then consider that offroad maneuver is reached.
# default value: 20 meters, unit is cm.
min_radius_reach_offroad            = 2000

# max radius, that means if the distance between car and offroad position is less or equal it,
# and car turn back, then consider that offroad maneuver is reached.
# default value: 100 meters, unit is cm.
max_radius_reach_offroad            = 10000

# use offroad announcement like 'Follow the arrow on the display' when car is offroad.
# on: use the announcement, off: disable the announcement.
# default value: off.
use_offroad_announcement            = off

# The distance is a range before enteroffroad point to check if waypoint is reached.
# on: the unit is meter.
# default value: 5m.
distance_to_check_waypoint          = 5

# The maneuver bounding rectangle border relative to main phrase distance.
# default value: 0.16.
maneuver_bounding_rectangle_border          = 0

# The maneuver bounding rectangle minimum radius relative to main phrase distance.
# default value: 0.33.
maneuver_bounding_rectangle_minimum_relative_radius          = 0.3

# The maneuver bounding rectangle center point is maneuver point or all relative links center.
# Default value: false
# Note: When set to "true", maneuver point is the bounding rectangle center.
maneuver_bounding_rectangle_center_maneuver_point          = true

# The action phase distance for waypoint and destination maneuver.
# default value: 20m
waypoint_action_phase_distance                             = 20

# The action phase distance for waypoint and destination maneuver in ferry.
# default value: 100m
ferry_waypoint_action_phase_distance                             = 100

# For multiple deviations, if the distance between them is greater than min_deviation_distance, rerouting still will be considered.
# Default value: 2000
# Unit is centimeter.
min_deviation_distance                                     = 2000

# For multiple deviations, if the time span between them is greater than min_deviation_time, rerouting still will be considered.
# Otherwise not trigger rerouting, the condition and 'min_deviation_distance' all must be matched.
# Default value: 1s
# Unit is second.
min_deviation_time                                         = 1

# The first maneuvers need to be calculated in the specified distance.
# This value is used to define the specified distance.
# Default value is 5km.
# Unit is centi-meters.
first_maneuver_calculation_distance                        = 500000

# At tile borders, TomTom databases sometimes contain small bends with a different angle
# than the rest of the link (see DEL-3772). This resulted in superfluous or wrong maneuvers (see DEL-5461).
# By setting this value, shape point parts at the end of links up to the given length are ignored when calculating angles.
# Default value is 0 cm = disabled
# Values between 300cm and 400cm provide best overall results. Higher values may have negative side effects.
# Unit is centi-meters.
# For TomTom databases only!
ignore_TomTom_shape_point_bends_shorter_than               = 300

#scripts = Latn # (Hans #Cyrl Grek Arab Jpan Latn) list of scripts that are covered by font (or acceptible otherwise)
#suppress_languages = deu_DEU-Latn

# If the roundabout circumference is greater than the max_small_roundabout_circumference value a normal roundabout maneuver is created.
# If the value is 0, than no small roundabout maneuver will be created.
# In a normal roundabout maneuver is the maneuver point in the roundabout. In small roundabouts it exists no space between two exits.
# Therefore, in small roundabouts the maneuver point is placed before the roundabout.
# Default value: 0
# Unit is meter.
max_small_roundabout_circumference                         = 142

# Split the one roundabout maneuver in a enter roundabout and a leave roundabout maneuver
# If the value is on, then a enter and a leave roundabout maneuvers are generated
# If the value is off, then only one roundabout maneuver is generated
# Default value: off
split_roundabout_maneuver_in_enter_and_leave               = off

# indicate if calling SetDemoRoute in StartGuidance and calling ClearDemoRoute in StopGuidance.
# due to positioning demo has already provided the api SetDemoRoute and ClearDemoRoute, then client can control it freely.
# and positioning demo should not depend on StartGuidance and StopGuidance in guidance.
# but in order to avoid existing function does not work, the default value is on.
call_positioning_demo_function                             = on

# road_nr_filter_rules a string with the sorting rule chars
# following rules are selected by one character
# 'D' - DisplayClass lower value of roadNumberDisplayClass numbers have a higher priority
# 'P' - Prefix, string comparison of prefix (Usually different prefixes should have different roadNumberDisplayClass)
# 'N' - Number value of infix, roads with lower road numbers are more important than roads with higher
# 'L' - string Length of infix
# 'I' - string comparison of Infix
# 'S' - Suffix string comparison of postfix / suffix
# The order of the chars determines the execution order of the rules.
# example "DPNLIS"
# see also ntswiki Maneuver_Calculation_Decisions#Priority_of_Road_Numbers
road_nr_sorting_rules_acoustical = DPNLIS
road_nr_sorting_rules_optical    = DPNLIS

# road_nr_filter_rules - The road number filter rules
# following rules are selected by one character
# 'D' - DisplayClass deliver the road numbers with the the lowest value of roadNumberDisplayClass
# 'S' - SriptCode, remove road numbers with other script codes
road_nr_filter_rules_acoustical = DS
road_nr_filter_rules_optical =

