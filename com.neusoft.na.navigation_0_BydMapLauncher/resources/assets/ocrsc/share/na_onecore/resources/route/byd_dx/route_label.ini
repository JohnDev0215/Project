[route]
# --------------------------------------------------- Route label strategies ---------------------------------------------------
# Compare between multiple routes, each one will have its unique characteristics, we refer to these characteristics as route labels.
# Each route label has its own strategy,
# which is a condition to consider when comparing multiple routes, the purpose of these conditions is to make the characteristics more prominent.
# In other words, if the characteristics of a this road are not prominent, we will not label it as such.

# ------------ Strategies of route label SHORT_TIME ------------
# Compare between the shortest time route and the route with the second shortest time route,
# the ratio of time differences between the two routes needs to reach a threshold.
# e.g. the time of the shortest route is 91s, the time of the second shortest route is 100s, the threshold is 10%.
# ratio of the time difference = 100 / 91 - 1 = 9.89% < 10% then no route can get the label.
# Possible value : 0.0~
# Default value: 10.0 (10.0%)
#route_label_short_time_diff_ratio_threshold = 10.0

# For some user, if the route time is already very short, such as 1 minute, they may not care whether the time is shorter.
# The time of the shortest time route needs to reach the threshold.
# Possible value : 0~3600
# Default value: 0
#route_label_short_time_route_time_second_threshold

# For some user, if the time difference between routes is already very short, such as 1 minute, they may not care whether the time is shorter.
# The time difference between the shortest time route and the second shortest time route needs to reach a threshold.
# Possible value : 0~
# recommended value: 60000~ (Usually, the route time is rounded to the nearest minute for display,
#                            if the time different less than 60 seconds, will display same time.
#                            Labeling a road with a shorter time can cause confusion when the display time is the same.)
# Default value: 60 (1 minute)
#route_label_short_time_diff_time_second_threshold = 60
# ------------ Strategies of route label SHORT_TIME ------------


# ------------ Strategies of route label SHORT_LENGTH ------------
# Compare between the shortest length route and the route with the second shortest length route,
# the ratio of length differences between the two routes needs to reach a threshold.
# Possible value : 0.0~
# Default value: 10.0 (10.0%)
#route_label_short_length_diff_ratio_threshold = 10.0

# For some user, if the route length is already very short, such as 100 metre, they may not care whether the length is shorter.
# The length of the shortest route needs to reach the threshold.
# Possible value : 0~
# Default value: 0
#route_label_short_length_route_length_cm_threshold

# For some user, if the length difference between routes is already very short, such as 100 metre, they may not care whether the length is shorter.
# The length difference between the shortest route and the second shortest route needs to reach a threshold.
# Possible value : 0~
# Default value: 0
#route_label_short_length_diff_length_cm_threshold
# ------------ Strategies of route label SHORT_LENGTH ------------


# ------------ strategies of SHORT_TIME OR SHORT_LENGTH ------------
# If one route got SHORT_TIME and SHORT_LENGTH labels.
# Compare between the ratio of the time difference and the ratio of length difference, keep the one with larger ratio,
# e.g. the route 1 is the shortest time route and shortest length route.
#      route 1 time is 90 second, the time of the second shortest route is 100 second, ratio of the time difference = 100 / 90 - 1 = 10%
#      route 1 length is 890 metre, the length of the second shortest route is 1000 metre, ratio of the length difference = 1000 / 890 - 1 = 12.4%
#      the ratio of the time difference is larger, so keep the SHORT_LENGTH.
# But if the ratios are same, keep the SHORT_TIME.
# e.g. route 1 time is 90 second, the time of the second shortest route is 100 second, ratio of the time difference = 100 / 90 - 1 = 10%
#      route 1 length is 900 metre, the length of the second shortest route is 1000 metre, ratio of the length difference = 1000 / 890 - 1 = 10%
#      ratio difference are same, so keep the SHORT_TIME.
# Default value: true
#route_label_short_time_or_short_length = true
# ------------ strategies of SHORT_TIME OR SHORT_LENGTH ------------


# ------------ Strategies of route label NONE_TRAFFIC_LIGHTS ------------
# ------------ Strategies of route label NONE_TRAFFIC_LIGHTS ------------


# ------------ Strategies of route label FEWER_TRAFFIC_LIGHTS ------------
# Compare between the route with the least number of traffic lights and the route with the second least number of traffic lights,
# the ratio of difference in the number of traffic lights on two routes needs to reach a threshold.
# Possible value : 0.0~
# Default value: 10.0 (10.0%)
#route_label_fewer_traffic_light_diff_ratio_threshold = 10.0

# Compare between the route with the least number of traffic lights and the route with the second least number of traffic lights,
# the difference in the number of traffic lights on two routes needs to reach a threshold.
# Possible value : 0~
# Default value: 0
#route_label_fewer_traffic_light_diff_number
# ------------ Strategies of route label FEWER_TRAFFIC_LIGHTS ------------

# ------------ Strategies of route label INCLUDING_MOTORWAYS ------------
# ------------ Strategies of route label INCLUDING_MOTORWAYS ------------


# ------------ Strategies of route label MORE_HIGH_LEVEL_ROAD ------------
# Route label MORE_HIGH_LEVEL_ROAD define high level road by functional road class for.
# Possible value : 0~7
# Default value: 0, 1
#Route_Label_more_high_level_road_FRC += 0
#Route_Label_more_high_level_road_FRC += 1

# Whether High level road need filter out motorways.
# Default value: true
#Route_Label_more_high_level_road_filter_out_motorways = true

# Whether High level road need filter out ferry.
# Default value: true
#Route_Label_more_high_level_road_filter_out_ferry = true

# The ratio of the length of high level road to the total length of the route needs to reach a threshold.
# Possible value : 0.0~
# Default value: 10.0 (10.0%)
#route_label_more_high_level_road_ratio_threshold = 10.0

# Compare between the longest road and the second longest road,
# the ratio of difference in length between high level road on two routes needs to reach a threshold.
# Possible value : 0.0~
# Default value: 10.0 (10.0%)
#route_label_more_high_level_road_diff_ratio_threshold = 10.0
# ------------ Strategies of route label MORE_HIGH_LEVEL_ROAD ------------


# ------------ Strategies of route label NO_TRAFFIC_CONGESTION ------------
# ------------ Strategies of route label NO_TRAFFIC_CONGESTION ------------


# ------------ Strategies of route label LONG_TIME ------------
# The ratio of time difference between the longest time route and the second longest time route needs to reach a threshold.
# Compare between the longest time route and the route with the second longest time route,
# Possible value : 0.0~
# Default value: 10.0 (10.0%)
#route_label_long_time_diff_ratio_threshold = 10.0

# The time of the longest time route needs to reach the threshold.
# Possible value : 0~
# Default value: 0
#route_label_long_time_time_second_threshold

# The time difference between the longest time route and the second longest time route needs to reach a threshold.
# Possible value : 0~
# Default value: 60 (1 minute)
#route_label_long_time_diff_time_second_threshold = 60
# ------------ Strategies of route label LONG_TIME ------------


# ------------ Strategies of route label LONG_LENGTH ------------
# Compare between the longest length route and the route with the second longest length route,
# the ratio of length differences between the two routes needs to reach a threshold.
# Possible value : 0.0~
# Default value: 10.0 (10.0%)
#route_label_long_length_diff_ratio_threshold = 10.0

# The length of the longest route needs to reach the threshold.
# Possible value : 0~
# Default value: 0
#route_label_long_length_route_length_cm_threshold

# The length difference between the longest route and the second longest route needs to reach a threshold.
# Possible value : 0~
# Default value: 0
#route_label_long_length_diff_length_cm_threshold
# ------------ Strategies of route label LONG_TIME ------------


# ------------ Strategies of route label LONG_TIME OR LONG_LENGTH ------------
# If one route got LONG_TIME and LONG_LENGTH labels.
# Compare between the ratio of the time difference and the ratio of length difference, keep the one with larger ratio,
# but if the ratios are same, keep the LONG_TIME.
# Default value: true
#route_label_long_time_or_long_length = true
# ------------ Strategies of route label LONG_TIME OR LONG_LENGTH ------------


# ------------ Strategies of route label MORE_TRAFFIC_LIGHTS ------------
# Compare between the route with the most number of traffic lights and the route with the second most number of traffic lights,
# the ratio of difference in the number of traffic lights on two routes needs to reach a threshold.
# Possible value : 0.0~
# Default value: 0.0
#route_label_more_traffic_light_diff_ratio_threshold

# Compare between the route with the route with the most number of traffic lights and the route with the second most number of traffic lights,
# the difference in the number of traffic lights on two routes needs to reach a threshold.
# Possible value : 0~
# Default value: 0
#route_label_more_traffic_light_diff_number_threshold
# ------------ Strategies of route label MORE_TRAFFIC_LIGHTS ------------


