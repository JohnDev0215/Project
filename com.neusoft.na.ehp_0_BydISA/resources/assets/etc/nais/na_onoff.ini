onoff.deploy                = ./etc/nais/na_onoff_deploy.json # startup deploy script

[main]
#WIN32:   AbortRetryIgnoreDialog = false
PrintVersion                     = true

[DLT]
PrintConfig                 = true
Application                 = ONOF                      # note that only 4 letters are possible, this explains the "typo"
AppDescription              = na_onoff
ECU                         = NAV

#WIN32:   Logger            = Server 3490 NO            # act as a DLT-Daemon
#WIN32:   Logger-IPC-Server = 3491                      # collect DLT from other processes like a DLT-daemon
#LINUX:   Logger            = daemon                    # write DLT container to running DLT-daemon, use logger=genivi to use dlt-library communication
Logger          = Client 127.0.0.1:4715 YES # connect to DltDroid
#APPLE:   Logger            = Server 3490 NO            # open a log server on localhost:4711, no storage header (added by TempoGiusto)

# log/context output: 0x01=DEBUG, 0x02=WARNING, 0x04=ERROR, 0x08=ASSERTION, 0x100=console, 0x400=dlt-daemon, 0x800=trace-devstudio
Output                      = 0x04ff
Context                    += .* 0x04ff

# Dump a call stack into the DLT log upon an assertion. Default value: false
# DumpCallStackOnAssertion = false

[interface]
dbus = true

# D-Bus (application) name: the name under which the application is visible on the bus. If set to empty string, no
# alias name is assigned to the application.
# Default: empty
dbus_name = com.neusoft.na_onoff

# D-Bus object path for the serv_ehp interfaces. (Default: "/")
dbus_object_path = /

# enable json interface
json = true

# JSON interface websocket port (default: 22529); set to 0 to disable websocket server functionality
json_port = 22533

# When reading this INI file, na_onoff will iterate over the sections named [processNN] in ascending order.
# It also tolerates gaps in that sequence, so you easily can simply comment-out a full section if you temporarily want to disable a process.
# Example process configuration:
#
# [process1]
# public shorthand process name (mandatory)
# name                      = na_serv_ehp
#
# path to process executable (mandatory)
# executable                = bin/na_serv_ehp
#
# process arguments (optional)
# args                      = --config=etc/nais/na_serv_ehp.ini
#
# if true, process will be started automatically when na_onoff itself starts;
# otherwise the process can be started by an explicit request to na_onoff asking for a start of it (default: false)
# autostart                 = true
#
# startup delay in ms if "autostart==true" (default: 0)
# pause                     = 0
#
# show the console window of the process (default: false)
# showconsole               = true

[process1]
name                        = na_serv_ehp
executable                  = bin/na_serv_ehp
args                        = --config=etc/nais/na_serv_ehp.ini
autostart                   = true
showconsole                 = true
pause                       = 0

[process2]
name                        = na_dbu
executable                  = bin/na_dbu
args                        = --config=etc/nais/na_dbu.ini
autostart                   = true
showconsole                 = true
pause                       = 0
