# configuration file for SDK
# todo

na_ehp_dbu.deploy  = /etc/nais/na_ehp_dbu_deploy.json
dbupdate.deploy = /etc/nais/na_dbu_deploy.json
onecloud_client.deploy = /etc/nais/na_onecloud_client_deploy.json
##LINUX:    nds.ndslib = ./libNdsLib.so

#------------------------------------------------------------------------------
[main]
#------------------------------------------------------------------------------

installPath                  ?= /tmp
backupPath                   ?= ${main.installPath}
resource_set                 ?= byd

#LINUX:    path_mapdata       ?= /mnt/
path_mapdata     ?= /isa/

path_share                   ?= ${main.installPath}/share/
path_temp                    ?= ${main.backupPath}/tmp/
path_cache                   ?= ${main.backupPath}/cache/
PersistencyPath              ?= ${main.backupPath}/neusoft/var/dynamic/
path_etc                     ?= ${main.installPath}/etc/

DeviceID                     ?= neu
CountryCode                  ?= neu
license_file_name            ?= ${main.path_mapdata}NeusoftISA/NSS_EHP.bin

database                     = ${main.path_mapdata}NeusoftISA/db/ROOT.NDS

dbuconfig = /etc/nais/na_dbu.ini
dbuconfig += /etc/nais/na_ehp_byd_dbu.ini

include   = na_common.ini

clconfig = /etc/nais/na_onecloud_client.ini.bin
clconfig += /etc/nais/na_ehp_dbu_onecloud.ini.bin

#LINUX:    clconfigExtern       = /mnt/na_ehp_dbu_onecloud.ini
clconfigExtern     = /sdcard/isaexternconfig/na_ehp_dbu_onecloud.ini

[nds]
database   = ${main.database}

[manager]
enable_EhpDBUgMgr         = true

[DLT]
TurnOnLog                  = true
PrintConfig                = true
Application                = NAED
AppDescription             = na_ehp_dbu
DebugAssertions            = none

#WIN32:    ECU              = WIN
#WIN32:    Logger           = IPC-Client 127.0.0.1:3491  # connect to an IPC-Server which will collect log data

ECU            = AND
Logger         = Client 127.0.0.1:4715 YES  # connect to DltDroid

#MAC:    ECU              = MAC
#MAC:    Logger           = Server 3490 NO             # open a log server on localhost:4711, no storage header (added by TempoGiusto)

#LINUX:    Logger           = Server 3490 NO                     # write DLT container to running DLT-daemon, use logger=genivi to use dlt-library communication

# log/context output:  0x01=DEBUG, 0x02=WARNING, 0x04=ERROR, 0x08=ASSERTION, 0x10=VERBOSE
#                     0x100=console, 0x400=dlt-daemon, 0x800=devstudio console
#WIN32:   Output           = 0x04ff
#ANDROID: Output         = 0x04ff
#APPLE:   Output           = 0x04ff
Output           = 0x04ff

# example: log all Contexts containing 'abcde' in name, output them to dlt-daemon
# Context                 += .*abcde.* 0x040f
# example: enable verbose logging for hugo message passing
# Context += na::iface::adaptor::hugo::CommunicationTask.* 0x041F

Context        += .* 0x40f

# Dump a call stack into the DLT log upon an assertion. Default value: false
DumpCallStackOnAssertion = false

# log queue buffer size, count of messages to be stored until logger is connected (used mainly at startup)
# Default value : 10000
Buffer = 10000

#------------------------------------------------------------------------------
[SDKBLDBU]
#------------------------------------------------------------------------------
#db path for navi
dbpath = ${main.path_mapdata}NeusoftISA/db
#dbpath = /home/fangf/temp/neusoft/db

#full update temp path
temp_install_dir = ${main.path_mapdata}NeusoftISA/temp_install_dir

#usb path for usb database. this used by android
externalpath = /isa

#dbu update result file path
result_file_path = ${main.path_mapdata}NeusoftISA

#db type (db section string for first 3 sections in db version name. such as: N.G.A5)
db_type_name = N.B3.A2

#online update check interval time
onlineUpdateIntervalInDay = 7
