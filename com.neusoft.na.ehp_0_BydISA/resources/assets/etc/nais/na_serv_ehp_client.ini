# Reference configuration file for na_serv_ehp_client

[na_serv_ehp_client]
# startup deploy script; there are two default scripts which can be used to either communicate with na_serv_ehp via D-Bus, JsonWs, or FCallCpp protocol.
#deploy      = ./etc/nais/na_serv_ehp_client_dbus_deploy.json
deploy      = ./etc/nais/na_serv_ehp_client_fcallcpp_deploy.json
#deploy      = ./etc/nais/na_serv_ehp_client_jsonws_deploy.json

# Using the following settings, na_serv_ehp_client can be made to load na_serv_ehp and start a new serv_ehp instance. In combination with the FCallCpp deployment, this
# enables and user of serv_ehp to use this library as a wrapper and load/unload serv_ehp at will.

# Start serv_ehp? Set this option to 'true' if you're using the FCallCpp backend (i.e. serv_ehp as shared library). If you use an external
# serv_ehp instance, set to 'false'. Default: false.
StartServEhp = false

# Location of na_serv_ehp shared library. OS specific search paths may apply. Default: empty.
#WIN32:   ServEhpSharedLib = .\bin\na_serv_ehp.dll
#LINUX:   ServEhpSharedLib = ./lib/libna_serv_ehp.so

# Configuration arguments for na_serv_ehp. Default: empty.
ServEhpArguments = --config=./etc/nais/na_serv_ehp.ini

[main]
AbortRetryIgnoreDialog     = false
PrintVersion               = true

[DLT]
PrintConfig                = true
Application                = OCCL
AppDescription             = na_serv_ehp_client

#WIN32:   ECU              = WIN
#WIN32:   Logger           = IPC-Client 127.0.0.1:3491   # connect to an IPC-Server which will collect log data
#LINUX:   Logger           = daemon                      # write DLT container to running DLT-daemon, use logger=genivi to use dlt-library communication

Output                     = 0x04ff

# example: log all Contexts containing 'abcde' in name, output them to dlt-daemon
# Context                 += .*abcde.* 0x040f
# example: enable verbose logging for hugo message passing
# Context += na::iface::adaptor::hugo::CommunicationTask.* 0x041F
Context       += .*debug    0
Context       += .*trace    0

# Dump a call stack into the DLT log upon an assertion. Default value: false
# DumpCallStackOnAssertion = false

[interface]
# enable jsonws interface
json = true
# disable websocket server functionality (ServEhp will be the server)
json_port = 0
# add remote URL for ServEhp, assuming it is run with default configuration on the same host
json_remotes = ws://127.0.0.1:22635
