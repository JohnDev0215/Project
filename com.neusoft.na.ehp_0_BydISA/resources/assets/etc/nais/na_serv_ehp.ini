# Reference configuration file for na_ehp_serv
#
# Externally changeable parameters:
#
#   main.path_share
#     The root path for all NAIS resource files, which are normally located in the "share/" directory.
#     Default value is the "$INSTALLATION_PATH/share/".
#     Example:
#        $ bin/na_serv_ehp --main.path_share=/path/to/resources/ --config=etc/nais/na_serv_ehp.ini

EhpService.deploy             = ./etc/nais/na_serv_ehp_deploy.json     # startup deploy script

[main]
AbortRetryIgnoreDialog     = false
PrintVersion               = true

# check for the existence of the NDS database root file during onecore startup phase
# Default         : false
# NOTE            : false if the existence of the database root file is ignored in onecore startup phase
#                   true  if the existence of the database root file is a prerequisite for onecore's managers startup.
#                   OneCore application will not start if this root file is missing or inaccessible.
#                   If there is no configuration of database in [nds] section, will be treated as no database
check_database_existance   = true

# persistency location. usually will be overwritten by a project-specific, well-known location. this one is just a generic default:
PersistencyPath            = ./var/nais/persistency/na_serv_ehp
#WIN32:   PersistencyPath  = .\var\nais\persistency\na_serv_ehp

# import database and localization configuration
include                    = na_common.ini

# startup delay in ms for some agents
# default is 1000
# first simple step to optimize the startup (target is "first map rendering ready" in shortest time)
# delay for all in list
startup_delay = 1000
# delay for a specific agent (prio first specific then global)
# startup_delay_TollManager             = 1000

[nds]
# MapProvider
#provider_Unknown = 0
#provider_AND = 1
#provider_AutoNavi = 2
#provider_HERE = 3
#provider_Hyundai = 4
#provider_Navinfo = 5
#provider_TomTom = 6
#provider_Zenrin = 7
#provider_EMG = 8
provider = 8

# enable or disable interfaces
[interface]

# enable D-Bus interface
dbus = false

# D-Bus (application) name: the name under which the application is visible on the bus. If set to empty string, no
# alias name is assigned to the application.
# Default: empty
dbus_name = com.neusoft.na_serv_ehp

# D-Bus object path for the onecore interfaces. (Default: "/")
dbus_object_path = /

# pick the remote application to provide the server for the onlineservices facades via D-Bus
#dbus_facade_LocationSearch_target            = com.neusoft.na_telematics

# enable cpp interface
cpp = false

# enable json interface
json = false

# JSON interface websocket port (default: 22635); set to 0 to disable websocket server functionality
json_port = 22635

# List of external servers to connect to. Each list entry must contain a valid URL including scheme, host address, and port.
# Default: empty, so no connection to external server is established.
json_remotes  = ws://127.0.0.1:22530 # connect to a Telematics instance, for example OneCloudClient

# pick the remote component to provide the server for the onlineservices facades via JsonWs
json_facade_HybridDbProvider_target            = OneCloudClient
json_facade_OnlineUser_target                  = OneCloudClient
json_facade_Utility_target                     = OneCloudClient
json_facade_DbUpdate_target                    = OneCloudClient

# enable jni interface
jni  = false

[manager]
# per default, external render window should be used, so it must be accessible via FCallCpp:
#enable_FCallCppFacadeRenderWindow        = ${interface.cpp}

#enable_FCallCppFacadeTtsEngine           = ${interface.cpp}
#enable_FCallCppFacadePersistenceStandard = ${interface.cpp}
#enable_FCallCppFacadePersistenceUser     = ${interface.cpp}

enable_JsonWsFacadeHybridDbProvider             = true
enable_JsonWsFacadeOnlineUser                   = true
enable_JsonWsFacadeUtility                      = true
enable_JsonWsFacadeDbUpdate                     = true
enable_JsonWsFacadeConfigProvider               = true

enable_MemTrackerManagerImpl                    = false
enable_MemoryStatMgrImpl                        = false
enable_CPUTrackerManagerImpl                    = false

[DLT]
PrintConfig                = true                        # force printout of configuration strings
Application                = EHP                         # set the DLT logging Application ID (default = CORE)
AppDescription             = na_ehp
ECU                        = NAV

#WIN32:   Logger           = IPC-Client 127.0.0.1:3490  # connect to an IPC-Server which will collect log data
#LINUX:   Logger           = daemon                     # write DLT container to running DLT-daemon, use logger=genivi to use dlt-library communication
Logger         = Client 127.0.0.1:4715 YES   # connect to DltDroid
#APPLE:   Logger           = Server 3490 NO             # open a log server on localhost:4711, no storage header (added by TempoGiusto)

# log/context output:  0x01=DEBUG, 0x02=WARNING, 0x04=ERROR, 0x08=ASSERTION, 0x10=VERBOSE
#                     0x100=console, 0x400=dlt-daemon, 0x800=devstudio console
Output                     = 0x04ff

# example: log all Contexts containing 'abcde' in name, output them to dlt-daemon
# Context                 += .*abcde.* 0x040f
# example: enable verbose logging for message passing of interface "xyz":
# Context += na::iface::adaptor::xyz::CommunicationTask.* 0x041F
Context       += .*NdsLib                    0x40e
Context       += .*SocketServer.*            0x40f
Context       += .*SocketClient.*            0x40f
Context       += .*ositioning.*              0x40f
Context       += .*LocalMapImpl              0x40f
Context       += .*PositioningWorker::Result 0       # explicit disable
Context       += .*MapMatch::Link            0
Context       += .*MapMatch::TraceMatchMode  0
Context       += .*debug                     0
Context       += .*trace                     0

# Context      += na::base::cpu::CPUMon.*                             0x4FF
# Context      += na::base::mem::MallocInfo.*                         0x4FF
# Context      += na::mgr::system::memstat:MemoryStatMgrImpl.*        0x4FF

# enable verbose logging for JSON message passing
Context       += na::iface::adaptor::jsonws::JsonWsCommunicationTask::msg 0x04FF

# Dump a call stack into the DLT log upon an assertion. Default value: false
# DumpCallStackOnAssertion = false

[MPD]
MpdConsumerPort = 32099 # enable IPC access as MPD consumer on this port

[memory]
# set to true to cyclically dump memory allocation info
monitor = true
# cycle time in milliseconds
period  = 10000
# Output data to console as well?
console = false

[location]
# update interval for WhereAmI feature
# Possible values : it must be greater than 0
# Default value : 3
# Note : the unit is seconds
where_am_i_interval_sec = 1

# current position urId feature
# Possible values : provider urId after receiving the gnss location.
# Negative value : testing DB upgrades in a laboratory environment
where_am_i_Gnss_UrId = ON

[Positioning]
