origin                        = default   # [default|alternative] enable the positioning origin at startup
physical_manager_instance     = false     # instantiate a real positioning manager in a system without na_pos executable
initial_position_prefix       = HAMBURG_
demo_mode_speed               = 10        # relative speed factor 1=realtime, 10=realtime * 10. Allowed range is 1..60
demo_route_auto_clear         = false     # would clear demo route if disable demo mode via PositionDemoControl::Enable(false)
adapt_heading_angle_threshold = 0         # lock map matched angle against dead reckoning angle, minimum deviation before using dead reckoning heading
adapt_heading_speed_threshold = 500       # speed above map matched heading preferred above dead reckoning heading
localmap_port                 = 32646     # enable local map server on this port
host                          = 127.0.0.1
port                          = 32644

mainpos_heading_threshold     = 45        # max. angle diff for route-matched position to be preferred against Positioning result
mainpos_quality_threshold     = 50        # min. match quality for route-matched position to be preferred against Positioning result

wwdd                          = false     # enable WrongWayDrivingDetection (Onecore Positioning implementation)
wwdd_ext                      = false     # enable WrongWayDrivingDetection according to dedicated customer spec

adas_use_demo_mode            = false     # testing feature: if set to true, then DemoMode positions will be used for ADAS
