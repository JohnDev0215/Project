[hybridservice]
# Defines the service strategy that can be used by onecore to provide services after database synchronization between local and cloud
# Service strategy is which service level
#   - for DB providers         : INdsDb for local NDS Database or Hybrid Online Database(HOD) or IHybridNdsDb for fresh Hybrid Online Database
#   - for interface providers  : local interfaces or remote interfaces( aka. onlineservices )
# OneCore managers can utilize to provide their functionality
# Possible Values:
#   local_hybrid :
#       - for DB providers         : indicate managers in OneCore use interfaces with data from local NDS Database or Hybrid Online Database(HOD) via INdsDb.
#                                    for details, refer to "[nds]->use_hybrid_db_service"
#       - for interface providers  : indicate managers in OneCore use local interfaces or remote interfaces
#   fresh_hybrid  :
#       - for DB providers         : indicate managers in OneCore use IHybridNdsDb and INdsDb to fetch nds data respectively.
#                                    Prefer to use IHybridNdsDb for latest database data when remote database is newer than local.
#       - for interface providers  : indicate managers in OneCore use local interfaces or remote interfaces according to decision_table
#   online       : (TBD)
#       - for DB providers         : indicate managers in OneCore only use online database.
#       - for interface providers  : indicate managers in OneCore only use online interfaces.
# Default Value: local_hybrid
service_mode = fresh_hybrid

# Name of configuration file containing a decision table for choosing service level according to conditions.
# The decision table is used to indicate which servicelevel component features are supposed to use in a specific functionality on specific conditions
# There are two kinds of service level
#    - DBServiceLevel       : details reference ServiceLevelType in ServiceLevelTypes.fidl
#        Possible Values: local_hybrid,fresh_hybrid,autonomous
#    - ProviderServiceLevel : details reference ServiceLevelType in ServiceLevelTypes.fidl
#        Possible Values: remote,local,autonomous
# Possible values: path to readable configuration file with servicelevel decision table
# default value: ${main.path_share}na_serv_ehp/resources/nds/${nds.resource_set}/decisiontable/ServiceLevel_config.xml
decision_table = ${main.path_share}na_serv_ehp/resources/nds/${nds.resource_set}/decisiontable/ServiceLevel_config.xml

# enable or disable the <default> config in decision table
# Default Value: true
default_config = true

# cycle time in milliseconds to trigger decision engine to make servicelevel decision,
# Default Value: 100
decision_period = 100

# duration time in milliseconds to judge online connection status as consistent and steady
# when OnlineConnection status toggle and keep a continuous time Tc, we say online connection status is steady
# Only steady status is valid for updating servicelevel according to 'decision_table'.
#           |--------------------------|          |--------------------------|
# __________|            Tc            |____Tu____|           Tc             |__________
#
# Default Value: 3000
online_connection_duration = 3000

# duration time in milliseconds to judge remote data validity as consistent and steady
# Default Value: 3000
remotedata_validity_duration = 3000

# Toggle test mode. When running in testmode:
#  1. StrippedDBSyncStatus will be set to FRESH_REMOTE after SimStrippedDBSyncStatus milliseconds
#  2. RemoteDataStatus will be set to REMOTEDATA_OK after SimRemoteDataStatus milliseconds
#  3. OnlineConnectionStatus will be set to true after SimOnlineConnection milliseconds
#  4. ActiveRouteStatus will be set to ROUTE_CALCULATOR_CLOUD when active route exist
# NOTE: the real status of StrippedDBSyncStatus,RemoteDataStatus and ActiveRouteStatus is discarded.
# Default Value: false
test_mode = false

# delay time of simulating StrippedDBSyncStatus in milliseconds
# Default Value: 5000
sim_strippeddb_sync = 5000

# delay time of simulating RemoteDataStatus in milliseconds
# Default Value: 5000
sim_remote_data = 5000

# delay time of simulating OnlineConnection in milliseconds
# Default Value: 5000
sim_online_connection = 5000

# true-use simulated status,false-use real status
sim_active_route = false

[mapviewer]

# below this scale denominator value, the camera scale is set up relative to the display centers latitude (i.e. precise scale at that point)
# default value: "0" = always use precise scale in focus
# recommended value: 5000000 (=1:5,000,000 = "50 km", i.e. medium to most detailed scales)
# max_scale_for_focus_latitude = 5000000

# above this scale denominator value, the camera scale is set up relative to a fixed latitude of 45 degree (avoiding impression of scale change when scrolling N-S direction)
# default value: 50000000 (=1:50,000,000 = "500 km", i.e. global overview scales) (but when max_scale_for_focus_latitude is 0=default, that setting will always be active, and this value is ignored)
# for scales between max_scale_for_focus_latitude and min_scale_for_fixed_latitude, the reference latitude is interpolated between "fixed" and "focus"
# min_scale_for_fixed_latitude = 50000000

texture_path               = ${main.path_share}na_serv_ehp/resources/mapviewer/${mapviewer.resource_set}/textures

[traffic]
# For testing only: If trafficdatafile is specified (file must exist and be readable) and it contains
# traffic data, it is read and processed automatically at startup. Only one file can be specified!
# When no path is given the feature is disabled
# Possible values: path to readable file with any of the supported data formats (tpeg binary, INRIX, ...)
# Default value: empty path
# trafficdatafile             = ${main.path_share}na_serv_ehp/resources/tpeg/Hamburg.tpeg

# Set a radius in km around the car position. A traffic incident or a flow section is marked as "filtered" (and thus hidden), if it is completely outside this radius.
# Possible values: 0 - 10000, 0 means, the filter is disabled
# Default value: 0
# If not set or invalid, the filter is disabled
# filter_radius_km = 200

# Name of a configuration file containing a TrafficLtnSelection.position_ltn table (see traffic.position_ltn).
# The only difference to direct configuration of traffic.position_ltn in the INI is that contents of the file gets loaded on demand, which improves the application startup time.
# When no path is given, the traffic.position_ltn table in this standard config (loaded at application startup) is used (see traffic.position_ltn below).
# Possible values: path to readable configuration file with TrafficLtnSelection.position_ltn table
# Default value: empty path
position_ltn_file = ${main.path_share}na_serv_ehp/resources/traffic/${traffic.resource_set}/TrafficLtnSelection.ini

# Name of configuration file containing a tmc_event_text.text table,which stores the relationship between TMC event code and flag of Roadbook pronunciation
# default value: empty path
tmc_event_text_res_file = ${main.path_share}na_serv_ehp/resources/traffic/${traffic.resource_set}/texts/tmc_event_text.ini

# Table containing rectangles covering the TMC TLTs in the USA. The table is used to select TLTs for the SDARS-tuner in the USA.
# Possible values: TLT + a set of geo rectangles or empty
# Default value: an empty table
# If not set, TLT selection is disabled. Depending on the SDARS tuner it will either forward no traffic data at all or select random TLTs.
# A geo position is described by WGS84 coordinates, first the longitude (lon) then the latitude (lat)
# A rectangle consists of a south-west geo position and a north-east geo position
# A TLT is identified by ecc/cc/ltn
# Format: position_ltn += <ecc>/<cc>/<ltn> rect1.sw.lon rect1.sw.lat rect1.ne.lon rect1.ne.lat rect2.sw.lon... rect<n>.ne.lat
# Example:
# position_ltn +=  160/1/1 -88.242188 30.585938 -80.507813 34.804688
# A full table is available in file res/traffic/nais/TrafficLtnSelection.ini
# If necessary it can be copied and modified for project needs.
# It is *strongly* recommended to use traffic.position_ltn_file instead.

# configure the cost calculation (w/o lvl 13)
# possible values: true (use the accurate cost calculation using level 13), false (use less acurate but faster cost calculation w/o level 13)
# Default: false
high_precision_costcalc = false

# Time limit for processing (resolving) incoming traffic data.
# Processing incoming traffic data will be interrupted every resolve_time_limit milliseconds to allow route calc and other
# clients to access traffic data (they would have to wait until all input has been processed).
# This allows to tune the performance to give acceptable low latency together with fewest possible update notifications.
# Possible values: uint32 = 0 or uint32 >= 100
# Default value: 0
# Unit: milliseconds
# Values = 0 means disable resolve time limit.
# 0 < Values < 100 ms will be set to 100ms. Recommended range is 700..3000 (estimated, no real life experience).
# low values will especially reduce route calc latency, but *considerably* slow down input processing and increase system load.
# high values will make input processing more efficient, but increase route calc latency.
# resolve_time_limit = 0

# Time delay between resolve each message.
# Special method for lower CPU usage
# The bigger value, the slower resolving, the lower CPU usage
# WARNING: A non-zero value will slows TPEG protocol resolve
# Possible values: uint32 >= 0
# Default value: 0
# Unit: milliseconds
# Values = 0 means do not delay between resolve each message.
# tpeg_resolve_time_delay = 0

# select the strategy to handle different traffic datasources
# possible values:                           Explanation:
#   NoOpTrafficDataSourceCtrl                  Doesn't activate any datasource (for tests or if you don't want to see any traffic data while still handling the messages)
#   ActivateAllTrafficDataSourceCtrl           Activates all datasources received
#   SimpleTrafficDataSourceCtrl                Activates the datasource received last, deactivates all other
#   TakeMostActiveTrafficDataSourceCtrl        Activates the most active datasource, deactivate all others. The number of messages and the last reception time are used to determine the most active datasource.
#   ActAllDoubleMsgSupTrafficDataSourceCtrl    Activates all datasources received, suppresses double messages
#                                              This is currently the only strategy suitable for vics!
# default value:
#   TakeMostActiveTrafficDataSourceCtrl
# example:
# trafficDataSourceStrategy = TakeMostActiveTrafficDataSourceCtrl

# Interval time between tiles for line resolver
# The bigger value, the slower resolving, the lower CPU usage
# WARNING: A non-zero value will slows mapviewer display of traffic
# A recommended value for Proton is 128
# Possible values: uint32
# Default value: 0
# Unit: milliseconds
line_resolve_tiles_interval = 128

# Interval time between tiles for cost resolver
# The bigger value, the slower resolving, the lower CPU usage
# WARNING: A non-zero value will slows routing with traffic
# A recommended value for Proton is 64
# Possible values: uint32
# Default value: 0
# Unit: milliseconds
cost_resolve_tiles_interval = 64

# Whether to redirect TPEG protocol-level resolve TRACK log into files
# Possible values: true (Redirect into files), false (NOT redirect into files)
# Default: false
is_tpeg_resolve_log_file_avail = true

# Whether use distance between location start and link start as tmcstart in NDS DB
# see https://jira.nts.neusoft.local/browse/OC-22778
# Possible values: true (use distance between location start and link start as tmcstart in NDS DB),
# false (use standard NDS tmcstart definition in NDS DB)
# Default: false
use_distance_between_location_start_and_link_start_as_tmcstart_in_nds_db = true

# How to fill the not assigned links/lines with default free LOS
# This value is the range size to be filled.
# It is recommended not to set this value beyond the radius_km within traffic provider section, like inrix/tomtom/here.
# Default: 0 means that do NOT fill the not assigned lines/links.
# radius_km_with_default_free_los = 0

# Maximum FRC of lines/links which will be covered with default free LOS
# This value is only available if radius_km_with_default_free_los != 0.
# Default: 5 means that the not assigned lines/links with FRC [1, 5] will be covered by default free LOS.
# max_frc_with_default_free_los = 5

file_storage_path = ${main.path_mapdata}NeusoftISA/traffic/
data_file_name = HEREDATA.tpeg
auth_file_name = HEREAuth.xml

