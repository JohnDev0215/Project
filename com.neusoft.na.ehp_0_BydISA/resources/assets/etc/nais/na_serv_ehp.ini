#Adas specific settings
[AdasManager]

# If the count of registered trees reaches this value,
# the request for register tree will not be processed, and an error will be returned
# DefaultValue in code: 8
AdasRegisteredTree_maximumCount = 8

# Ways to provide first append result when tree is changed from the root link
# ValueRange: 0 .. 2
# 0 : start a new tree, from = 0x0, to = the first changed link
# 1 : avoid starting a new tree by from = to = the first changed link
# 2 : avoid starting a new tree by from = the first changed link, to = next
# DefaultValue in code: 2
AdasTree_AppendOperationType = 1

# MPP position preference threshold
# If set, ADAS internal position will stay on MPP until
#    <mpp position quality> * AdasMppPositionFactor < <best position quality>
# Value <= 1.0 will disable the MPP preference code
# Default value: 0.0
# AdasMppPositionFactor = 1.1

#----Adasis settings

# Publish Adasis stream to CAN bus
Adasis_Enabled = ON

# ON: send ProtoLog to dlt using DefaultProtoLog
# Default: OFF
Adasis_DefaultProtoLog = ON

# ADASIS operation mode at startup
# ON : start creating a horizon immediately
# OFF: wait for external signal before creating the horizon
# Default: ON
Adasis_Active_At_Startup = OFF

# ADASIS operation in case of inactive
# ON : send default POSITION and META DATA message.
# OFF: send nothing.
# Default: ON
Adasis_Send_Default_In_Inactive = ON

# Provide long-range Horizon
Adasis_LongRange = OFF

# Level of service which can be provided
# ValueRange: 1 .. 5
# 1 for ADASIS Mini
# 2 for Main Path Only
# 3 for Main Path with Stubs
# 4 for Main Path with first level Sub-paths
# 5 for Full Horizon
# DefaultValue: 3 (Main Path with Stubs)
Adasis_Level_of_Service = 4

# Kill tree when mpp frequently switch like parent inside the trailing length
Adasis_KillTreeOnFreqMppSwitch = OFF

# Send ADASIS Mini segment message
# Note: Will be forced on in ADASIS Mini mode (see Adasis_Level_of_Service)
# Default: ON
AdasisMini_Message = OFF

# Maximum Offset Range
# Allowed number range to define an offset value in each CAN message
# ValueRange: 0 .. 8190 in [m]
# DefaultValue: 8190 in [m]
Adasis_Maximum_Offset_Range = 5000

# Maximum Length of Transmitted Path
# Never transmit information farther away from
# the current vehicle position than "maximum length of transmitted path".
# ValueRange: 0 .. 8190 in [m]
# DefaultValue: 6000 in [m]
Adasis_Maximum_Length_of_Transmitted_Path = 2000

# Length of tree kept behind the current position
# Note: This definition is a system definition and must be
#       identical for all clients on ADASISv2 bus
# ValueRange: 0 .. 600 in [m]
# DefaultValue: 600 in [m]
Adasis_Trailing_Length = 100

# Limit the number of active path index values to half of available range
# In adasis protocol, there are 56 path index can be used.
# Use a fixed number of path index values at each time for the current MPP.
# If a new MPP has to be created, the remaining path index values to be used.
# For differentiate MPP, The number must be <= 28 and >= 2
# For transmitted a relatively complete MPP, The number should be >= 20
# DefaultValue: 28
Adasis_Default_Path_Index_Amount = 28

# If the vehicle has driven a distance larger than "Adasis_Max_Offroad_Dist" in "off-road" status
# ADAS horizon provider (OneCore) will delete current MPP, and notify ADAS Reconstructor by "KillTree"
# ADAS horizon provider (OneCore) will send a unknown META-DATA message to ADAS Reconstructor
# ValueRange: 0 .. 8190 in [m]
# DefaultValue: 200 [m]
Adasis_Max_Offroad_Dist = 200

# On new tree the ADASIS specification request to start at a small offset
# so vehicle may move backwards without causing another tree reset.
# ValueRange: 0 .. 100 [m]
# DefaultValue: 50 [m]
Adasis_Initial_PathOffset = 50

# ADAS horizon provider (OneCore) have to keep in sync with ADAS Reconstructor
# The number of position messages we need to wait between the moment a pathindex
# is made inactive by implicitly removing the path in the horizon trail and the
# moment this pathindex is used again for a new path.
# DefaultValue: 2
Adasis_Inactive_PathIndex_PosCount = 2

# Valid data may not be visible for client due to
#  Adasis_Maximum_Length_of_Transmitted_Path and Adasis_Trailing_Length
# settings above.
# If set the current value will be repeated at least at given distance
# ValueRange: 0 .. 8190 in [m]
# DefaultValue: 0 (== off)
Adasis_Maximum_Message_Scope = 0

# If route guidance switches from inactive to active or from active to inactive,
# Segment and stub messages of the ADASIS horizon have to be updated to change the contents of the field "Part of Calculated Route"
# ValueRange: 0, 1
# 0 for "use the update mechanism of ADASIS to resend the changed data"
# 1 for "rebuild the ADASIS horizon from scratch"
# DefaultValue: 1
Adasis_Guided_Route_Change_Handling = 1

# Define ADASIS subpath configuration as a list
# Each line contains the max length of each subpath
# The valueRange of length: 0 .. 8190 in [m]
# The setting is only effective when "Adasis_Level_of_Service" > 3
Adasis_SubPathLength = 100 # First order subpath

# Adasis_SubPathLength += 800 # Second order subpath

# For Speed limit signs in Profile Long Message
# If true: omit weather-dependent speed limit signs if any weather-independent sign at the same location
# If false: provide all speed limit signs without filter
# If not set: Depends on software default
Adasis_SpeedLimitSign_OmitWeatherDependent = true

# For Functional Road Class in Segment Message
# If true: force send '1' for FRC when link is motorway
# If false: refer to DB
# Default value: false
Adasis_Segment_FRC_By_Motorway = false

# Enable Profile Short message 'Curvature' creation if set
# Default value: off
#Adasis_ProfileShort_Curvature = off

# Enable Profile Short message 'Slope' creation if set
# Default value: off
#Adasis_ProfileShort_Slope = off

# Enable Profile Short message 'Road Condition' creation if set
# Default value: off
#Adasis_ProfileShort_RoadCondition = off

# Enable Profile Short message 'Variable Speed Sign' creation if set
# Default value: off
#Adasis_ProfileShort_VarSpeedSign = off

# Enable Profile Short message 'Heading Change' creation if set
# Default value: off
#Adasis_ProfileShort_HeadingChange = off

# Enable Profile Short message 'Traffic Flow' creation if set
# Default value: off
Adasis_ProfileShort_TrafficFlow = on

# Enable Profile Long messages 'Longitude' and 'Latitude' creation if set
# Default value: off
Adasis_ProfileLong_Coordinates = off

# Enable Profile Long message 'Altitude' creation if set
# Default value: off
#Adasis_ProfileLong_Altitude = off

# Enable Profile Long message 'Link Identifier' creation if set
# Default value: off
#Adasis_ProfileLong_Link_Identifier = off

# Enable Profile Long message 'Traffic Sign' creation if set
# Default value: on
Adasis_ProfileLong_Traffic_Sign = on

# Enable Profile Long message 'Extended Lane' creation if set
# Default value: off
#Adasis_ProfileLong_Extended_Lane = off

# Create profile long messages 'Longitude' and 'Latitude' at end of every link
# Note: Useful for analysis of pure ADASISv2 CAN data
# Default value: off
#Adasis_ProfileLong_LinkEndCoord = off

# Enable Profile Long message 'Weather' creation if set
# Default value: off
# Adasis_ProfileLong_Weather = off

#----AdasisWeather settings
# Provide weather info in adasis stream
# AdasisWeather_Enable = OFF

# Create profile long messages 'Traffic Sign' for all speed limits, sign type = 87
# Default value: off
Adasis_ProfileLong_Traffic_Sign_AllSpeedLimits = off

# Enable Profile Long message 'Traffic Event' creation if set
# Default value: off
Adasis_ProfileLong_TrafficEvent = on

# Create Profile Long message 'Traffic Event' for traffic flow
# Default value: off
Adasis_ProfileLong_TrafficEvent_TrafficFlow = off

#----AdasisTraffic settings

# Provide traffic info in adasis stream
Adasis_Traffic = ON

# Name of configuration file containing a traffic_event_type table, which stores the relationship
# between TMC event code and traffic event type for adasis.
# default value: empty path
traffic_event_type_res_file = ${main.path_share}na_serv_ehp/resources/adas/traffic_event_type.ini

