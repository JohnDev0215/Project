dbupdate.deploy            = ./etc/nais/na_dbu_deploy.json     # startup deploy script
dbupdate.deploy            = /sdcard/nena/etc/nais/na_dbu_deploy.json     # startup deploy script


[main]
AbortRetryIgnoreDialog     = false
PrintVersion               = true

# import database and localization configuration
include                    = na_common.ini


# enable or disable interfaces
[interface]

# enable D-Bus interface
dbus = true

# D-Bus (application) name: the name under which the application is visible on the bus. If set to empty string, no
# alias name is assigned to the application.
# Default: empty
dbus_name = com.neusoft.na_dbu

# D-Bus object path for the onecore interfaces. (Default: "/")
dbus_object_path = /

# enable cpp interface
cpp  = true

# enable json interface
json = true

# JSON interface websocket port (default: 22529); set to 0 to disable websocket server functionality
json_port = 22531

# List of external servers to connect to. Each list entry must contain a valid URL including scheme, host address, and port.
# Default: empty, so no connection to external server is established.
json_remotes  = ws://127.0.0.1:22530 # connect to a Telematics instance, for example OneCloudClient

# enable jni interface
jni  = false


[DLT]
PrintConfig                = true
Application                = DBU
AppDescription             = na_dbu
ECU                        = NAV

#WIN32:   Logger           = IPC-Client 127.0.0.1:3491  # connect to an IPC-Server which will collect log data
#LINUX:   Logger           = daemon                     # write DLT container to running DLT-daemon, use logger=genivi to use dlt-library communication
Logger         = Client 127.0.0.1:4715 YES  # connect to DltDroid
#APPLE:   Logger           = Server 3490 NO             # open a log server on localhost:4711, no storage header (added by TempoGiusto)

# log/context output:  0x01=DEBUG, 0x02=WARNING, 0x04=ERROR, 0x08=ASSERTION, 0x10=VERBOSE
#                     0x100=console, 0x400=dlt-daemon, 0x800=devstudio console
#WIN32:   Output           = 0x04ff
Output         = 0x04ff
#APPLE:   Output           = 0x04ff
#LINUX:   Output           = 0x04ff

# example: log all Contexts containing 'abcde' in name, output them to dlt-daemon
# Context                 += .*abcde.* 0x040f
# example: enable verbose logging for hugo message passing
# Context += na::iface::adaptor::hugo::CommunicationTask.* 0x041F
Context       += .*debug    0
Context       += .*trace    0

# enable verbose logging for JSON message passing
Context += na::iface::adaptor::jsonws::JsonWsCommunicationTask::msg 0x041F

# Dump a call stack into the DLT log upon an assertion. Default value: false
# DumpCallStackOnAssertion = false

[dbupdate]
# Configure the location where downloaded incremental NDS updates get stored before they get applied to the DB.
# When not configured here, the default of this switch is the folder "nds_updates" inside the system's temporary folder, i.e.
# on Windows: %TEMP%\nds_updates
# on Linux:   /tmp/nds_updates
# The folder name must contain the case-insensitive substring "update". This is a safety measure because the software
# can completely clean this folder on demand. That check prevents accidential deletion of a misconfigured folder.
# The following setting is only an example (therefore commented-out) and needs to be adjusted to your project-specific storage setup:
download_dir         = ${main.path_temp}var/nais/nds_updates

# Configure the location where incremental NDS updates get extracted/copied after download
# Essential when DBU has no permission to write files in 'download_dir'.
# When not configured here, use the 'download_dir'.
# Possible values : a valid path
# Default value   : empty string
install_dir       =

# Configure the location where the incoming new database files are stored.
# To support a (full) database update while navigation is running, DBU shall install update files into this configured directory.
# Afterwards, exchanging the database directory and 'temp_install_dir' is needed.
# Possible values : a valid path that is preferred to be in the same partition with database directory.
# Default value   : {database_dir}/temp_install_dir
# Note :  Currently only for full update.
# temp_install_dir  =

# Configure the location where the old database files are stored when exchanging database directory.
# To support rollback when exchanging the database directory and temp_install_dir.
# Firstly, move all the old database files to 'temp_delete_dir', and then move all the new database files to database directory,
# Finally, delete the old database files in 'temp_delete_dir'
# Possible values : a valid path that is preferred to be in the same partition with database directory.
# Default value   : {database_dir}/temp_delete_dir
# Note :  Currently only for full update.
# temp_delete_dir   =

# optimize_virtualtable : switch to support to optimize virtual table in FTS after installing incremental update
# Possible values : true, false
# Default value : false
# Note : Many inserts, updates and deletes can break the original b-tree structure of FTS.
#        Doing an optimization will merge all of its index b-trees into one large and complete b-tree,
#        and make subsequent queries run faster since there are fewer b-trees to search.
#        It may reduce disk usage by coalescing redundant entries.
#        Optimization will take much time.
optimize_virtualtable = true

# rbu_vacuum : switch to support RBU VACUUM after installing incremental update
# Possible values : true, false
# Default value : false
# Note : When incremental updates, frequently inserts, updates and deletes can cause the database file to become fragmented.
#        Running VACUUM ensures that each table and index is largely stored contiguously within the database file.
#        In some cases, VACUUM may also reduce the number of partially filled pages in the database, reducing the size of the database file further.
#        VACUUM will take much time.
rbu_vacuum = false

# disk_write_speed : with the speed of writing disk, to calculate the estimated total time/remaining time of database update
# Possible values : Greater than zero
# Default value : 40
# Note : unit is MB per second.
disk_write_speed = 40

# update_validity_check : switch to support to check entanglement file to ensure the update file is valid
# Possible values : true, false
# Default value : false
# Note : Before a full or partial usb update, DBU shall check for the existence of an entanglement file,
#        and to compare the included head unit identifier to the one from the specific head unit.
#        If this switch is on, the 'update_validity_duration' check will be activated.
#        DBU shall check whether update is in the validity duration.
update_validity_check = false

# update_validity_duration : within the duration of update validity, the downloaded update is valid.
# Possible values : Greater than zero
# Default value : 7
# Note : Unit is day.The following setting is only an example and needs to be adjusted to project-specific requirement.
#        It's only activated when 'update_validity_check' is on.
#        Value zero means any update is invalid.
update_validity_duration = 7

# dbupdate_tmppath : the path for temporary files used by SQLite
# Possible values : a valid path or empty
# Note: When not configured here, the default of this config is determined by SQLite is according to OS.
#       Refer to https://www.sqlite.org/tempfiles.html '5. Temporary File Storage Locations'
#       If the temp path is nearly full, SQLite will report 'error=13 Insertion failed because database is full'.
#       Especially, on QNX, the default path is /fs/tmpfs/, of which the size is 16MB.
# on Windows: %TEMP%\var\nais\dbu
# on Linux:   /tmp/var/nais/dbu
# on QNX:     /tmp/var/nais/dbu
dbupdate_tmppath = ${main.path_temp}var/nais/dbu

# max_num_update_install_worker : configure the amount of maximum parallel update installations.
# Possible values : 0 < max_num_update_install_worker < 5.
# Default value : 1
# Note : Count of parallel threads which each can handle a single DBU-Job.
#        Project can limit and control the maximum load. With a default of 1, nothing
#        would change from an external point of view. With 2, we could have two rbu_open/rbu_step/rbu_close
#        operations each targeting a separate building block in parallel, which would bring update time
#        to approximately half in best case, but also blocking half the total available CPU-Time for a
#        time span of some minutes.
max_num_update_install_worker = 1

# enable_progress_rollback: allow to report a smaller progress than the previous reported one in the case of resume.
# Possible values : true, false
# Default value : true
# Note : Usually, the progress reported to user may be discontinuous in the case of resume.
#        If user doesn't accept that, just disable this config, but it might need more time to report next progress.
enable_progress_rollback = true

# column_check : switch to support MD5 column check after installing incremental update
# Possible values : true, false
# Default value : false
# Note : After incremental updates, to avoid the case of inconsistency between the expected contents and real ones,
#        we select some columns in some tables in some building blocks to calculate the md5 checksum.
#        If the calculated md5 checksum equals the one in metadata, column check succeeds, otherwise it fails.
# column_check = false

[online_dbupdate]
# server_url : with the server url, to access the DB server to get available updates and download updated data.
#              only used for online dbupdate service in onecore.
# Possible values : a valid url
# Default value : empty string
# Note : this configuration can be used by integrator or tester to set the server address in current development phase,
#        in future, online dbupdate service implementation will be replaced dynamically, onecore doesn't care the server address,
#        it will be set by business logic to authentication/authorization proxy through special bus communication.
server_url =

# proxy_ip : DBUpdate module network proxy IP setting
# Possible values : xxx.xxx.xxx.xxx
#                      Enable headunit to connect network using this IP
#                      such as "172.31.1.68"   #tempogiusto proxy IP, you need to replace it with a valid proxy ip
#                   empty string
#                      connect network directly
# Default value :   empty string
# Note : this configuration can be used by integrator or tester to enable headunit to connect network using proxy
proxy_ip =

# proxy_port : DBUpdate module network proxy Port setting
# Possible values : xxxxx
#                      Enable headunit to connect network using this port
#                      such as "3128"   #tempogiusto proxy port, you need to replace it with a valid proxy port
#                   empty string
#                      connect network directly
# Default value :   empty string
# Note : this configuration can be used by integrator or tester to enable headunit to connect network using proxy
proxy_port =

# proxy_username : DBUpdate module network proxy authentication username setting
# Possible values : a valid username string
#                      No specified format limit here, but you need to make sure it's valid to access the proxy above
#                   empty string
#                      No authentication
# Default value :   empty string
# Note : this configuration can be used by integrator or tester to enable headunit to connect network using proxy
proxy_username =

# proxy_password : DBUpdate module network proxy authentication password setting
# Possible values : a valid password string
#                      No specified format limit here, but you need to make sure it's valid to access the proxy above
#                   empty string
#                      No authentication. or no password needed if username exists
# Default value :   empty string
# Note : this configuration can be used by integrator or tester to enable headunit to connect network using proxy
proxy_password =

# save_state_interval : The interval of calling sqlite3rbu_savestate every 'save_state_interval' operations while in incremental update
# Possible value : the total number of key-value operations (inserts, deletes or updates) that have been performed on the target database,
#                  such as 10000, 20000, 30000, 50000, 100000 ...
#                  it will be set by business logic according to performance of specific devices.
# Default value :  50000
# Note: Periodically calling sqlite3rbu_savestate() might speed up the slow sqlite3rbu_step() calls that themselves need to call fsync()
#       on modified files, and contribute to update resume from the point of the saved state in case of power failure or application crash.
# save_state_interval =
