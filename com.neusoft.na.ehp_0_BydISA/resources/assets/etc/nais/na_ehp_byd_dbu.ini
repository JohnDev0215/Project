# This file contains GreatWall specific custom overrides for na_dbu.ini. This file
# should not contain target specific configurations, but generic configurations
# for MOTS across all platforms.

# Note: additional Android specific switches can be found in
#       integration\mots\android\ocservice\src\main\java\com\neusoft\na\ocservice\DbuService.kt

# TODO: not sure if NDS configuration is needed or is to be supplied by the MOTS BL
[nds]
   database                               = ${main.path_mapdata}NeusoftISA/db/ROOT.NDS

[dbupdate]
# Configure the location where the incoming new database files are stored.
# To support a (full) database update while navigation is running, DBU shall install update files into this configured directory.
# Afterwards, exchanging the database directory and 'temp_install_dir' is needed.
# Possible values : a valid path that is preferred to be in the same partitaion with database directory.
# Default value   : {database_dir}/temp_install_dir
# Note :  Currently only for full update.
   temp_install_dir                       = ${main.path_mapdata}NeusoftISA/temp_install_dir

# Configure the location where the old database files are stored when exchanging database directory.
# To support rollback when exchanging the database directory and temp_install_dir.
# Firstly, move all the old database files to 'temp_delete_dir', and then move all the new database files to database directory,
# Finally, delete the old database files in 'temp_delete_dir'
# Possible values : a valid path that is preferred to be in the same partitaion with database directory.
# Default value   : {database_dir}/temp_delete_dir
# Note :  Currently only for full update.
   temp_delete_dir                        = ${main.path_mapdata}NeusoftISA/temp_delete_dir

# rbu_vacuum : switch to support RBU VACUUM after installing incremental update
# Possible values : true, false
# Default value : false
# Note : When incremental updates, frequently inserts, updates and deletes can cause the database file to become fragmented.
#        Running VACUUM ensures that each table and index is largely stored contiguously within the database file.
#        In some cases, VACUUM may also reduce the number of partially filled pages in the database, reducing the size of the database file further.
#        VACUUM will take much time.
   rbu_vacuum = true

# enable_progress_rollback: allow to report a smaller progress than the previous reported one in the case of resume.
# Possible values : true, false
# Default value : true
# Note : Usually, the progress reported to user may be discontinuous in the case of resume.
#        If user dosen't accept that, just disable this config, but it might need more time to report next progress.
   enable_progress_rollback = false

# Configure the location where downloaded incremental NDS updates get stored before they get applied to the DB.
# When not configured here, the default of this switch is the folder "nds_updates" inside the system's temporary folder, i.e.
# on Windows: %TEMP%\nds_updates
# on Linux:   /tmp/nds_updates
# The folder name must contain the case-insensitive substring "update". This is a safety measure because the software
# can completely clean this folder on demand. That check prevents accidential deletion of a misconfigured folder.
# The following setting is only an example (therefore commented-out) and needs to be adjusted to your project-specific storage setup:
   download_dir         = ${main.path_mapdata}NeusoftISA/nds_updates

#[DLT]
#   Output    = 0x0000
#   Context   = .* 0x0

[manager]
# disable OnlineDBUManager from OC_DBU
   enable_OnlineDBUManager                = false
   enable_FCallCppFacadeDbUpdateOnline    = true

[interface]
   cpp                                    = true
   dbus                                   = false
   json                                   = false
